<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>轻小说俏皮画集状态卡</title>
    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Helvetica Neue", "Comic Sans MS", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: transparent;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
        }

        /* 动画定义：俏皮丝滑效果 */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulse {
            0% { transform: scale(1) rotate(15deg); }
            50% { transform: scale(1.1) rotate(15deg); }
            100% { transform: scale(1) rotate(15deg); }
        }

        @keyframes swing {
            0% { transform: rotate(-4deg); }
            50% { transform: rotate(-2deg); }
            100% { transform: rotate(-4deg); }
        }

        /* 超级可爱的外层卡片容器 */
        .card {
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            padding: 24px 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15), inset 0 0 0 8px rgba(255, 255, 255, 0.5);
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 18px;
            border: 3px solid #333;
            z-index: 1;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* 背景：斜线与波点堆砌区 */
        .card-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background-color: #fafafa;
            background-image:
                radial-gradient(#ddd 2px, transparent 2px),
                linear-gradient(45deg, transparent 45%, rgba(0,0,0,0.03) 45%, rgba(0,0,0,0.03) 55%, transparent 55%);
            background-size: 16px 16px, 30px 30px;
        }

        /* 第一区：二次元排版头像与名字 */
        .header-section {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        /* 像拍立得一样的倾斜头像 */
        .avatar-wrap {
            position: relative;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 15px;
            background: #eee;
            border: 4px solid #fff;
            box-shadow: 4px 4px 0 #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            position: relative;
            z-index: 2;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            transition: all 0.3s ease;
        }

        .avatar-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 25%;
            transform: translateZ(0);
        }

        .avatar-wrap:hover .avatar {
            transform: scale(1.05);
            box-shadow: 6px 6px 0 #333;
        }

        /* 假胶带装饰 */
        .avatar-wrap::after {
            content: '';
            position: absolute;
            top: -10px; right: -15px;
            width: 40px; height: 16px;
            background: rgba(255, 255, 255, 0.7);
            transform: rotate(15deg);
            z-index: 3;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .name-info {
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }

        .cn-name {
            font-size: 32px;
            font-weight: 900;
            line-height: 1.1;
            text-shadow: 2px 2px 0 #fff, 4px 4px 0 #ccc;
            letter-spacing: 1px;
            position: relative;
            transition: text-shadow 0.3s ease;
        }

        .header-section:hover .cn-name {
            text-shadow: 3px 3px 0 #fff, 6px 6px 0 #ccc;
        }

        .jp-name {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-top: 4px;
            background: #333;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            align-self: flex-start;
            transform: skewX(-10deg);
        }

        /* 绝对定位的可爱元素 SVG版 */
        .star-deco {
            position: absolute;
            top: -15px; right: 10px;
            width: 30px; height: 30px;
            transform: rotate(15deg);
            animation: pulse 3s infinite ease-in-out;
        }

        /* 第二区：元气满满的状态标签 */
        .meta-section {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 5px;
        }

        .meta-tag {
            min-width: 0;
            overflow-wrap: anywhere;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fff;
            border: 2px solid #333;
            box-shadow: 3px 3px 0 #ccc;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .meta-tag:hover {
            transform: translateY(-3px) scale(1.05) !important;
            box-shadow: 5px 5px 0 #333 !important;
            cursor: default;
        }

        .meta-tag:nth-child(1) { transform: rotate(-1deg); animation: float 4s ease-in-out infinite; }
        .meta-tag:nth-child(2) { transform: rotate(1deg); animation: float 4.5s ease-in-out infinite 0.5s; }
        .meta-tag:nth-child(3) { transform: rotate(-2deg); animation: float 3.5s ease-in-out infinite 1s; }

        .tag-icon {
            width: 16px; height: 16px;
            display: block;
        }

        /* 第三区：手账风打扮栏 */
        .outfit-section {
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 14px 20px 15px 35px;
            border-radius: 12px;
            background: repeating-linear-gradient(
                180deg,
                #fff,
                #fff 24px,
                #f0f0f0 24px,
                #f0f0f0 25px
            );
            border: 2px dashed #999;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .outfit-section:hover {
            transform: translateX(4px);
            box-shadow: 6px 6px 0 rgba(0,0,0,0.1);
        }

        /* 装饰水印 SVG */
        .outfit-bg-deco {
            position: absolute;
            bottom: -10px; right: -10px;
            width: 80px; height: 80px;
            opacity: 0.1;
            transform: rotate(-15deg);
            pointer-events: none;
            transition: transform 0.5s ease;
        }
        .outfit-section:hover .outfit-bg-deco {
            transform: rotate(0deg) scale(1.1);
        }

        /* 手账本打孔效果 */
        .outfit-section::before {
            content: '';
            position: absolute;
            left: 10px; top: 10px; bottom: 10px;
            width: 8px;
            background: radial-gradient(circle, #333 4px, transparent 5px);
            background-size: 100% 20px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 900;
            color: #fff;
            background: #333;
            padding: 3px 12px;
            border-radius: 20px;
            position: static;
            align-self: flex-end;
            margin: 0 0 8px 0;
            transform: rotate(3deg);
            z-index: 2;
            max-width: 100%;
            overflow-wrap: break-word;
        }

        .outfit-text {
            font-size: 15px;
            line-height: 25px;
            color: #444;
            font-weight: bold;
            position: relative;
            z-index: 1;
            overflow-wrap: break-word;
        }

        /* 第四区：漫画气泡内心话 */
        .voice-section {
            position: relative;
            padding: 18px 22px;
            border-radius: 20px;
            background: #fff;
            border: 3px solid #333;
            box-shadow: 6px 6px 0 #ccc;
            margin-top: 5px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .voice-section:hover {
            transform: scale(1.02);
            box-shadow: 8px 8px 0 #333;
        }

        /* 气泡小尾巴 */
        .voice-section::after {
            content: '';
            position: absolute;
            top: -15px; left: 40px;
            width: 20px; height: 20px;
            background: #fff;
            border-left: 3px solid #333;
            border-top: 3px solid #333;
            transform: skewY(30deg) rotate(15deg);
            z-index: -1;
        }

        .voice-bg-deco {
            position: absolute;
            top: 5px; left: 5px;
            width: 40px; height: 40px;
            opacity: 0.05;
            pointer-events: none;
        }

        .voice-text {
            font-size: 16px;
            line-height: 1.7;
            font-weight: 900;
            color: #222;
            position: relative;
            z-index: 1;
        }

        /* ================= 最底部的插画区 (完美适配832x1216) ================= */
        .gallery-wrapper {
            position: relative;
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background: #fff;
            border: 3px solid #333;
            border-radius: 12px;
            box-shadow: 8px 8px 0 #ccc;
            transform: rotate(-1deg);
            transition: all 0.4s ease;
        }

        .gallery-wrapper:hover {
            transform: rotate(0deg) translateY(-2px);
            box-shadow: 10px 10px 0 #333;
        }

        .gallery-wrapper::after {
            content: 'NO. 01 / SNAPSHOT / SECRET MEMORY ★';
            display: block;
            text-align: center;
            font-weight: 900;
            font-size: 12px;
            color: #333;
            margin-top: 8px;
            letter-spacing: 2px;
        }

        .gallery-inner {
            width: 100%;
            aspect-ratio: 832 / 1216;
            border-radius: 6px;
            overflow: hidden;
            border: 2px solid #333;
            background: #f8f8f8;
            position: relative;
        }

        .gallery-img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

                /* NSFW翻转：点击画廊图翻转到裏面，再点翻回 */
        .gallery-img{cursor:pointer}
        .gallery-img.nsf-flipping{transform:rotateY(90deg);transition:transform .18s ease}
        .gallery-inner{perspective:1200px}
        .nsf-badge{position:absolute;left:8px;bottom:8px;z-index:5;font-size:10px;font-weight:900;letter-spacing:2px;color:#fff;background:rgba(51,51,51,.85);border-radius:8px;padding:2px 8px;pointer-events:none}
        .nsf-badge--on{background:rgba(185,28,28,.92)}
        @media (prefers-reduced-motion: reduce){.gallery-img.nsf-flipping{transition:none !important;transform:none !important}}
/* 悬停缩放已移除：变换会迫使图片层重采样，造成闪烁；只保留外框阴影变化 */

        .gallery-placeholder {
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%, #eee),
                              linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%, #eee);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            font-weight: 900;
            color: #aaa;
            font-size: 24px;
            letter-spacing: 4px;
            text-shadow: 1px 1px 0 #fff;
        }

        .tape-deco {
            position: absolute;
            top: -8px; left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            width: 80px; height: 25px;
            background: rgba(255, 200, 200, 0.8);
            border-left: 2px dashed #ff9999;
            border-right: 2px dashed #ff9999;
            z-index: 5;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        /* ================= 专属主题：澪 (清冷苏打水，冰蓝四芒星) ================= */
        .theme-mio { border-color: #0284c7; }
        .theme-mio .avatar { border-color: #bae6fd; box-shadow: 4px 4px 0 #0284c7; color: #0284c7; }
        .theme-mio .header-section:hover .cn-name { text-shadow: 3px 3px 0 #fff, 6px 6px 0 #7dd3fc; }
        .theme-mio .cn-name { text-shadow: 2px 2px 0 #fff, 4px 4px 0 #7dd3fc; color: #0369a1; }
        .theme-mio .jp-name { background: #0284c7; }
        .theme-mio .star-deco { color: #7dd3fc; filter: drop-shadow(1px 1px 0 #333); }
        .theme-mio .meta-tag { border-color: #0284c7; box-shadow: 3px 3px 0 #bae6fd; color: #0284c7; }
        .theme-mio .meta-tag:hover { box-shadow: 5px 5px 0 #0284c7 !important; }
        .theme-mio .tag-icon { color: #0284c7; }
        .theme-mio .outfit-section { border-color: #7dd3fc; }
        .theme-mio .outfit-bg-deco { fill: #0284c7; }
        .theme-mio .section-title { background: #0284c7; }
        .theme-mio .voice-section { border-color: #0284c7; box-shadow: 6px 6px 0 #bae6fd; }
        .theme-mio .voice-section:hover { box-shadow: 8px 8px 0 #0284c7; }
        .theme-mio .voice-section::after { border-color: #0284c7; }
        .theme-mio .voice-bg-deco { fill: #0284c7; }
        .theme-mio .gallery-wrapper { border-color: #0284c7; box-shadow: 8px 8px 0 #bae6fd; }

        /* 第七区：画廊仓库（小按钮 + 浮层 + 折叠） */
        .vault-link {
            display: block;
            margin: 10px auto 4px;
            background: transparent;
            border: none;
            font-family: inherit;
            font-size: 11px;
            letter-spacing: 3px;
            color: #a8a8a8;
            cursor: pointer;
            padding: 4px 10px;
        }
        .vault-link:hover { color: #555; text-decoration: underline; }

        .vault-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(20, 22, 34, 0.72);
            align-items: center;
            justify-content: center;
            padding: 18px;
        }
        .vault-overlay--open { display: flex; }
        .vault-panel {
            width: 100%;
            max-width: 480px;
            max-height: 78vh;
            display: flex;
            flex-direction: column;
            background: #fffdf5;
            border: 3px solid #333;
            border-radius: 14px;
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.4);
            overflow: hidden;
            color: #333;
        }
        .vault-panel-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-bottom: 2px dashed rgba(0, 0, 0, 0.12);
            flex: none;
        }
        .vault-title { font-weight: 900; font-size: 14px; letter-spacing: 2px; }
        .vault-count { margin-left: 4px; font-size: 11px; font-weight: 800; color: #888; }
        .vault-close {
            margin-left: auto;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid #333;
            background: #fff;
            color: #333;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
        }
        .vault-passrow { display: flex; gap: 8px; margin: 10px 12px 2px; flex: none; }
        .vault-pass {
            flex: 1;
            min-width: 0;
            font-family: inherit;
            font-size: 12px;
            padding: 8px 10px;
            border-radius: 8px;
            border: 2px solid #333;
            background: #fff;
            color: #333;
        }
        .vault-go {
            flex: none;
            font-family: inherit;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1px;
            padding: 8px 14px;
            border-radius: 8px;
            border: 2px solid #333;
            background: #ffd66e;
            color: #333;
            cursor: pointer;
            box-shadow: 2px 2px 0 #333;
        }
        .vault-go:active { transform: translateY(1px); box-shadow: 1px 1px 0 #333; }
        .vault-groups { overflow-y: auto; padding: 2px 12px 12px; }
        .vault-tabs { display: flex; gap: 8px; padding: 8px 12px 0; flex: none; }
        .vault-tab { flex: 1; font-family: inherit; font-size: 13px; font-weight: 900; letter-spacing: 2px; padding: 8px 6px; border-radius: 10px 10px 0 0; border: 2px solid #333; border-bottom: none; background: #eee; color: #777; cursor: pointer; }
        .vault-tab--active { background: #fff; color: #333; }
        .vault-tab--nsfw.vault-tab--active { background: #333; color: #ffb3c1; }
        .vault-pane { display: none; }
        .vault-pane--open { display: block; }
        .vault-chrow { display: flex; gap: 8px; padding: 8px 0 2px; position: sticky; top: 0; background: #fffdf5; z-index: 5; padding-top: 8px; }
        .vault-ch { flex: 1; font-family: inherit; font-size: 12px; font-weight: 900; letter-spacing: 6px; padding: 6px; border-radius: 8px; border: 2px solid #333; background: #fff; color: #777; cursor: pointer; }
        .vault-ch--active { background: #333; color: #fff; }
        .vault-pane.ch-he [data-ch="mio"]:not(.vault-ch) { display: none; }
        .vault-pane.ch-mio [data-ch="he"]:not(.vault-ch) { display: none; }
        .card.vault-open, .card.vault-open:hover { transform: none !important; }
        .card.vault-open .gallery-wrapper:hover { transform: none !important; }
        .card.vault-open .map-toggle:hover { transform: none !important; }
        .card.vault-open .uw-pin { pointer-events: none !important; }
        .vault-scene, .vault-act {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 7px 4px;
            background: transparent;
            border: none;
            border-bottom: 2px dashed rgba(0, 0, 0, 0.12);
            font-family: inherit;
            cursor: pointer;
            color: #333;
        }
        .vault-scene { font-size: 13px; font-weight: 900; letter-spacing: 1px; }
        .vault-act { font-size: 12px; font-weight: 700; padding-left: 14px; }
        .vault-scene .vault-arrow, .vault-act .vault-arrow { margin-left: auto; font-size: 11px; color: #888; }
        .vault-scene-body, .vault-act-body { display: none; }
        .vault-scene-body--open, .vault-act-body--open { display: block; }
        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(62px, 1fr));
            gap: 6px;
            padding: 8px 0 8px 14px;
        }
        .vault-thumb img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #333;
            display: block;
            background: #eee;
        }
        button.vault-thumb {
            background: none;
            border: none;
            padding: 0;
            font-family: inherit;
            cursor: zoom-in;
        }
        .uw-viewer {
            display: flex;
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(15, 17, 28, 0.88);
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.18s ease, visibility 0.18s;
        }
        .uw-viewer--open {
            opacity: 1;
            visibility: visible;
        }
        .uw-viewer-img {
            max-width: 94vw;
            max-height: 86vh;
            object-fit: contain;
            border-radius: 10px;
            border: 3px solid #fff;
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.6);
        }
        .uw-viewer-close {
            position: absolute;
            top: 14px;
            right: 16px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
        }
        .vault-locked {
            aspect-ratio: 1;
            border-radius: 8px;
            background: #2b2f3a;
            color: #8b93a7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            border: 2px dashed #4a5162;
        }
        .theme-mio .gallery-wrapper:hover { box-shadow: 10px 10px 0 #0284c7; }
        .theme-mio .gallery-inner { border-color: #0284c7; }
        .theme-mio .tape-deco { background: rgba(186, 230, 253, 0.8); border-color: #38bdf8; }

        /* ================= 专属主题：鹤 (元气向日葵，暖阳五角星) ================= */
        .theme-tsuru { border-color: #ea580c; }
        .theme-tsuru .avatar { border-color: #fde047; box-shadow: 4px 4px 0 #ea580c; color: #ea580c; }
        .theme-tsuru .header-section:hover .cn-name { text-shadow: 3px 3px 0 #fff, 6px 6px 0 #fdba74; }
        .theme-tsuru .cn-name { text-shadow: 2px 2px 0 #fff, 4px 4px 0 #fdba74; color: #c2410c; }
        .theme-tsuru .jp-name { background: #ea580c; }
        .theme-tsuru .star-deco { color: #facc15; filter: drop-shadow(1px 1px 0 #333); }
        .theme-tsuru .meta-tag { border-color: #ea580c; box-shadow: 3px 3px 0 #fdba74; color: #c2410c; }
        .theme-tsuru .meta-tag:hover { box-shadow: 5px 5px 0 #ea580c !important; }
        .theme-tsuru .tag-icon { color: #ea580c; }
        .theme-tsuru .outfit-section { border-color: #fb923c; }
        .theme-tsuru .outfit-bg-deco { fill: #ea580c; }
        .theme-tsuru .section-title { background: #ea580c; }
        .theme-tsuru .voice-section { border-color: #ea580c; box-shadow: 6px 6px 0 #fde047; }
        .theme-tsuru .voice-section:hover { box-shadow: 8px 8px 0 #ea580c; }
        .theme-tsuru .voice-section::after { border-color: #ea580c; }
        .theme-tsuru .voice-bg-deco { fill: #ea580c; }
        .theme-tsuru .gallery-wrapper { border-color: #ea580c; box-shadow: 8px 8px 0 #fde047; transform: rotate(1deg); }
        .theme-tsuru .gallery-wrapper:hover { box-shadow: 10px 10px 0 #ea580c; transform: rotate(0deg) translateY(-2px); }
        .theme-tsuru .gallery-inner { border-color: #ea580c; }

        .uw-map-caption {

        /* 地点图钉 */
        .uw-pin {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 22px;
            height: 22px;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            z-index: 2;
        }

        .uw-pin::before {
            content: '';
            position: absolute;
            inset: -7px;
            border-radius: 50%;
        }

        .uw-pin-dot {
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: var(--uw-pin-color, #0ea5e9);
            border: 2px solid #fff;
            box-shadow: 1px 2px 3px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(51, 51, 51, 0.55);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        @media (hover: hover) {
            .uw-pin:hover {
                z-index: 10;
            }

            .uw-pin:hover .uw-pin-dot {
                transform: scale(1.45);
                box-shadow: 2px 3px 5px rgba(0, 0, 0, 0.5), 0 0 0 2px #333;
            }
        }

        .uw-pin:focus-visible .uw-pin-dot,
        .uw-pin--sel .uw-pin-dot {
            transform: scale(1.45);
            box-shadow: 2px 3px 5px rgba(0, 0, 0, 0.5), 0 0 0 2px #333;
        }

        .uw-pin:focus-visible {
            outline: none;
        }

        .uw-pin--sel {
            z-index: 12;
        }

        .uw-pin--now {
            z-index: 11;
        }

        .uw-pin--now .uw-pin-dot {
            background: #f59e0b;
            box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px rgba(245, 158, 11, 0.6), 1px 2px 3px rgba(0, 0, 0, 0.45);
        }

        .uw-pin--now .uw-pin-dot::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2.5px solid rgba(245, 158, 11, 0.85);
            animation: uw-now-ring 2s ease-out infinite;
        }

        @keyframes uw-now-ring {
            0% { transform: scale(1); opacity: 0.9; }
            70%, 100% { transform: scale(2.1); opacity: 0; }
        }

        /* 地点介绍气泡 */
        .uw-tip {
            position: absolute;
            z-index: 40;
            width: max-content;
            max-width: 215px;
            background: #fff;
            border: 2.5px solid #333;
            border-radius: 10px;
            box-shadow: 4px 4px 0 rgba(51, 51, 51, 0.35);
            padding: 8px 10px;
            transform: translate(-50%, calc(-100% - 14px));
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .uw-tip--show {
            opacity: 1;
        }

        .uw-tip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 7px solid transparent;
            border-top-color: #333;
        }

        .uw-tip--l {
            transform: translate(-12%, calc(-100% - 14px));
        }

        .uw-tip--l::after {
            left: 12%;
        }

        .uw-tip--r {
            transform: translate(-88%, calc(-100% - 14px));
        }

        .uw-tip--r::after {
            left: 88%;
        }

        .uw-tip--below {
            transform: translate(-50%, 16px);
        }

        .uw-tip--below::after {
            top: auto;
            bottom: 100%;
            border-top-color: transparent;
            border-bottom-color: #333;
        }

        .uw-tip--below.uw-tip--l {
            transform: translate(-12%, 16px);
        }

        .uw-tip--below.uw-tip--l::after {
            left: 12%;
        }

@media (hover: hover) {

        /* ========== 获取消息内容 ========== */
        function getMessageData() {
            var chatMessages = getChatMessages(getCurrentMessageId());
            if (!chatMessages || chatMessages.length === 0) return null;
            return chatMessages[0].message;
        }

        /* ========== 解析数据 ========== */
        function parseData(messageText) {
            var result = {
                role: '未知', jpName: '', time: '未知',
                location: '未知', weather: '未知',
                imgUrl: '', outfit: '无描述', voice: '...'
            };

            var tagMatch = messageText.match(/<status_panel>([\s\S]*?)<\/status_panel>/);
            if (!tagMatch || !tagMatch[1]) return null;

            var lines = tagMatch[1].trim().split('\n');
            lines.forEach(function(line) {
                var match = line.match(/\[(.*?)\|(.*?)\]/);
                if (match && match.length >= 3) {
                    var key = match[1].trim();
                    var value = match[2].trim();
                    if (key === '角色') result.role = value;
                    else if (key === '日文名') result.jpName = value;
                    else if (key === '时间') result.time = value;
                    else if (key === '地点') result.location = value;
                        else if (key === '澪位置') result.mioLoc = value;
                        else if (key === '鹤位置') result.tsuruLoc = value;
                    else if (key === '天气') result.weather = value;
                    else if (key === '插图') result.imgUrl = value;
                    else if (key === '打扮') result.outfit = value;
                    else if (key === '内心话') result.voice = value;
                }
            });
            result.raw = messageText;
            return result;
        }

                var sx = e.clientX, sy = e.clientY;

        function uwMarkCurrent(locationStr) {
            var canvas = uwGetCanvas();
            if (!canvas) return;
            var nowPins = canvas.querySelectorAll('.uw-pin--now');
            for (var i = 0; i < nowPins.length; i++) nowPins[i].classList.remove('uw-pin--now');
            var hit = uwMatchLocation(locationStr);
            if (hit < 0) return;
            var pinEl = canvas.querySelector('.uw-pin[data-idx="' + hit + '"]');
            if (pinEl) pinEl.classList.add('uw-pin--now');
        }

        function uwMarkCharacters(data) {
            var canvas = uwGetCanvas();
            if (!canvas) return;
            var olds = canvas.querySelectorAll('.uw-char');
            for (var i = 0; i < olds.length; i++) olds[i].parentNode.removeChild(olds[i]);
            var byPin = {};
            UW_MAP.chars.forEach(function(ch) {
                var loc = data[ch.field];
                if (!loc) return;
                var idx = uwMatchLocation(loc);
                if (idx < 0) return;
                if (!byPin[idx]) byPin[idx] = [];
                byPin[idx].push({ ch: ch, loc: loc });
            });
            Object.keys(byPin).forEach(function(idxStr) {
                var idx = parseInt(idxStr, 10);
                var pinEl = canvas.querySelector('.uw-pin[data-idx="' + idx + '"]');
                if (!pinEl) return;
                var list = byPin[idxStr];
                list.forEach(function(item, i) {
                    var offset = Math.round((i - (list.length - 1) / 2) * 34);
                    var el = document.createElement('div');
                    el.className = 'uw-char';
                    el.style.left = pinEl.style.left;
                    el.style.top = pinEl.style.top;
                    el.style.transform = 'translate(calc(-50% + ' + offset + 'px), calc(-100% - 8px))';
                    el.style.setProperty('--uw-char-color', item.ch.color);
                    el.setAttribute('role', 'img');
                    el.setAttribute('aria-label', item.ch.name + '当前在' + UW_MAP.pins[idx].name);
                    var img = document.createElement('img');
                    img.className = 'uw-char-img';
                    img.src = item.ch.img;
                    img.alt = '';
                    img.draggable = false;
                    img.decoding = 'async';
                    var chip = document.createElement('span');
                    chip.className = 'uw-char-name';
                    chip.textContent = item.ch.name;
                    el.appendChild(img);
                    el.appendChild(chip);
                    canvas.appendChild(el);
                });
            });
        }

        function renderMap(data) {
            var sectionEl = document.querySelector('.uw-map');
            if (!sectionEl) return;
            if (!sectionEl.dataset.uwBuilt) {
                try {
                    uwBuildMap(sectionEl);
                    sectionEl.dataset.uwBuilt = '1';
                } catch (mapErr) {
                    sectionEl.dataset.uwBuilt = '1';
                    console.error('[UW_MAP] init failed:', mapErr);
                }
            }
            uwMarkCurrent(data.location);
            uwMarkCharacters(data);
        }

        function uwQChar(roleName) {
            if (roleName && roleName.indexOf('澪') !== -1) return '澪';
            if (roleName && roleName.indexOf('鹤') !== -1) return '鹤';
            return '澪';
        }

        function uwQFile(ch, emotion) {
            return UW_Q.base + encodeURIComponent(ch + '_' + emotion + '_q.png');
        }

        function uwDetectEmotion(rawText, roleName) {
            var ch = uwQChar(roleName);
            if (!rawText) return '平淡';
            var re = new RegExp('\\[[^\\]|]*' + ch + '[^\\]|]*\\|([^\\]|]{1,6})\\]', 'g');
            var m, last = null;
            while ((m = re.exec(rawText)) !== null) {
                var word = m[1].replace(/^\s+|\s+$/g, '');
                if (UW_Q.emotionMap[word] !== undefined) last = word;
            }
            if (!last) return '平淡';
            return UW_Q.emotionMap[last] || '平淡';
        }

        function uwSetQImg(imgEl, url, onDone) {
            var pre = new Image();
            pre.onload = function() {
                imgEl.classList.remove('uw-q-loading');
                imgEl.src = url;
                if (onDone) onDone();
            };
            pre.onerror = function() {
                imgEl.classList.remove('uw-q-loading');
                imgEl.classList.add('uw-q-error');
                if (onDone) onDone();
            };
            pre.src = url;
        }

        function uwCheckFlatBg(imgEl) {
            try {
                var c = document.createElement('canvas');
                c.width = 64;
                c.height = 64;
                var g = c.getContext('2d');
                if (!g) return;
                g.drawImage(imgEl, 0, 0, 64, 64);
                var d = g.getImageData(0, 0, 64, 64).data;
                var white = true;
                for (var y = 0; y < 64 && white; y++) {
                    for (var x = 0; x < 64; x++) {
                        if (x > 1 && x < 62 && y > 1 && y < 62) continue;
                        var k = (y * 64 + x) * 4;
                        if (d[k + 3] > 250 && (d[k] < 243 || d[k + 1] < 243 || d[k + 2] < 243)) { white = false; break; }
                    }
                }
                imgEl.classList.toggle('uw-q-img--flat', white);
            } catch (e) { /* 画布被跨域污染时保持默认显示 */ }
        }

        var uwQState = { ch: '澪', emotion: '平淡', dragging: false };

        function uwSetQEmotion(emotion) {
            uwQState.emotion = emotion;
            var img = document.querySelector('.uw-q-img');
            if (img) {
                img.classList.remove('uw-q-error');
                uwSetQImg(img, uwQFile(uwQState.ch, emotion));
            }
            var chibi = document.querySelector('.uw-q-chibi');
            if (chibi) chibi.setAttribute('aria-label', '潮见' + uwQState.ch + '的Q版形象（' + emotion + '）：点击打开音乐盒，可拖动');
        }

        function uwSetGrab(on) {
            var img = document.querySelector('.uw-q-img');
            var btn = document.querySelector('.uw-q-chibi');
            var bubble = document.querySelector('.uw-q-bubble');
            if (!img || !btn || !bubble) return;
            btn.classList.toggle('uw-q-chibi--grab', on);
            if (on) {
                img.classList.remove('uw-q-error');
                uwSetQImg(img, uwQFile(uwQState.ch, '抓起'));
                bubble.textContent = UW_Q.bubble[uwQState.ch] || '放我下来～';
                bubble.classList.add('uw-q-bubble--show');
            } else {
                bubble.classList.remove('uw-q-bubble--show');
                uwSetQEmotion(uwQState.emotion);
            }
        }

        function uwBuildQ(sectionEl) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'uw-q-chibi';
            btn.setAttribute('aria-label', 'Q版小人：点击打开音乐盒，可拖动');
            var img = document.createElement('img');
            img.className = 'uw-q-img';
            img.alt = '';
            img.crossOrigin = 'anonymous';
            img.draggable = false;
            img.decoding = 'async';
            img.addEventListener('load', function() { uwCheckFlatBg(img); });
            btn.appendChild(img);

            var bubble = document.createElement('span');
            bubble.className = 'uw-q-bubble';
            bubble.setAttribute('aria-hidden', 'true');

            btn.appendChild(bubble);
            sectionEl.appendChild(btn);

            var hoverable = window.matchMedia
                && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
            var drag = { on: false, moved: false, sx: 0, sy: 0, ox: 0, oy: 0 };

            function clampPos(nx, ny) {
                var maxX = sectionEl.clientWidth - btn.offsetWidth;
                var maxY = sectionEl.clientHeight - btn.offsetHeight;
                return {
                    x: Math.max(0, Math.min(nx, maxX)),
                    y: Math.max(0, Math.min(ny, maxY))
                };
            }

            btn.addEventListener('pointerdown', function(e) {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                drag.on = true;
                drag.moved = false;
                drag.sx = e.clientX;
                drag.sy = e.clientY;
                var br = btn.getBoundingClientRect();
                var sr = sectionEl.getBoundingClientRect();
                drag.ox = br.left - sr.left;
                drag.oy = br.top - sr.top;
                try { btn.setPointerCapture(e.pointerId); } catch (pe) {}
                e.preventDefault();
            });

            btn.addEventListener('pointermove', function(e) {
                if (!drag.on) return;
                var dx = e.clientX - drag.sx;
                var dy = e.clientY - drag.sy;
                if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 6) {
                    drag.moved = true;
                    uwQState.dragging = true;
                    uwSetGrab(true);
                }
                if (drag.moved) {
                    var p = clampPos(drag.ox + dx, drag.oy + dy);
                    btn.style.left = p.x + 'px';
                    btn.style.top = p.y + 'px';
                    btn.style.right = 'auto';
                    btn.style.bottom = 'auto';
                }
            });

            function endDrag(e) {
                if (!drag.on) return;
                drag.on = false;
                if (drag.moved) {
                    uwQState.dragging = false;
                    uwSetGrab(false);
                    uwQSuppressClick = true;
                    setTimeout(function() { uwQSuppressClick = false; }, 0);
                }
                try { btn.releasePointerCapture(e.pointerId); } catch (pe) {}
            }
            btn.addEventListener('pointerup', endDrag);
            btn.addEventListener('pointercancel', endDrag);

            if (hoverable) {
                btn.addEventListener('mouseenter', function() {
                    if (!uwQState.dragging) {
                        var img2 = document.querySelector('.uw-q-img');
                        if (img2) {
                            img2.classList.remove('uw-q-error');
                            uwSetQImg(img2, uwQFile(uwQState.ch, '嫌弃'));
                        }
                    }
                });
                btn.addEventListener('mouseleave', function() {
                    if (!uwQState.dragging) uwSetQEmotion(uwQState.emotion);
                });
            }

            btn.addEventListener('click', function() {
                if (uwQSuppressClick) { uwQSuppressClick = false; return; }
                uwOpenPlayer();
            });
        }

        function uwInitQ(data) {
            var sectionEl = document.querySelector('.q-widget');
            if (!sectionEl) return;
            if (!sectionEl.dataset.qBuilt) {
                try {
                    uwBuildQ(sectionEl);
                    sectionEl.dataset.qBuilt = '1';
                } catch (qErr) {
                    sectionEl.dataset.qBuilt = '1';
                    console.error('[UW_Q] init failed:', qErr);
                }
            }
            uwQState.ch = uwQChar(data.role);
            uwSetQEmotion(uwDetectEmotion(data.raw, data.role));
        }

        /* ================= 音乐盒 ================= */
        var uwPlayer = { audio: null, idx: -1, opener: null, shuffle: false, list: 0 };
        var uwQSuppressClick = false;

        function uwFmtTime(sec) {
            if (!isFinite(sec)) return '0:00';
            var m = Math.floor(sec / 60);
            var s = Math.floor(sec % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        function uwAudioEl() {
            if (!uwPlayer.audio) {
                uwPlayer.audio = new Audio();
                uwPlayer.audio.volume = 0.85;
                uwPlayer.audio.preload = 'auto';
                uwPlayer.audio.addEventListener('error', function() {
                    var a = uwPlayer.audio;
                    if (!a || !a.src) return;
                    var sub = document.querySelector('.uw-player-sub');
                    var att = 0;
                    try { att = parseInt(a.dataset.uwAtt || '0', 10) || 0; } catch (e) {}
                    if (att < 1) {
                        try { a.dataset.uwAtt = '1'; } catch (e) {}
                        if (sub) sub.textContent = '缓冲重试中…';
                        setTimeout(function() {
                            try { a.load(); var p = a.play(); if (p && p.catch) p.catch(function() {}); } catch (e) {}
                        }, 900);
                    } else if (att < 2) {
                        var fb = uwTrackFallback(a.src);
                        if (!fb) {
                            try { delete a.dataset.uwAtt; } catch (e) {}
                            if (sub) sub.textContent = '该曲目暂时无法播放，点歌单重试';
                            uwSyncPlayUi(false);
                            return;
                        }
                        try { a.dataset.uwAtt = '2'; } catch (e) {}
                        if (sub) sub.textContent = '切换线路重试中…';
                        try { a.src = fb; a.load(); var p2 = a.play(); if (p2 && p2.catch) p2.catch(function() {}); } catch (e) {}
                    } else {
                        try { delete a.dataset.uwAtt; } catch (e) {}
                        if (sub) sub.textContent = '该曲目暂时无法播放，点歌单重试';
                        uwSyncPlayUi(false);
                    }
                });
                uwPlayer.audio.addEventListener('timeupdate', function() {
                    var fill = document.querySelector('.uw-player-fill');
                    var t = document.querySelector('.uw-player-time');
                    var a = uwPlayer.audio;
                    if (fill && a.duration) fill.style.width = (a.currentTime / a.duration * 100) + '%';
                    if (t) t.textContent = uwFmtTime(a.currentTime) + ' / ' + uwFmtTime(a.duration);
                });
                uwPlayer.audio.addEventListener('ended', function() {
                    uwPlayNext();
                });
                uwPlayer.audio.addEventListener('play', function() { uwSyncPlayUi(true); });
                uwPlayer.audio.addEventListener('pause', function() { uwSyncPlayUi(false); });
            }
            return uwPlayer.audio;
        }

        function uwSyncPlayUi(playing) {
            var panel = document.querySelector('.uw-player');
            if (panel) panel.classList.toggle('uw-player--playing', playing);
            var main = document.querySelector('.uw-player-ctl--main');
            if (main) main.innerHTML = playing
                ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>'
                : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"></path></svg>';
        }

        function uwRenderPlaylist() {
            var list = document.querySelector('.uw-player-list');
            if (!list) return;
            list.innerHTML = '';
            if (!uwActiveTracks().length) {
                var empty = document.createElement('div');
                empty.className = 'uw-player-empty';
                empty.textContent = '曲库还空着。在正则里找到 UW_Q.tracks，按 { name: "曲名", url: "音乐直链" } 的格式填入歌曲，保存刷新后这里就会亮起来。';
                list.appendChild(empty);
                return;
            }
            uwActiveTracks().forEach(function(t, i) {
                var row = document.createElement('button');
                row.type = 'button';
                row.className = 'uw-player-row' + (i === uwPlayer.idx ? ' uw-player-row--active' : '');
                var n = document.createElement('span');
                n.textContent = (i + 1) + '. ' + (t.name || '未命名曲目');
                row.appendChild(n);
                row.addEventListener('click', function() { uwPlayTrack(i); });
                list.appendChild(row);
            });
        }

        function uwPlayTrack(i) {
            var tracks = uwActiveTracks();
            if (!tracks.length) return;
            uwPlayer.idx = ((i % tracks.length) + tracks.length) % tracks.length;
            var t = tracks[uwPlayer.idx];
            var a = uwAudioEl();
            try { delete a.dataset.uwAtt; } catch (e) {}
            a.src = t.url;
            var sub = document.querySelector('.uw-player-sub');
            var title = document.querySelector('.uw-player-track');
            if (title) title.textContent = t.name || '未命名曲目';
            if (sub) sub.textContent = '正在加载…';
            uwRenderPlaylist();
            a.play().then(function() {
                if (sub) sub.textContent = '音乐盒 · Track ' + (uwPlayer.idx + 1);
            }).catch(function(err) {
                if (sub) sub.textContent = '该曲目暂时无法播放';
                console.error('[UW_Q] play failed:', err);
            });
        }

        function uwTrackFallback(url) {
            var m = String(url).match(/^https:\/\/raw\.githubusercontent\.com\/([^\/]+\/[^\/]+)\/main\/(.+)$/);
            if (!m) return '';
            return 'https://cdn.jsdelivr.net/gh/' + m[1] + '@main/' + m[2];
        }
        function uwActiveTracks() {
            return uwPlayer.list === 1 ? UW_Q.tracksPure : UW_Q.tracks;
        }
        function uwSwitchList(n, autoplay) {
            var lists = [UW_Q.tracks, UW_Q.tracksPure];
            if (uwPlayer.list === n) return;
            if (!lists[n] || !lists[n].length) return;
            uwPlayer.list = n;
            try { uwAudioEl().pause(); } catch (e) {}
            uwPlayer.idx = -1;
            uwRenderPlaylist();
            var panel = document.querySelector('.uw-player');
            if (panel) {
                var tabs = panel.querySelectorAll('.uw-player-tab');
                for (var ti = 0; ti < tabs.length; ti++) tabs[ti].classList.toggle('uw-player-tab--active', ti === n);
                var cnt = panel.querySelector('.uw-player-list-count');
                if (cnt) cnt.textContent = 'PLAYLIST · ' + uwActiveTracks().length + '首';
                var tr = panel.querySelector('.uw-player-track');
                if (tr) tr.textContent = '未播放';
                var sub = panel.querySelector('.uw-player-sub');
                if (sub) sub.textContent = '音乐盒 · 请选择曲目';
            }
            uwSyncPlayUi(false);
            if (autoplay !== false) uwPlayTrack(0);
        }
        function uwPlayNext() {
            if (!uwActiveTracks().length) return;
            if (uwPlayer.shuffle && uwActiveTracks().length > 1) {
                var n = uwPlayer.idx;
                while (n === uwPlayer.idx) n = Math.floor(Math.random() * uwActiveTracks().length);
                uwPlayTrack(n);
            } else {
                uwPlayTrack(uwPlayer.idx + 1);
            }
        }
        function uwToggleShuffle(btn) {
            uwPlayer.shuffle = !uwPlayer.shuffle;
            if (btn) btn.classList.toggle('uw-player-ctl--active', uwPlayer.shuffle);
        }
        function uwTogglePlay() {
            if (!uwActiveTracks().length) return;
            var a = uwAudioEl();
            if (!a.src) { uwPlayTrack(0); return; }
            if (a.paused) a.play().catch(function() {});
            else a.pause();
        }

        function uwClosePlayer() {
            var bd = document.querySelector('.uw-player-backdrop');
            if (!bd) return;
            document.removeEventListener('keydown', uwPlayerOnKey);
            bd.remove();
            if (uwPlayer.opener && uwPlayer.opener.focus) uwPlayer.opener.focus();
        }

        function uwPlayerOnKey(e) {
            if (e.key === 'Escape') uwClosePlayer();
        }

        function uwOpenPlayer() {
            if (document.querySelector('.uw-player-backdrop')) return;
            uwPlayer.opener = document.activeElement;

            var themeEl = document.querySelector('.theme-mio, .theme-tsuru');
            var themeClass = themeEl && themeEl.classList.contains('theme-tsuru') ? 'theme-tsuru' : 'theme-mio';

            var bd = document.createElement('div');
            bd.className = 'uw-player-backdrop ' + themeClass;
            bd.setAttribute('role', 'dialog');
            bd.setAttribute('aria-label', '音乐盒');

            var panel = document.createElement('div');
            panel.className = 'uw-player';

            var head = document.createElement('div');
            head.className = 'uw-player-head';
            var title = document.createElement('span');
            title.className = 'uw-player-title';
            title.textContent = '音乐盒 · MUSIC BOX';
            var close = document.createElement('button');
            close.type = 'button';
            close.className = 'uw-player-close';
            close.setAttribute('aria-label', '关闭音乐盒');
            close.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>';
            close.addEventListener('click', uwClosePlayer);
            head.appendChild(title);
            head.appendChild(close);

            var body = document.createElement('div');
            body.className = 'uw-player-body';

            var discRow = document.createElement('div');
            discRow.className = 'uw-player-disc-row';
            var disc = document.createElement('div');
            disc.className = 'uw-player-disc';
            var discImg = document.createElement('img');
            discImg.alt = '';
            discImg.crossOrigin = 'anonymous';
            discImg.src = uwQFile(uwQState.ch, uwQState.emotion);
            disc.appendChild(discImg);
            var now = document.createElement('div');
            now.className = 'uw-player-now';
            var label = document.createElement('div');
            label.className = 'uw-player-label';
            label.textContent = 'NOW PLAYING';
            var track = document.createElement('div');
            track.className = 'uw-player-track';
            track.textContent = uwActiveTracks().length ? '未播放' : '曲库待补充';
            var sub = document.createElement('div');
            sub.className = 'uw-player-sub';
            sub.textContent = 'Q版小人 · ' + uwQState.ch;
            now.appendChild(label);
            now.appendChild(track);
            now.appendChild(sub);
            discRow.appendChild(disc);
            discRow.appendChild(now);

            var bar = document.createElement('div');
            bar.className = 'uw-player-bar';
            bar.setAttribute('aria-label', '播放进度');
            var fill = document.createElement('div');
            fill.className = 'uw-player-fill';
            bar.appendChild(fill);
            bar.addEventListener('click', function(e) {
                var a = uwPlayer.audio;
                if (!a || !a.duration) return;
                var r = bar.getBoundingClientRect();
                a.currentTime = (e.clientX - r.left) / r.width * a.duration;
            });
            var time = document.createElement('div');
            time.className = 'uw-player-time';
            time.textContent = '0:00 / 0:00';

            var controls = document.createElement('div');
            controls.className = 'uw-player-controls';
            var prev = document.createElement('button');
            prev.type = 'button';
            prev.className = 'uw-player-ctl';
            prev.setAttribute('aria-label', '上一首');
            prev.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 6h2v12H7zM20 6v12l-9-6z"></path></svg>';
            prev.addEventListener('click', function() { if (uwActiveTracks().length) uwPlayTrack(uwPlayer.idx - 1); });
            var main = document.createElement('button');
            main.type = 'button';
            main.className = 'uw-player-ctl uw-player-ctl--main';
            main.setAttribute('aria-label', '播放或暂停');
            main.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"></path></svg>';
            main.addEventListener('click', uwTogglePlay);
            var next = document.createElement('button');
            next.type = 'button';
            next.className = 'uw-player-ctl';
            next.setAttribute('aria-label', '下一首');
            next.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 6h2v12h-2zM4 6v12l9-6z"></path></svg>';
            next.addEventListener('click', function() { uwPlayNext(); });
            var shuffle = document.createElement('button');
            shuffle.type = 'button';
            shuffle.className = 'uw-player-ctl uw-player-ctl--shuffle' + (uwPlayer.shuffle ? ' uw-player-ctl--active' : '');
            shuffle.setAttribute('aria-label', '随机播放');
            shuffle.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>';
            shuffle.addEventListener('click', function() { uwToggleShuffle(shuffle); });
            controls.appendChild(prev);
            controls.appendChild(main);
            controls.appendChild(next);
            controls.appendChild(shuffle);

            var volume = document.createElement('div');
            volume.className = 'uw-player-volume';
            var volIcon = document.createElement('span');
            volIcon.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#888" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z" fill="#888" stroke="none"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>';
            var range = document.createElement('input');
            range.type = 'range';
            range.min = '0';
            range.max = '100';
            range.value = '85';
            range.setAttribute('aria-label', '音量');
            range.addEventListener('input', function() {
                uwAudioEl().volume = range.value / 100;
            });
            volume.appendChild(volIcon);
            volume.appendChild(range);

            var listTitle = document.createElement('div');
            if (!UW_Q.tracks.length && UW_Q.tracksPure.length) uwPlayer.list = 1;
            listTitle.className = 'uw-player-list-title uw-player-list-fold';
            listTitle.setAttribute('role', 'button');
            listTitle.setAttribute('tabindex', '0');
            listTitle.innerHTML = '<span class="uw-player-list-count">PLAYLIST · ' + uwActiveTracks().length + '首</span><span class="uw-player-fold-arrow">▸</span>';
            listTitle.addEventListener('click', function() {
                var hidden = list.style.display === 'none';
                list.style.display = hidden ? '' : 'none';
                var ar = listTitle.querySelector('.uw-player-fold-arrow');
                if (ar) ar.textContent = hidden ? '▾' : '▸';
            });
            listTitle.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); listTitle.click(); }
            });
            var list = document.createElement('ul');
            list.className = 'uw-player-list';
            list.style.display = 'none';

            body.appendChild(discRow);
            body.appendChild(bar);
            body.appendChild(time);
            body.appendChild(controls);
            body.appendChild(volume);
            if (UW_Q.tracks.length && UW_Q.tracksPure.length) {
                var tabs = document.createElement('div');
                tabs.className = 'uw-player-tabs';
                var tabNames = ['歌曲', '纯音乐'];
                for (var ti = 0; ti < 2; ti++) {
                    (function(n) {
                        var b = document.createElement('button');
                        b.type = 'button';
                        b.className = 'uw-player-tab' + (uwPlayer.list === n ? ' uw-player-tab--active' : '');
                        b.textContent = tabNames[n];
                        b.addEventListener('click', function() { uwSwitchList(n, true); });
                        tabs.appendChild(b);
                    })(ti);
                }
                body.appendChild(tabs);
            }
            body.appendChild(listTitle);
            body.appendChild(list);

            panel.appendChild(head);
            panel.appendChild(body);
            bd.appendChild(panel);

            bd.addEventListener('click', function(e) { if (e.target === bd) uwClosePlayer(); });
            document.addEventListener('keydown', uwPlayerOnKey);

            document.body.appendChild(bd);
            uwRenderPlaylist();
            var hasTracks = uwActiveTracks().length > 0;
            prev.disabled = !hasTracks;
            next.disabled = !hasTracks;
            if (!hasTracks) main.disabled = true;
            close.focus();
        }

        function init() {
            try {
                var messageText = getMessageData();
/* 满血API纯文字降级：API/模型名含“满血”时只留纯文字（fail-open：异常则正常渲染） */
function uwIsFullBlood(msgObj){
  try{
    var budget={n:0};
    function scan(v,depth){
      if(v==null||depth>4||budget.n>300)return false;
      if(typeof v==='string'){budget.n++;return v.indexOf('满血')!==-1;}
      if(typeof v!=='object')return false;
      if(Object.prototype.toString.call(v)==='[object Array]'){for(var i=0;i<v.length&&i<12;i++){try{if(scan(v[i],depth+1))return true;}catch(e){}}return false;}
      var skip={message:1,raw:1,mes:1,chat:1,messages:1,characters:1,character:1,lorebook:1,lorebooks:1,worldbook:1,prompt:1,prompts:1,data:1,html:1,innerHTML:1};
      for(var k in v){
        if(!Object.prototype.hasOwnProperty.call(v,k))continue;
        if(skip[k])continue;
        var val=null;
        try{val=v[k];}catch(e){continue;}
        try{if(scan(val,depth+1))return true;}catch(e){}
      }
      return false;
    }
    try{if(msgObj&&scan(msgObj,0))return true;}catch(e){}
    var ctx=null;
    try{if(window.SillyTavern&&window.SillyTavern.getContext)ctx=window.SillyTavern.getContext();}catch(e){ctx=null;}
    if(!ctx){try{if(window.parent&&window.parent.SillyTavern&&window.parent.SillyTavern.getContext)ctx=window.parent.SillyTavern.getContext();}catch(e){ctx=null;}}
    try{if(ctx&&scan(ctx,0))return true;}catch(e){}
  }catch(e){}
  return false;
}
function uwCurMsg(){
  try{if(typeof getChatMessages==='function'&&typeof getCurrentMessageId==='function'){var m=getChatMessages(getCurrentMessageId());if(m&&m.length)return m[0];}}catch(e){}
  return null;
}
                try{if(uwIsFullBlood(uwCurMsg())){document.getElementById('content').textContent='';return;}}catch(e){}
                if (!messageText) {
                    document.getElementById('content').innerHTML = '<div class="card"><div class="loading">❌ 无法获取消息内容</div></div>';
                    return;
                }
                var data = parseData(messageText);
                if (!data) {
                    document.getElementById('content').innerHTML = '<div class="card"><div class="loading">❌ 未检测到状态面板格式</div></div>';
                    return;
                }
                renderPage(data);
            } catch (error) {
                document.getElementById('content').innerHTML = '<div class="card"><div class="loading">❌ 加载失败：' + error.message + '</div></div>';
            }
        }

        $(function() { init(); });
    </script>
</body>
</html>
