<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>全角色立绘图鉴 (融合版+大屏预览+快速跳转)</title>
  <style>
:root {
      --bg-color: #0b0f19;
      --text-primary: #f5f7ff;
      --text-secondary: #9cb0d8;
      --accent: #ff7eaa;
      --accent-hover: #ff9bbb;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #05060c 0%, #11162b 50%, #080a14 100%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding: 16px;
    }

    .main-container {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .view {
      display: none;
      flex-direction: column;
      width: 100%;
      flex: 1;
      animation: fadeIn 0.35s ease forwards;
    }

    .view.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 首页顶部标题区 */
    .selection-header {
      text-align: center;
      padding: 24px 20px 10px;
    }

    .selection-header h1 {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #7f9cff, #ff7eaa, #ffa366);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .selection-header p {
      color: var(--text-secondary);
      font-size: 15px;
      margin-bottom: 14px;
    }

    /* 快捷操作栏 */
    .action-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
    }

    .jump-btn {
      background: linear-gradient(135deg, rgba(127, 156, 255, 0.22), rgba(255, 126, 170, 0.28));
      border: 1px solid rgba(255, 126, 170, 0.45);
      color: #fff;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(255, 126, 170, 0.18);
    }

    .jump-btn:hover {
      background: linear-gradient(135deg, #7f9cff, #ff7eaa);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 126, 170, 0.45);
    }

    /* 轮播展示区 (大屏放大尺寸) */
    .carousel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 24px;
      gap: 20px;
    }

    .nav-btn {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--card-border);
      color: white;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      z-index: 10;
      transition: all 0.3s;
      backdrop-filter: blur(8px);
    }

    .nav-btn:hover {
      background: var(--accent);
      transform: scale(1.08);
    }

    .nav-btn:active {
      transform: scale(0.92);
    }

    .card-wrapper {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 9 / 14;
      cursor: pointer;
      perspective: 1000px;
      transition: transform 0.3s ease;
    }

    .card-wrapper:hover {
      transform: translateY(-6px) scale(1.02);
    }

    .main-card {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .main-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-info {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 40px 20px 20px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.92) 0%, transparent 100%);
      text-align: center;
    }

    .card-name {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 6px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    .card-hint {
      font-size: 14px;
      color: var(--accent);
      opacity: 0.95;
      letter-spacing: 1px;
    }

    .pagination {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 16px;
      max-width: 90%;
      margin: 0 auto;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--card-border);
      transition: all 0.3s;
      cursor: pointer;
    }

    .dot.active {
      background: var(--accent);
      transform: scale(1.35);
      box-shadow: 0 0 10px var(--accent);
    }

    /* 详情页导航 */
    .detail-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 18, 32, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      padding: 16px 20px;
      gap: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--accent);
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 8px 18px;
      border-radius: 20px;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--accent);
      color: #fff;
    }

    .detail-title {
      font-size: 22px;
      font-weight: 700;
      flex: 1;
      letter-spacing: 1.5px;
    }

    .gallery-container {
      padding: 10px 0 60px;
      overflow-y: auto;
    }

    .section-title {
      margin: 32px 0 18px;
      font-size: 22px;
      font-weight: 600;
      padding-left: 14px;
      border-left: 4px solid var(--accent);
      letter-spacing: 1.5px;
    }

    .section-title:first-child {
      margin-top: 6px;
    }

    /* 放大网格卡片尺寸 */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }

    @media (min-width: 650px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-width: 1020px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (min-width: 1300px) {
      .grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    .grid-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .grid-item:hover {
      transform: translateY(-6px);
      border-color: var(--accent);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .grid-thumb {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .grid-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .grid-item:hover .grid-thumb img {
      transform: scale(1.05);
    }

    .placeholder-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.2);
      font-size: 48px;
      font-weight: bold;
    }

    .single-switch-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      backdrop-filter: blur(6px);
      transition: all 0.2s;
      z-index: 5;
    }

    .single-switch-btn:hover {
      background: var(--accent);
      transform: scale(1.15);
    }

    .grid-info {
      padding: 14px 10px;
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
      border-top: 1px solid var(--card-border);
    }

    .grid-tag {
      font-size: 15px;
      color: #fff;
      font-weight: 600;
    }

    .grid-filename {
      font-family: monospace;
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
      word-break: break-all;
    }

    .global-switch-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: linear-gradient(135deg, #7f9cff, #ff7eaa);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 126, 170, 0.45);
      z-index: 1000;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .global-switch-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 126, 170, 0.65);
    }

    /* ===== 角色快速选择/跳转弹窗 (Quick Jump Modal) ===== */
    .char-jump-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 13, 0.88);
      z-index: 9999;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .char-jump-modal.active {
      display: flex;
      opacity: 1;
    }

    .char-jump-box {
      background: #111728;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 900px;
      max-width: 96vw;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      position: relative;
      transform: scale(0.95);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .char-jump-modal.active .char-jump-box {
      transform: scale(1);
    }

    .char-jump-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.02);
    }

    .char-jump-title {
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(90deg, #7f9cff, #ff7eaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .char-jump-close {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .char-jump-close:hover {
      background: var(--accent);
    }

    .char-jump-search-bar {
      padding: 14px 24px;
      border-bottom: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.2);
    }

    .char-jump-input {
      width: 100%;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
    }

    .char-jump-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(255, 126, 170, 0.3);
      background: rgba(255, 255, 255, 0.1);
    }

    .char-jump-list {
      padding: 20px 24px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
      flex: 1;
    }

    .char-jump-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .char-jump-item:hover {
      background: linear-gradient(135deg, rgba(127, 156, 255, 0.2), rgba(255, 126, 170, 0.25));
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    .char-jump-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid var(--card-border);
      flex-shrink: 0;
      position: relative;
    }

    .char-jump-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .char-jump-name-box {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .char-jump-name {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .char-jump-tag {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
      font-family: monospace;
    }

    /* ===== 全局统一灯箱预览 (Lightbox) ===== */
    .lightbox-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 10, 16, 0.94);
      z-index: 99999;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .lightbox-modal.active {
      display: flex;
      opacity: 1;
    }

    .lightbox-box {
      position: relative;
      max-width: 92vw;
      max-height: 84vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-box img {
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.85);
      border: 4px solid rgba(255, 255, 255, 0.2);
      background: #111420;
    }

    .lightbox-close-btn {
      position: absolute;
      top: 24px;
      right: 28px;
      color: #fff;
      font-size: 32px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 100001;
    }

    .lightbox-close-btn:hover {
      background: var(--accent);
      transform: scale(1.1);
    }

    .lightbox-info-text {
      color: #f0f4fc;
      margin-top: 16px;
      font-size: 18px;
      letter-spacing: 2px;
      font-weight: 600;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .lightbox-open-external {
      margin-top: 8px;
      color: #9ab4ff;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
      transition: color 0.2s;
    }

    .lightbox-open-external:hover {
      color: var(--accent);
    }

    @media (max-width: 768px) {
      .card-wrapper {
        max-width: 280px;
      }
      .nav-btn {
        width: 44px;
        height: 44px;
        font-size: 20px;
      }
      .global-switch-btn {
        bottom: 20px;
        right: 20px;
        padding: 10px 20px;
        font-size: 13px;
      }
      .char-jump-list {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
        padding: 14px;
      }
      .char-jump-avatar {
        width: 38px;
        height: 38px;
      }
      .char-jump-name {
        font-size: 13px;
      }
    }
</style>
</head>

<body>
  <div class="main-container">
    <button id="global-switch-btn" class="global-switch-btn" onclick="toggleGlobalVersion()">
      🔄 当前：版本一
    </button>

    <!-- 轮播总览视图 -->
    <div id="selection-view" class="view active">
      <div class="selection-header">
        <h1>全角色图鉴系统 (融合版)</h1>
        <p>左右滑动切换角色 · 点击卡片进入专属画廊 · 翻转版本实时同步大图</p>
        <!-- 快速跳转按钮 -->
        <div class="action-bar">
          <button class="jump-btn" onclick="openCharJumpModal()">
            👥 快速角色选择目录 (60+ 角色速查)
          </button>
        </div>
      </div>

      <div class="carousel">
        <button class="nav-btn prev-btn" onclick="prevChar()">&#10094;</button>

        <div class="swipe-area" id="swipe-area">
          <div class="card-wrapper" onclick="openDetail()">
            <div class="main-card">
              <img
                id="main-avatar"
                src=""
                alt="角色立绘"
                draggable="false"
                onerror="
                  this.style.display = 'none';
                  this.nextElementSibling.style.display = 'block';
                "
              />
              <div
                class="placeholder-text"
                style="display: none;"
              >
                ?
              </div>
              <div class="card-info">
                <div class="card-name" id="main-name">加载中...</div>
                <div class="card-hint">点击进入专属图库</div>
              </div>
            </div>
          </div>
        </div>

        <button class="nav-btn next-btn" onclick="nextChar()">&#10095;</button>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>

    <!-- 角色详情视图 -->
    <div id="detail-view" class="view">
      <div class="detail-nav">
        <button class="back-btn" onclick="closeDetail()">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          返回列表
        </button>
        <div class="detail-title" id="detail-title">角色全立绘</div>
        <button class="back-btn" style="color:#7f9cff; border-color:rgba(127,156,255,0.3);" onclick="openCharJumpModal()">
          👥 切换其他角色
        </button>
      </div>

      <div class="gallery-container" id="gallery-container"></div>
    </div>
  </div>

  <!-- 角色快速选择/跳转弹窗 (Quick Jump Modal) -->
  <div id="char-jump-modal" class="char-jump-modal" onclick="closeCharJumpModal(event)">
    <div class="char-jump-box" onclick="event.stopPropagation()">
      <div class="char-jump-header">
        <div class="char-jump-title">
          <span>👥</span>
          <span>角色快速目录 (共 60+ 位角色)</span>
        </div>
        <button class="char-jump-close" onclick="closeCharJumpModalDirect()">✕</button>
      </div>
      <div class="char-jump-search-bar">
        <input type="text" id="char-search-input" class="char-jump-input" placeholder="🔍 输入角色名字快速筛选（如：孙翌童、智允、林安安...）" oninput="filterCharJumpList()">
      </div>
      <div class="char-jump-list" id="char-jump-list"></div>
    </div>
  </div>

  <!-- 全局统一灯箱预览组件 (Lightbox) -->
  <div id="lightbox-modal" class="lightbox-modal" onclick="closeLightbox(event)">
    <button class="lightbox-close-btn" onclick="closeLightboxDirect()">✕</button>
    <div class="lightbox-box" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="" alt="大图预览">
    </div>
    <div class="lightbox-info-text" id="lightbox-title"></div>
    <a id="lightbox-link" class="lightbox-open-external" target="_blank" rel="noopener noreferrer">↗ 在新标签页打开原始高清大图</a>
  </div>

  <script>
const GH = "https://raw.githubusercontent.com/";
    const R0 = GH + "zhamuqiu/tongren2/refs/heads/main";
    const R1 = GH + "roxysl521-droid/linanan_xiaoma/main";
    const R2 = GH + "xuanyuy2019-ops/Image/main/shenyan";

    // --- 全局状态管理 ---
    let globalVersion = 0;
    let imageVersions = {};
    let currentIndex = 0;

    const mainAvatar = document.getElementById("main-avatar");
    const mainName = document.getElementById("main-name");
    const pagination = document.getElementById("pagination");

    const lightboxModal = document.getElementById("lightbox-modal");
    const lightboxImg = document.getElementById("lightbox-img");
    const lightboxTitle = document.getElementById("lightbox-title");
    const lightboxLink = document.getElementById("lightbox-link");

    function getImageUrl(charData, isSfw, variantKey) {
      if (!isSfw && variantKey === "vulva_selfie" && NO_VULVA_SELFIE_CHARS.includes(charData.id)) return "";
      if (!isSfw && ["vulva_selfie", "outdoor_selfie", "indoor_selfie", "nude_selfie"].includes(variantKey) && NO_SELFIE_CHARS.includes(charData.id)) return "";
      if (!isSfw && variantKey === "nude_selfie" && NO_NUDE_SELFIE_CHARS.includes(charData.id)) return "";
      const stateKey = `${charData.id}_${variantKey}`;
      const versionToUse =
        imageVersions[stateKey] !== undefined ? imageVersions[stateKey] : globalVersion;

      let base, overrides;

      if (versionToUse === 1 && VERSION2_CONFIG[charData.id]) {
        const v2 = VERSION2_CONFIG[charData.id];
        base = isSfw ? v2.sfwBase : v2.nsfwBase;
        overrides = v2.overrides;
      } else {
        base = isSfw ? charData.sfwBase : charData.nsfwBase;
        overrides = charData.overrides;
      }

      if (overrides && overrides[variantKey]) {
        return overrides[variantKey];
      }

      if (!base || base === "WAITING_FOR_IMAGE_HOST") return "";
      if (charData.id === "pei_shuquan" && variantKey === "uniform") {
        return `${base}/pei_shuquan_uniform${Math.random() > 0.5 ? "" : "2"}.png`;
      }
      return `${base}/${charData.id}_${variantKey}.png`;
    }

    function toggleGlobalVersion() {
      globalVersion = globalVersion === 0 ? 1 : 0;
      imageVersions = {};

      const btn = document.getElementById("global-switch-btn");
      btn.innerHTML = `🔄 当前：${globalVersion === 0 ? "版本一" : "版本二"}`;

      if (document.getElementById("detail-view").classList.contains("active")) {
        const char = charactersData[currentIndex];
        buildGallery(char);
      }
      updateCarousel();
      renderCharJumpList();
    }

    function toggleSingleImage(charId, variantKey, isSfw) {
      const stateKey = `${charId}_${variantKey}`;
      const currentV =
        imageVersions[stateKey] !== undefined ? imageVersions[stateKey] : globalVersion;
      imageVersions[stateKey] = currentV === 0 ? 1 : 0;

      const charData = charactersData.find((c) => c.id === charId);
      const newUrl = getImageUrl(charData, isSfw, variantKey);

      const imgEl = document.getElementById(`img-${charId}-${variantKey}`);
      if (imgEl) {
        const placeholder = imgEl.nextElementSibling;
        if (newUrl) {
          imgEl.src = newUrl;
          imgEl.style.display = "block";
          placeholder.style.display = "none";
        } else {
          imgEl.style.display = "none";
          placeholder.style.display = "block";
        }
      }
    }

    function init() {
      charactersData.forEach((_, index) => {
        const dot = document.createElement("div");
        dot.className = "dot";
        dot.onclick = () => {
          currentIndex = index;
          updateCarousel();
        };
        pagination.appendChild(dot);
      });

      updateCarousel();
      setupTouchSwipe();
      renderCharJumpList();
    }

    function updateCarousel() {
      const char = charactersData[currentIndex];

      let defaultSfwKey = "uniform";
      if (char.preset === "traveler" || char.preset === "xiaoma") {
        defaultSfwKey = "outing";
      }
      const url = getImageUrl(char, true, defaultSfwKey);

      mainAvatar.style.display = url ? "block" : "none";
      mainAvatar.nextElementSibling.style.display = url ? "none" : "block";
      mainAvatar.nextElementSibling.textContent = fallbackAvatars[char.id] || "?";
      if (url) mainAvatar.src = url;

      mainName.textContent = char.name;

      Array.from(pagination.children).forEach((dot, index) => {
        dot.className = index === currentIndex ? "dot active" : "dot";
      });
    }

    function prevChar() {
      currentIndex = (currentIndex - 1 + charactersData.length) % charactersData.length;
      updateCarousel();
    }

    function nextChar() {
      currentIndex = (currentIndex + 1) % charactersData.length;
      updateCarousel();
    }

    function setupTouchSwipe() {
      const el = document.getElementById("swipe-area");
      let touchStartX = 0;
      let touchEndX = 0;

      el.addEventListener("touchstart", (e) => {
        touchStartX = e.changedTouches[0].screenX;
      });

      el.addEventListener("touchend", (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      });

      function handleSwipe() {
        const threshold = 40;
        if (touchEndX < touchStartX - threshold) {
          nextChar();
        }
        if (touchEndX > touchStartX + threshold) {
          prevChar();
        }
      }
    }

    function openDetail() {
      const char = charactersData[currentIndex];
      detailTitle.textContent = `${char.name} 全套档案`;
      buildGallery(char);

      selectionView.classList.remove("active");
      detailView.classList.add("active");
      window.scrollTo(0, 0);
    }

    function closeDetail() {
      detailView.classList.remove("active");
      selectionView.classList.add("active");
    }

    /* ===== 角色速查弹窗逻辑 ===== */
    function openCharJumpModal() {
      renderCharJumpList();
      document.getElementById("char-search-input").value = "";
      document.getElementById("char-jump-modal").classList.add("active");
      document.body.style.overflow = "hidden";
      setTimeout(() => document.getElementById("char-search-input").focus(), 100);
    }

    function closeCharJumpModal(e) {
      document.getElementById("char-jump-modal").classList.remove("active");
      document.body.style.overflow = "";
    }

    function closeCharJumpModalDirect() {
      document.getElementById("char-jump-modal").classList.remove("active");
      document.body.style.overflow = "";
    }

    function renderCharJumpList(filterKeyword = "") {
      const container = document.getElementById("char-jump-list");
      container.innerHTML = "";

      const keyword = filterKeyword.trim().toLowerCase();
      const filtered = charactersData
        .map((char, index) => ({ char, index }))
        .filter((item) => {
          if (!keyword) return true;
          return (
            item.char.name.toLowerCase().includes(keyword) ||
            item.char.id.toLowerCase().includes(keyword)
          );
        });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--text-secondary);">未找到匹配的角色</div>`;
        return;
      }

      filtered.forEach((item) => {
        const { char, index } = item;
        const presetInfo = VARIANT_PRESETS[char.preset || "modern"];
        let defaultSfwKey =
          char.preset === "traveler" || char.preset === "xiaoma" ? "outing" : "uniform";
        const avatarUrl = getImageUrl(char, true, defaultSfwKey);

        const div = document.createElement("div");
        div.className = "char-jump-item";
        div.onclick = () => {
          currentIndex = index;
          updateCarousel();
          openDetail();
          closeCharJumpModalDirect();
        };

        div.innerHTML = `
          <div class="char-jump-avatar">
            <img src="${avatarUrl}" alt="${char.name}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div style="display:none; width:100%; height:100%; align-items:center; justify-content:center; background:#222; color:#fff; font-weight:bold; font-size:14px;">${fallbackAvatars[char.id] || "?"}</div>
          </div>
          <div class="char-jump-name-box">
            <div class="char-jump-name">${char.name}</div>
            <div class="char-jump-tag">${presetInfo.label} · ${char.id}</div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function filterCharJumpList() {
      const val = document.getElementById("char-search-input").value;
      renderCharJumpList(val);
    }

    /* ===== 全屏大图灯箱预览逻辑 ===== */
    function openLightbox(url, title, filename) {
      if (!url) return;
      lightboxImg.src = url;
      lightboxTitle.textContent = `${title} (${filename})`;
      lightboxLink.href = url;
      lightboxModal.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox(e) {
      lightboxModal.classList.remove("active");
      document.body.style.overflow = "";
    }

    function closeLightboxDirect() {
      lightboxModal.classList.remove("active");
      document.body.style.overflow = "";
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (lightboxModal.classList.contains("active")) {
          closeLightboxDirect();
        } else if (document.getElementById("char-jump-modal").classList.contains("active")) {
          closeCharJumpModalDirect();
        }
      }
    });

    /* ===== 画廊渲染逻辑 ===== */
    function buildGallery(char) {
      galleryContainer.innerHTML = "";

      const presetConfig = VARIANT_PRESETS[char.preset || "modern"];

      const sfwSection = document.createElement("div");
      sfwSection.innerHTML = `<div class="section-title">普通情境 (SFW)</div>`;
      const sfwGrid = document.createElement("div");
      sfwGrid.className = "grid";

      presetConfig.sfw.forEach((variant) => {
        sfwGrid.appendChild(
          createGridItem(
            variant.label,
            `${char.id}_${variant.key}.png`,
            char.id,
            true,
            variant.key,
            char.name
          )
        );
      });
      sfwSection.appendChild(sfwGrid);
      galleryContainer.appendChild(sfwSection);

      const nsfwSection = document.createElement("div");
      nsfwSection.innerHTML = `<div class="section-title">私密情境 (NSFW)</div>`;
      const nsfwGrid = document.createElement("div");
      nsfwGrid.className = "grid";

      presetConfig.nsfw.forEach((variant) => {
        if (variant.key === "vulva_selfie" && NO_VULVA_SELFIE_CHARS.includes(char.id)) {
          return;
        }
        if (
          ["vulva_selfie", "outdoor_selfie", "indoor_selfie", "nude_selfie"].includes(variant.key) &&
          NO_SELFIE_CHARS.includes(char.id)
        ) {
          return;
        }
        if (variant.key === "nude_selfie" && NO_NUDE_SELFIE_CHARS.includes(char.id)) {
          return;
        }
        nsfwGrid.appendChild(
          createGridItem(
            variant.label,
            `${char.id}_${variant.key}.png`,
            char.id,
            false,
            variant.key,
            char.name
          )
        );
      });
      nsfwSection.appendChild(nsfwGrid);
      galleryContainer.appendChild(nsfwSection);
    }

    function createGridItem(tag, filename, charId, isSfw, variantKey, charName) {
      const div = document.createElement("div");
      div.className = "grid-item";

      const charData = charactersData.find((c) => c.id === charId);
      const imgSrc = getImageUrl(charData, isSfw, variantKey);

      // 实时动态读取最新翻转后的图片链接，彻底解决大图预览与翻转版本不一致问题
      div.onclick = () => {
        const currentCharData = charactersData.find((c) => c.id === charId);
        const currentImgSrc = getImageUrl(currentCharData, isSfw, variantKey);
        openLightbox(currentImgSrc, `${charName} · ${tag}`, filename);
      };

      div.innerHTML = `
        <div class="grid-thumb">
          <button class="single-switch-btn" title="单独切换该立绘版本" onclick="event.stopPropagation(); toggleSingleImage('${charId}', '${variantKey}', ${isSfw})">🔄</button>
          <img id="img-${charId}-${variantKey}" src="${imgSrc}" alt="${tag}" loading="lazy" style="${imgSrc ? 'display:block;' : 'display:none;'}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
          <div class="placeholder-text" style="${imgSrc ? "display:none;" : "display:block;"}">${fallbackAvatars[charId] || "?"}</div>
        </div>
        <div class="grid-info">
          <div class="grid-tag">${tag}</div>
          <div class="grid-filename">${filename}</div>
        </div>
      `;
      return div;
    }
