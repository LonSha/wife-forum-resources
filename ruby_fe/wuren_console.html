<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>乌仁市主控台</title>
    <style>
        /* ========== 粉色恋爱主题 ========== */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');

        :root {
            --bg-deep: #fff5f7;
            --bg-velvet: #ffe4ec;
            --bg-card: #ffffffd9;
            --color-gold: #d4628c;
            --color-gold-glow: rgba(255, 105, 180, 0.5);
            --color-neon-crimson: #ff6b9d;
            --color-neon-amber: #ff85b3;
            --text-primary: #5a2d4a;
            --text-secondary: #a05a7a;
            --text-muted: #cc99aa;
            --space-xs: clamp(4px, 1cqw, 8px);
            --space-sm: clamp(8px, 1.5cqw, 12px);
            --space-md: clamp(12px, 2.5cqw, 20px);
            --space-lg: clamp(16px, 3.5cqw, 28px);
            --border-heavy: 2px solid #ffb6c1;
            --shadow-maximal: 0 8px 32px rgba(255, 105, 180, 0.2), inset 0 0 30px rgba(255, 182, 193, 0.1);
            --neon-glow: 0 0 15px #ff85b3, 0 0 30px #ff6b9d;
            --font-family: 'Noto Serif SC', serif;
            --radius-md: 20px;
            --radius-lg: 30px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: repeating-linear-gradient(45deg, #fff0f5, #fff0f5 15px, #ffe4ec 15px, #ffe4ec 30px);
            color: var(--text-primary);
            font-family: var(--font-family);
            padding: var(--space-md);
            container-type: inline-size;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-board {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background: radial-gradient(circle at 70% 30%, #ffffff, #ffe4ec);
            border: 2px solid #ffb6c1;
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.15), inset 0 0 40px rgba(255, 182, 193, 0.08);
            padding: var(--space-lg);
            position: relative;
            backdrop-filter: blur(4px);
        }

        .header-section {
            text-align: center;
            border-bottom: 2px dashed #ffb6c1;
            padding-bottom: var(--space-md);
            margin-bottom: var(--space-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-sm);
        }

        .header-title {
            font-size: clamp(2rem, 5cqw, 3.2rem);
            font-weight: 900;
            color: #d4628c;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.3), 0 4px 12px rgba(255, 105, 180, 0.1);
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ff6b9d, #ff85b3, #ffb6c1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            font-size: clamp(0.9rem, 2cqw, 1.2rem);
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 2px;
        }

        .warning-stamp {
            display: inline-block;
            padding: var(--space-sm) var(--space-md);
            border: 2px solid #ff6b9d;
            color: #d4628c;
            font-size: clamp(0.75rem, 1.5cqw, 0.9rem);
            font-weight: 700;
            background: rgba(255, 105, 180, 0.08);
            transform: rotate(-0.5deg);
            border-radius: 30px;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.05);
        }

        .header-actions {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
            justify-content: center;
            margin-top: var(--space-xs);
        }

        .reset-btn, .gallery-btn {
            background: linear-gradient(135deg, #ffb6c1, #ff85b3);
            border: none;
            color: #fff;
            padding: var(--space-sm) var(--space-md);
            font-family: var(--font-family);
            font-weight: 700;
            font-size: clamp(0.8rem, 1.5cqw, 1rem);
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 40px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.2);
            letter-spacing: 1px;
        }

        .reset-btn:hover, .gallery-btn:hover {
            background: linear-gradient(135deg, #ff85b3, #ff6b9d);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.3);
        }

        .group-tabs {
            display: flex;
            gap: var(--space-sm);
            justify-content: center;
            margin-bottom: var(--space-lg);
            border-bottom: 2px solid #ffb6c1;
            padding-bottom: var(--space-sm);
            flex-wrap: wrap;
        }

        .group-tab {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: var(--font-family);
            font-size: clamp(1rem, 2.5cqw, 1.2rem);
            font-weight: 700;
            cursor: pointer;
            padding: var(--space-xs) var(--space-md);
            transition: all 0.3s ease;
            letter-spacing: 2px;
            position: relative;
            border-radius: 40px;
        }

        .group-tab:hover {
            color: var(--text-secondary);
        }

        .group-tab.active {
            color: #d4628c;
            background: rgba(255, 182, 193, 0.2);
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.1);
        }

        .group-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 20%;
            right: 20%;
            height: 3px;
            background: #ff85b3;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.3);
        }

        .accordion-container {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        /* 自由模式专用样式 */
        .free-mode-container {
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
        }

        .free-section {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid #ffb6c1;
            border-radius: var(--radius-md);
            padding: var(--space-md);
            box-shadow: 0 4px 20px rgba(255, 105, 180, 0.05);
        }

        .free-section-title {
            color: #d4628c;
            font-size: clamp(1rem, 2cqw, 1.2rem);
            font-weight: 600;
            margin-bottom: var(--space-sm);
            border-bottom: 1px dashed #ffb6c1;
            padding-bottom: var(--space-xs);
        }

        .free-option-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: var(--space-sm);
        }

        .free-option {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            cursor: pointer;
            padding: var(--space-xs) var(--space-sm);
            border-radius: 20px;
            transition: background 0.2s;
        }
        .free-option:hover {
            background: rgba(255, 182, 193, 0.15);
        }

        .free-option input[type="radio"],
        .free-option input[type="checkbox"] {
            accent-color: #ff6b9d;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .free-option label {
            cursor: pointer;
            font-size: clamp(0.85rem, 1.5cqw, 1rem);
            color: var(--text-primary);
        }

        .free-option label:hover {
            color: #d4628c;
        }

        .free-scene-controls {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
            margin-top: var(--space-sm);
            border-top: 1px solid #ffb6c1;
            padding-top: var(--space-md);
        }

        .free-scene-row {
            display: flex;
            gap: var(--space-sm);
            align-items: center;
            flex-wrap: wrap;
        }

        .free-scene-row .st-btn {
            flex-shrink: 0;
        }

        .free-scene-row .st-input {
            flex: 1;
            min-width: 200px;
        }

        .st-input {
            background-color: #fff;
            border: 1px solid #ffb6c1;
            color: var(--text-primary);
            padding: var(--space-sm) var(--space-md);
            border-radius: 40px;
            font-size: var(--text-base);
            font-family: inherit;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-shadow: inset 0 2px 6px rgba(255, 105, 180, 0.02);
        }
        .st-input:focus {
            outline: none;
            border-color: #ff85b3;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.08), inset 0 2px 6px rgba(255, 105, 180, 0.02);
        }
        .st-input::placeholder {
            color: var(--text-muted);
        }

        .st-btn {
            background: linear-gradient(135deg, #ffb6c1, #ff85b3);
            border: none;
            color: #fff;
            padding: var(--space-sm) var(--space-md);
            font-family: var(--font-family);
            font-weight: 700;
            font-size: clamp(0.9rem, 1.5cqw, 1rem);
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 40px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.15);
            letter-spacing: 1px;
        }

        .st-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #ff85b3, #ff6b9d);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.25);
        }

        .st-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(0.3);
            transform: none;
        }

        .st-btn--primary {
            background: linear-gradient(135deg, #ff6b9d, #d4628c);
            box-shadow: 0 4px 20px rgba(255, 105, 180, 0.25);
            color: #fff;
        }
        .st-btn--primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #d4628c, #b84a7a);
            box-shadow: 0 8px 30px rgba(255, 105, 180, 0.35);
        }

        .st-btn--danger {
            background: linear-gradient(135deg, #ffb6c1, #ff6b9d);
        }
        .st-btn--danger:hover:not(:disabled) {
            background: linear-gradient(135deg, #ff6b9d, #d4628c);
        }

        .char-item {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid #ffb6c1;
            border-radius: var(--radius-md);
            box-shadow: 0 4px 20px rgba(255, 105, 180, 0.04);
            transition: all 0.4s ease;
            overflow: hidden;
        }

        .char-item.active {
            border-color: #ff85b3;
            box-shadow: 0 8px 32px rgba(255, 105, 180, 0.15), inset 0 0 30px rgba(255, 182, 193, 0.05);
        }

        .char-header {
            padding: var(--space-md);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
            position: relative;
        }

        .char-header:hover {
            background: rgba(255, 182, 193, 0.05);
        }

        .char-name-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: var(--space-sm);
        }

        .char-name {
            font-size: clamp(1.4rem, 4cqw, 2rem);
            font-weight: 700;
            color: #d4628c;
            text-shadow: 0 2px 8px rgba(255, 105, 180, 0.1);
        }

        .char-tag {
            font-size: clamp(0.7rem, 1.5cqw, 0.9rem);
            padding: 4px 14px;
            border: 1px solid #ffb6c1;
            color: #d4628c;
            border-radius: 30px;
            font-weight: 700;
            background: rgba(255, 182, 193, 0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .char-quote {
            font-style: italic;
            color: #d4628c !important;
            font-size: clamp(0.95rem, 2.2cqw, 1.15rem);
            position: relative;
            padding-left: var(--space-md);
            border-left: 3px solid #ffb6c1;
            font-weight: 600;
            animation: heartBeat 2s infinite;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.1);
            line-height: 1.5;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); opacity: 1; }
            15% { transform: scale(1.02); opacity: 0.95; }
            30% { transform: scale(1); }
            45% { transform: scale(1.015); opacity: 0.9; }
            60% { transform: scale(1); }
            80% { transform: scale(1.005); }
        }

        .char-quote::before {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            z-index: -1;
            color: transparent;
            text-shadow: 4px 0 rgba(255, 105, 180, 0.2), -4px 0 rgba(255, 182, 193, 0.15);
            animation: floatShadow 3s infinite;
        }

        @keyframes floatShadow {
            0%, 100% { transform: translate(0); opacity: 0.4; }
            25% { transform: translate(-3px, 2px); opacity: 0.2; }
            50% { transform: translate(3px, -2px); opacity: 0.6; }
            75% { transform: translate(-2px, -1px); opacity: 0.3; }
        }

        .char-details {
            display: none;
            padding: var(--space-md);
            border-top: 1px solid rgba(255, 182, 193, 0.2);
            background: rgba(255, 255, 255, 0.3);
        }

        .char-item.active .char-details {
            display: block;
            animation: slideDown 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .detail-block {
            margin-bottom: var(--space-md);
            line-height: 1.6;
        }

        .detail-title {
            color: #d4628c;
            font-weight: 700;
            font-size: clamp(1rem, 2.5cqw, 1.2rem);
            margin-bottom: var(--space-xs);
        }

        .weakness-box {
            background: rgba(255, 182, 193, 0.1);
            border-left: 4px solid #ff6b9d;
            padding: var(--space-sm);
            color: var(--text-primary);
            border-radius: 0 10px 10px 0;
        }

        .weakness-title {
            color: #d4628c;
            font-weight: 900;
        }

        .open-dir-btn {
            background: linear-gradient(135deg, #ffb6c1, #ff85b3);
            border: none;
            color: #fff;
            padding: var(--space-sm) var(--space-md);
            font-family: var(--font-family);
            font-weight: 700;
            font-size: clamp(0.85rem, 1.5cqw, 1rem);
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 40px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.1);
            letter-spacing: 1px;
            width: 100%;
            margin-top: var(--space-sm);
        }

        .open-dir-btn:hover {
            background: linear-gradient(135deg, #ff85b3, #ff6b9d);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.2);
        }

        .open-dir-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .action-triggers {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            margin-top: var(--space-lg);
            width: 100%;
        }

        .scene-label {
            font-size: clamp(0.8rem, 1.8cqw, 1rem);
            color: var(--text-secondary);
            letter-spacing: 2px;
            margin-bottom: var(--space-xs);
            border-bottom: 1px dashed #ffb6c1;
            padding-bottom: var(--space-xs);
            text-align: center;
        }

        .scene-btn-group {
            display: grid;
            gap: var(--space-sm);
        }

        .scene-btn-group--three {
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr));
        }
        .scene-btn-group--two {
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr));
        }

        .trigger-btn {
            background: linear-gradient(135deg, #ffb6c1, #ff85b3);
            border: none;
            color: #fff;
            padding: var(--space-sm) var(--space-xs);
            font-family: var(--font-family);
            font-weight: 700;
            font-size: clamp(0.9rem, 2cqw, 1.1rem);
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 40px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.1);
            letter-spacing: 1px;
        }

        .trigger-btn:hover {
            background: linear-gradient(135deg, #ff85b3, #ff6b9d);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.2);
        }

        .trigger-btn:active {
            transform: translateY(1px);
        }

        .status-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            color: #d4628c;
            padding: var(--space-sm) var(--space-lg);
            border: 1px solid #ffb6c1;
            border-radius: 40px;
            font-family: var(--font-family);
            font-size: clamp(0.8rem, 1.5cqw, 1rem);
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            text-align: center;
            max-width: 90vw;
            box-shadow: 0 8px 32px rgba(255, 105, 180, 0.1);
        }

        .status-toast.show {
            opacity: 1;
        }

        .st-hidden {
            display: none !important;
        }

        .play-tip {
            background: rgba(255, 182, 193, 0.15);
            border: 1px solid #ffb6c1;
            border-radius: 16px;
            padding: var(--space-sm) var(--space-md);
            margin-bottom: var(--space-md);
            text-align: center;
            color: var(--text-secondary);
            font-size: clamp(0.85rem, 1.5cqw, 0.95rem);
            line-height: 1.5;
        }

        .play-tip strong {
            color: #d4628c;
        }

        /* ========== 画廊模态框样式 ========== */
        #galleryModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 99999;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #galleryModal.show {
            display: flex;
            opacity: 1;
        }

        .gallery-content {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            max-width: 90vw;
            max-height: 90vh;
            width: 800px;
            padding: var(--space-lg);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 1px solid #ffb6c1;
        }

        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #ffb6c1;
            padding-bottom: var(--space-sm);
            margin-bottom: var(--space-md);
        }

        .gallery-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #d4628c;
        }

        .gallery-close-btn {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #a05a7a;
            transition: color 0.2s;
            line-height: 1;
        }
        .gallery-close-btn:hover {
            color: #d4628c;
        }

        /* 角色切换标签 */
        .gallery-char-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: var(--space-sm);
            border-bottom: 1px solid #ffb6c1;
            padding-bottom: var(--space-sm);
            flex-wrap: wrap;
        }

        .gallery-char-tab {
            background: transparent;
            border: 1px solid #ffb6c1;
            border-radius: 30px;
            padding: 4px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-family);
        }
        .gallery-char-tab:hover {
            background: rgba(255, 182, 193, 0.2);
        }
        .gallery-char-tab.active {
            background: #d4628c;
            color: #fff;
            border-color: #d4628c;
        }

        .gallery-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: var(--space-md);
            border-bottom: 1px solid #ffb6c1;
            padding-bottom: var(--space-sm);
        }

        .gallery-tab {
            background: transparent;
            border: 1px solid #ffb6c1;
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-family);
        }
        .gallery-tab:hover {
            background: rgba(255, 182, 193, 0.2);
        }
        .gallery-tab.active {
            background: #d4628c;
            color: #fff;
            border-color: #d4628c;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: var(--space-sm);
            overflow-y: auto;
            max-height: 55vh;
            padding-right: 4px;
        }

        .gallery-grid::-webkit-scrollbar {
            width: 4px;
        }
        .gallery-grid::-webkit-scrollbar-thumb {
            background: #d4628c;
            border-radius: 10px;
        }

        .gallery-item {
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #ffb6c1;
            cursor: pointer;
            transition: all 0.2s;
            aspect-ratio: 3/4;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gallery-item:hover {
            transform: scale(1.04);
            border-color: #d4628c;
            box-shadow: 0 4px 20px rgba(255, 105, 180, 0.2);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 全屏预览 */
        #galleryPreview {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 999999;

        function renderGallery(charName, category) {
            const grid = document.getElementById('galleryGrid');
            const tabsContainer = document.getElementById('galleryTabs');
            const charTabsContainer = document.getElementById('galleryCharTabs');
            if (!grid || !tabsContainer) return;

            // 生成角色标签
            const charNames = Object.keys(galleryData);

            charNames.forEach(name => {

                tab.textContent = name;

                tab.addEventListener('click', () => {
                    currentChar = name;

                    currentCategory = categories.length > 0 ? categories[0] : '';
                    renderGallery(currentChar, currentCategory);
                });
                charTabsContainer.appendChild(tab);

            const categories = getCategories(charName);

            if (categories.length === 0) {

            // 确保当前分类有效
            if (!categories.includes(category) && categories.length > 0) {
                category = categories[0];

            const urls = getImages(charName, category);

                item.appendChild(img);
                grid.appendChild(item);
