<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: transparent;
            color: #4a4238;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= 透明主容器 ================= */
        .scene-float {
            position: relative;
            max-width: 1040px;
            margin: 26px auto;
            padding: 40px 30px 50px;
            background: transparent;
        }

        /* ================= 纸片便签 ================= */
        .notes-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 22px 20px;
            margin-bottom: 44px;
            position: relative;
            z-index: 4;
        }

        .paper-note {
            position: relative;
            padding: 12px 26px 13px;
            font-family: "KaiTi", "STKaiti", "楷体", "Microsoft YaHei", serif;
            font-size: 15.5px;
            font-weight: 700;
            letter-spacing: 0.08em;
            border-radius: 2px;
            background: #fef8e0;
            color: #5f4a2c;
            border: 1px solid rgba(210, 190, 150, 0.55);
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.85) inset,
                2px 3px 0 rgba(210, 190, 150, 0.28),
                3px 5px 10px rgba(140, 115, 70, 0.14);
            transform: rotate(-1.3deg);
            transition: transform 0.28s cubic-bezier(0.34, 1.3, 0.64, 1), box-shadow 0.28s ease;
        }

        .paper-note:nth-child(2n) {
            transform: rotate(1.6deg);
            background: #fdf4d6;
            color: #6a4d28;
        }

        .paper-note:nth-child(3n) {
            transform: rotate(-0.5deg);
            background: #fff8dc;
            color: #5a4525;
        }

        .paper-note:hover {
            transform: rotate(0deg) translateY(-3px);
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.9) inset,
                2px 4px 0 rgba(210, 190, 150, 0.3),
                4px 7px 14px rgba(140, 115, 70, 0.18);
        }

        .paper-note::before {
            content: "";
            position: absolute;
            top: -9px;
            left: 50%;
            width: 46px;
            height: 15px;
            transform: translateX(-50%) rotate(-2.6deg);
            background: rgba(232, 222, 190, 0.7);
            border-left: 1px dashed rgba(160, 140, 100, 0.3);
            border-right: 1px dashed rgba(160, 140, 100, 0.3);
            box-shadow: 0 1px 2px rgba(140, 120, 80, 0.14);
        }

        /* ================= 拍立得网格 ================= */
        .polaroid-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 218px));
            justify-content: center;
            gap: 42px 32px;
            position: relative;
            z-index: 4;
        }

        .polaroid {
            position: relative;
            background: linear-gradient(170deg, #ffffff 0%, #fbf9f4 100%);
            padding: 9px 9px 42px;
            border-radius: 2px;
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.95) inset,
                0 12px 26px rgba(110, 90, 60, 0.2),
                0 3px 8px rgba(90, 75, 50, 0.14),
                0 0 0 1px rgba(180, 165, 135, 0.15);
            transform-origin: center top;
            transition: transform 0.34s cubic-bezier(0.34, 1.4, 0.64, 1), box-shadow 0.32s ease;
            animation: drop-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .polaroid:nth-child(3n+1) {
            transform: rotate(-2deg);
        }

        .polaroid:nth-child(3n+2) {
            transform: rotate(1.5deg);
        }

        .polaroid:nth-child(3n) {
            transform: rotate(-0.7deg);
        }

        .polaroid:hover {
            transform: rotate(0deg) translateY(-9px) scale(1.035);
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.95) inset,
                0 24px 44px rgba(110, 90, 60, 0.28),
                0 6px 14px rgba(90, 75, 50, 0.18),
                0 0 0 1px rgba(180, 165, 135, 0.2);
            z-index: 6;
        }

        @keyframes drop-in {
            from {
                opacity: 0;
                transform: translateY(-16px) rotate(0deg);
            }

            to {
                opacity: 1;
            }
        }

        .polaroid-photo {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 5;
            overflow: hidden;
            border-radius: 1px;
            background: linear-gradient(180deg, #f0ebe1, #e2dcd0);
        }

        .polaroid-photo::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: 1px;
            box-shadow: inset 0 0 26px rgba(100, 80, 55, 0.16), inset 0 1px 2px rgba(0, 0, 0, 0.08);
        }

        .polaroid-photo img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center 22%;
            filter: saturate(0.96) contrast(1.02);
            transition: transform 0.6s ease, filter 0.6s ease;
        }

        .polaroid:hover .polaroid-photo img {
            transform: scale(1.05);
            filter: saturate(1.07) contrast(1.04);
        }

        .photo-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font-family: "KaiTi", "STKaiti", "楷体", serif;
            font-size: 62px;
            font-weight: 900;
            color: rgba(140, 120, 90, 0.28);
        }

        .polaroid-caption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "KaiTi", "STKaiti", "楷体", "Microsoft YaHei", serif;
            font-size: 17px;
            font-weight: 700;
            color: #55452f;
            letter-spacing: 0.16em;
            text-indent: 0.16em;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
        }

        /* ================= 响应式 ================= */
        @media (max-width: 820px) {
            .scene-float {
                padding: 30px 20px 40px;
            }

            .polaroid-grid {
                grid-template-columns: repeat(2, minmax(0, 195px));
                gap: 36px 24px;
            }

            .notes-row {
                margin-bottom: 34px;
                gap: 18px 16px;
            }
        }

        @media (max-width: 480px) {
            .scene-float {
                padding: 24px 14px 32px;
            }

            .polaroid-grid {
                grid-template-columns: 1fr;
                justify-items: center;
                gap: 34px;
            }

            .paper-note {
                font-size: 14px;
                padding: 10px 20px 11px;
            }

            .notes-row {
                flex-direction: column;
                align-items: stretch;
            }

            .paper-note {
                text-align: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .polaroid {
                animation: none !important;
            }
        }
    </style>
</head>

            function normalizeName(value) {
                return (value || '').replace(/\s+/g, '').trim();
            }

            function getUniqueCharacters(value) {
                return Array.from(new Set(normalizeName(value).split('').filter(Boolean)));
            }

            function getCharacterCoverage(rawName, candidateName) {
                var targetChars = getUniqueCharacters(rawName);
                var candidateChars = getUniqueCharacters(candidateName);
                if (targetChars.length === 0 || candidateChars.length === 0) {
                    return { matchedCount: 0, requiredCount: 0, coverage: 0 };
                }

                var targetSet = new Set(targetChars);
                var matchedCount = candidateChars.filter(function (c) { return targetSet.has(c); }).length;
                var requiredCount = candidateChars.length >= 3 ? 2 : candidateChars.length;

                return {
                    matchedCount: matchedCount,
                    requiredCount: requiredCount,
                    coverage: matchedCount / candidateChars.length
                };
            }

            function levenshteinDistance(a, b) {
                var s = normalizeName(a);
                var t = normalizeName(b);
                var m = s.length;
                var n = t.length;
                if (m === 0) return n;
                if (n === 0) return m;

                var dp = [];
                for (var i = 0; i <= m; i++) {
                    dp.push(new Array(n + 1).fill(0));
                    dp[i][0] = i;
                }
                for (var j = 0; j <= n; j++) dp[0][j] = j;

                for (var r = 1; r <= m; r++) {
                    for (var c = 1; c <= n; c++) {
                        var cost = s[r - 1] === t[c - 1] ? 0 : 1;
                        dp[r][c] = Math.min(
                            dp[r - 1][c] + 1,
                            dp[r][c - 1] + 1,
                            dp[r - 1][c - 1] + cost
                        );
                    }
                }

                return dp[m][n];
            }

            function resolveName(rawName) {
                var target = normalizeName(rawName);
                if (!target) return null;

                if (canonicalNames.indexOf(target) !== -1) {
                    return target;
                }

                var coverageBestNames = [];
                var coverageBestScore = -1;
                var coverageBestMatchedCount = -1;

                for (var i = 0; i < canonicalNames.length; i++) {
                    var candidate = canonicalNames[i];
                    var cov = getCharacterCoverage(target, candidate);
                    if (cov.matchedCount < cov.requiredCount) continue;

                    if (

                        coverageBestScore = cov.coverage;
                        coverageBestMatchedCount = cov.matchedCount;

            }
            if (parsed.location) {
                notesHtml += '<div class="paper-note">' + parsed.location + '</div>';
            }

            notesRow.innerHTML = notesHtml;

            var grid = root.querySelector('.polaroid-grid');

            if (parsed.characters.length > 0) {
                var displayChars = parsed.characters.slice(0, 3);
                var cards = displayChars.map(function (char, idx) {
                    var variantMap = imageUrlMap[char.name];
                    var imageUrl = variantMap[char.variant] || variantMap[parsed.sceneType === 'NSFW' ? 'chiluo' : 'richang'];
                    var fallback = fallbackAvatars[char.name] || '?';
                    var onerr = "this.style.display='none';this.nextElementSibling.style.display='flex';";

                    var photoInner = imageUrl
                        ? '<img src="' + imageUrl + '" alt="' + char.name + '" onerror="' + onerr + '">' +
                          '<div class="photo-fallback" style="display:none;">' + fallback + '</div>'
                        : '<div class="photo-fallback">' + fallback + '</div>';

                    return '<div class="polaroid" style="animation-delay:' + (idx * 100) + 'ms">' +
                        '<div class="polaroid-photo">' + photoInner + '</div>' +
                        '<div class="polaroid-caption">' + char.name + '</div>' +
                        '</div>';
                }).join('');

                grid.innerHTML = cards;
            }
        })();
    </script>
</body>

</html>
