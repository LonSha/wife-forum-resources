        for (var i = 1; i <= n; i++) {
            var fn = ch + '_' + sc + '_' + act + '_' + i + '.png';
            arr.push([U(NS_BASE, fn), ch + ' · ' + sc + ' · ' + act + ' ' + i]);
        }
        return arr;
    }
    var TABS = [
        { id: 'daily', label: '日常', build: buildDaily },
        { id: 'nsfw', label: '亲密', build: buildNsfw },
        { id: 'mood', label: '心情', build: buildMood },
        { id: 'outfit', label: '换装', build: buildOutfit },
        { id: 'extra', label: '特别', build: buildExtra }
    ];
    function pagerCh(gk) {
        var p = String(gk || '').split('|');
        for (var i = 0; i < p.length; i++) {
            if (p[i] === '澪') return 'mio';
            if (p[i] === '鹤') return 'he';
        }
        return 'all';
    }
    function pagerShell(gk) {
        var _lbl = (typeof GX_LBL !== 'undefined' && GX_LBL[gk]) ? GX_LBL[gk] : gk;
        return '<div class="gx-pager" data-ch="' + pagerCh(gk) + '" data-gk="' + escCap(gk) + '">'
            + '<div class="gx-pager-title">' + escCap(_lbl) + '</div>'
            + '<div class="gx-grid"></div>'
            + '<div class="gx-pagerbar"><button type="button" class="gx-nav gx-prev" aria-label="上一页">‹</button>'
            + '<span class="gx-count"></span>'
            + '<button type="button" class="gx-nav gx-next" aria-label="下一页">›</button></div>'
            + '</div>';
    }
    function groupHtml(title, inner, open, ch) {
        return '<div class="gx-group"' + (ch ? ' data-ch="' + ch + '"' : '') + '>'
            + '<button type="button" class="gx-scene"><span>' + escCap(title) + '</span><span class="gx-arrow">▸</span></button>'
            + '<div class="gx-body' + (open ? ' gx-body--open' : '') + '">' + inner + '</div></div>';
    }
    function openOf(files) {
        var n = 0;
        for (var i = 0; i < files.length; i++) if (gxOpen(gxKey(files[i][0]))) n++;
        return n;
    }
    function regFiles(gk, files, label) {
        GX_REG[gk] = files;
        GX_LBL[gk] = label;
    }
    var GX_LBL = {};
    function buildDaily() {
        var html = '';
        TU_ORDER.forEach(function(sc, si) {
            var inner = '', total = 0, opened = 0;
            [['澪', TU_MIO], ['鹤', TU_HE]].forEach(function(pair) {
                var ch = pair[0], tbl = pair[1];
                var acts = Object.keys(tbl).filter(function(k) { return k.split('|')[0] === sc; });
                if (!acts.length) return;
                inner += '<div class="gx-ch" data-ch="' + (ch === '鹤' ? 'he' : 'mio') + '">' + ch + '</div>';
                acts.forEach(function(k) {
                    var act = k.split('|')[1];
                    var gk = 'daily|' + sc + '|' + ch + '|' + act;
                    var fl = tuFiles(ch, sc, act, tbl[k]);
                    regFiles(gk, fl, ch + ' · ' + sc + ' · ' + act);
                    total += fl.length;
                    opened += openOf(fl);
                    inner += pagerShell(gk);
                });
            });
            if (total) html += groupHtml(sc + ' · ' + opened + '/' + total, inner, false);
        });
        return html;
    }
    function buildNsfw() {
        var html = '';
        NS_SCENES.forEach(function(sc, si) {
            var inner = '', total = 0, opened = 0;
            [['澪', false], ['鹤', true]].forEach(function(pair) {
                var ch = pair[0], isHe = pair[1];
                var acts = Object.keys(NS_ACTS).concat((isHe && sc === '房间') ? ['手交'] : []);
                inner += '<div class="gx-ch" data-ch="' + (ch === '鹤' ? 'he' : 'mio') + '">' + ch + '</div>';
                acts.forEach(function(act) {
                    var n = (isHe && act === '手交') ? 3 : NS_ACTS[act];
                    var gk = 'nsfw|' + sc + '|' + ch + '|' + act;
                    var fl = nsFiles(ch, sc, act, n);
                    regFiles(gk, fl, ch + ' · ' + sc + ' · ' + act);
                    total += fl.length;
                    opened += openOf(fl);
                    inner += pagerShell(gk);
                });
            });
            html += groupHtml(sc + ' · ' + opened + '/' + total, inner, false);
        });
        return html;
    }
    function buildMood() {
        var html = '';
        [['澪'], ['鹤']].forEach(function(pair, pi) {
            var ch = pair[0];
            var inner = '', total = 0, opened = 0;
            Object.keys(CHA).forEach(function(k) {
                var p = k.split('|');
                if (p[0] !== ch) return;
                var files = [];
                for (var i = 1; i <= CHA[k]; i++) {
                    var fn = ch + '_' + p[1] + '_' + p[2] + '_' + i + '.png';
                    files.push([U(CHA_BASE, fn), ch + ' · ' + p[1] + ' · ' + p[2] + ' ' + i]);
                }
                var gk = 'mood|' + p[1] + '|' + ch + '|' + p[2];
                regFiles(gk, files, ch + ' · ' + p[1] + ' · ' + p[2]);
                total += files.length;
                opened += openOf(files);
                inner += pagerShell(gk);
            });
            if (total) html += groupHtml(ch + ' · 心情 · ' + opened + '/' + total, inner, false, (ch === '鹤' ? 'he' : 'mio'));
        });
        return html;
    }
    function chRowHtml() {
        return '<div class="gx-chrow" role="group" aria-label="角色切换">'
            + '<button type="button" class="gx-chbtn gx-chbtn--active" data-ch="mio">澪</button>'
            + '<button type="button" class="gx-chbtn" data-ch="he">鹤</button></div>';
    }
    function buildOutfit() {
        return chRowHtml()
            + '<div class="gx-outfits" data-ch="mio">' + renderOutfits('mio') + '</div>'
            + '<div class="gx-outfits" data-ch="he">' + renderOutfits('he') + '</div>';
    }
    function renderOutfits(ch) {
        var code = (ch === 'he') ? 'he' : 'ling';
        var cname = (ch === 'he') ? '鹤' : '澪';
        var html = '';
        OUTFITS.forEach(function(oa, oi) {
            var files = [];
            for (var i = 1; i <= 6; i++) {
                var fn = code + '_' + oa[1] + '_' + i + '.png';
                files.push([U(LI_BASE, fn), cname + ' · ' + oa[0] + ' ' + i]);
            }
            var gk = 'outfit|' + oa[0] + '|' + cname;
            regFiles(gk, files, cname + ' · ' + oa[0]);
            html += groupHtml(oa[0] + ' · ' + openOf(files) + '/' + files.length, pagerShell(gk), false);
        });
        return html;
    }
    function buildExtra() {
        var html = '';
        SPECIAL.forEach(function(sp) {
            [['澪', 'mio'], ['鹤', 'he']].forEach(function(pair) {
                var ch = pair[0], code = pair[1];
                var fl = sp[1].filter(function(f) {
                    var nm = '';
                    try { nm = decodeURIComponent(f[0].split('/').pop()); } catch (e) { nm = f[0]; }
                    return nm.indexOf(ch + '_') === 0;
                });
                if (!fl.length) return;
                var gk = 'extra|' + sp[0] + '|' + ch;
                regFiles(gk, fl, ch + ' · ' + sp[0]);
                html += groupHtml(sp[0] + ' · ' + ch + ' · ' + openOf(fl) + '/' + fl.length, pagerShell(gk), false, code);
            });
        });
        return html;
    }
    var GX_PAGE = 6;
    function paintPager(pager) {
        var gk = pager.getAttribute('data-gk');
        var files = GX_REG[gk] || [];
        var gp = String(gk || '').split('|');
        var gact = gp[0] === 'outfit' ? gp[1] : (gp[0] === 'extra' ? gp[1] : (gp[3] || gp[gp.length - 1] || ''));
        var fullLbl = (GX_LBL[gk] || gk || gact || '图鉴');
        var grid = pager.querySelector('.gx-grid');
        var count = pager.querySelector('.gx-count');
        var titleEl = pager.querySelector('.gx-pager-title');
        if (titleEl && !titleEl.textContent) titleEl.textContent = fullLbl;
        if (titleEl && titleEl.textContent !== fullLbl) titleEl.textContent = fullLbl;
        if (!grid) return;
        var pages = Math.max(1, Math.ceil(files.length / GX_PAGE));
        var pg = GX_IDX[gk] || 0;
        if (pg < 0) pg = 0;
        if (pg >= pages) pg = 0;
        GX_IDX[gk] = pg;
        var html = '';
        var start = pg * GX_PAGE, end = Math.min(files.length, start + GX_PAGE);
        for (var i = start; i < end; i++) {
            (function(idx) {
                var url = files[idx][0], label = files[idx][1];
                var key = gxKey(url);
                if (gxOpen(key)) {
                    html += '<button type="button" class="gx-thumb" data-full="' + url + '" title="' + escCap(label) + '">'
                        + '<img loading="lazy" decoding="async" src="' + url + '" alt="">'
                        + '<div class="gx-thumbcap">' + escCap(fullLbl + ' ' + (idx + 1)) + '</div></button>';
                } else {
                    html += '<button type="button" class="gx-thumb gx-locked" data-key="' + escCap(key) + '" title="点击解锁：' + escCap(fullLbl) + '">'
                        + '<span class="gx-lock">🔒</span><div class="gx-thumbcap">' + escCap(fullLbl) + '</div></button>';
                }
            })(i);
        }
        grid.innerHTML = html;
        try {
            var btns = grid.querySelectorAll('.gx-thumb');
            for (var bi = 0; bi < btns.length; bi++) {
                (function(b) {
                    b.addEventListener('click', function(ev) {
                        try { if (ev && ev.stopPropagation) ev.stopPropagation(); } catch (e) {}
                        if (b.classList.contains('gx-locked')) {
                            var kk = b.getAttribute('data-key') || '';
                            if (kk) {
                                unlockFile(kk);
                                var hit = gxFileByKey(kk);
                                if (hit && hit[0]) gxShowViewer(b, hit[0], hit[1] || '');
                            }
                        } else {
                            var full = b.getAttribute('data-full') || '';
                            if (full) gxShowViewer(b, full, b.getAttribute('title') || '');
                        }
                    });
                })(btns[bi]);
            }
        } catch (e) {}
        var prev = pager.querySelector('.gx-prev'), next = pager.querySelector('.gx-next');
        var multi = pages > 1;
        if (prev) prev.style.display = multi ? '' : 'none';
        if (next) next.style.display = multi ? '' : 'none';
        if (count) count.textContent = files.length ? ((pg + 1) + '/' + pages + '页') : '空';
        paintCounts(pager);
    }
    function paintCounts(pager) {
        var gk = pager.getAttribute('data-gk');
        var files = GX_REG[gk] || [];
        var n = 0;
        for (var i = 0; i < files.length; i++) if (gxOpen(gxKey(files[i][0]))) n++;
        var node = pager;
        while (node && !(node.classList && node.classList.contains('gx-group'))) node = node.parentElement;
        var btn = node ? node.querySelector('.gx-scene > span') : null;
        if (btn) {
            var t = btn.textContent || '';
            btn.textContent = t.replace(/\d+\/\d+$/, '') + n + '/' + files.length;
        }
    }
    function paintPagers(root) {
        var pagers = root.querySelectorAll ? root.querySelectorAll('.gx-pager') : [];
        for (var i = 0; i < pagers.length; i++) {
            (function(pg) {
                var body = pg;
                while (body && !(body.classList && body.classList.contains('gx-body'))) body = body.parentElement;
                if (body && !body.classList.contains('gx-body--open')) return;
                if (typeof pg.offsetParent !== 'undefined' && pg.offsetParent === null) return;
                paintPager(pg);
            })(pagers[i]);
        }
    }
    function unlockFile(key) {
        GX_mem.unlocked[key] = 1;
        gxSave();
        renderActive();
    }
    function gxFileByKey(key) {
        for (var gk in GX_REG) {
            var fl = GX_REG[gk] || [];
            for (var i = 0; i < fl.length; i++) {
                if (gxKey(fl[i][0]) === key) return fl[i];
            }
        }
        return null;
    }
    function gxScopeOf(el) {
        try { if (el && el.closest) { var w = el.closest('.gx-world'); if (w) return w; } } catch (e) {}
        try { return document.querySelector('.gx-world'); } catch (e) { return null; }
    }
    function gxShowViewer(scopeEl, url, cap) {
        var scope = gxScopeOf(scopeEl);
        var viewer = scope ? scope.querySelector('.gx-viewer') : null;
        if (!viewer) { try { viewer = document.querySelector('.gx-viewer'); } catch (e) {} }
        if (!viewer) return false;
        var vimg = viewer.querySelector('.gx-viewer-img');
        var vcap = viewer.querySelector('.gx-viewer-cap');
        if (vimg) { vimg.src = url; vimg.alt = cap || ''; }
        if (vcap) vcap.textContent = cap || '';
        viewer.classList.add('gx-viewer--open');
        try { viewer.scrollTop = 0; } catch (e) {}
        return true;
    }
    function renderActive() {
        var panes = document.querySelectorAll('.gx-pane');
        for (var i = 0; i < panes.length; i++) {
            if (panes[i].classList.contains('gx-pane--open')) paintPagers(panes[i]);
        }
    }
    function gxSetFilter(ch) {
        if (ch !== 'mio' && ch !== 'he') ch = 'all';
        var world = null;
        try { world = document.querySelector('.gx-world'); } catch (e) {}
        if (world) {
            world.classList.remove('gx-f-mio');
            world.classList.remove('gx-f-he');
            if (ch !== 'all') world.classList.add(ch === 'he' ? 'gx-f-he' : 'gx-f-mio');
        }
        var rows = [];
        try { rows = document.querySelectorAll('.gx-chrow'); } catch (e) {}
        for (var i = 0; i < rows.length; i++) {
            var btns = rows[i].querySelectorAll('.gx-chbtn');
            for (var j = 0; j < btns.length; j++) {
                btns[j].classList.toggle('gx-chbtn--active', (btns[j].getAttribute('data-ch') || 'all') === ch);
            }
        }
        try {
            var panes = document.querySelectorAll('.gx-pane--open');
            for (var k = 0; k < panes.length; k++) paintPagers(panes[k]);
        } catch (e) {}
    }
    function renderTabs() {
        var bar = document.querySelector('.gx-tabs');
        var panes = document.querySelector('.gx-panes');
        if (!bar || !panes) return;
        gxLoad();
        bar.innerHTML = '';
        panes.innerHTML = '';
        var counts = {};
        TABS.forEach(function(tb) { counts[tb.id] = 0; });
        TABS.forEach(function(tb, idx) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'gx-tab' + (idx === 0 ? ' gx-tab--active' : '');
            b.innerHTML = '<span>' + tb.label + '</span>';
            b.addEventListener('click', function() {
                var bs = bar.querySelectorAll('.gx-tab');
                for (var i = 0; i < bs.length; i++) bs[i].classList.remove('gx-tab--active');
                b.classList.add('gx-tab--active');
                var ps = panes.querySelectorAll('.gx-pane');
                for (var j = 0; j < ps.length; j++) {
                    var on = (j === idx);
                    ps[j].classList.toggle('gx-pane--open', on);
                    if (on) paintPagers(ps[j]);
                }
            });
            bar.appendChild(b);
            var p = document.createElement('div');
            p.className = 'gx-pane' + (idx === 0 ? ' gx-pane--open' : '');
            p.innerHTML = tb.build();
            panes.appendChild(p);
        });
        var obox = panes.querySelector('.gx-outfits');
        if (obox) obox.innerHTML = renderOutfits('mio');
        paintPagers(panes.querySelector('.gx-pane--open') || panes);
        var go = document.querySelector('.gx-go');
        var pass = document.querySelector('.gx-pass');
        if (go) go.addEventListener('click', function() {
            var v = pass ? pass.value : '';
            if ((v || '').trim() === GX_PASS) {
                GX_mem.all = true;
                gxSave();
                go.textContent = '已解锁';
                renderActive();
                setTimeout(function() { go.textContent = '解锁全部'; }, 1500);
            } else {
                var old = go.textContent;
                go.textContent = '密码不对';
                setTimeout(function() { go.textContent = old; }, 1200);
            }
        });
        panes.addEventListener('click', function(e) {
            var t = e.target && e.target.closest ? e.target.closest('.gx-nav,.gx-lockface,.gx-photo,.gx-scene,.gx-chbtn,.gx-thumb,.gx-locked') : null;
            if (!t || !panes.contains(t)) return;
            if (t.classList.contains('gx-nav')) {
                var pg = t.closest ? t.closest('.gx-pager') : null;
                if (!pg) return;
                var gk = pg.getAttribute('data-gk');
                var files = GX_REG[gk] || [];
                var pages = Math.max(1, Math.ceil(files.length / GX_PAGE));
                var idx = GX_IDX[gk] || 0;
                idx = (idx + (t.classList.contains('gx-prev') ? -1 : 1) + pages) % pages;
                GX_IDX[gk] = idx;
                paintPager(pg);
                return;
            }
            if (t.classList.contains('gx-locked')) {
                var kk = t.getAttribute('data-key') || '';
                if (kk) {
                    unlockFile(kk);
                    var hit = gxFileByKey(kk);
                    if (hit && hit[0]) gxShowViewer(t, hit[0], hit[1] || '');
                }
                return;
            }
            if (t.classList.contains('gx-thumb')) {
                var full = t.getAttribute('data-full');
                if (full) gxShowViewer(t, full, t.getAttribute('title') || '');
                return;
            }

            if (t.classList.contains('gx-scene')) {
                var body = t.nextElementSibling;
                if (body) {
                    body.classList.toggle('gx-body--open');
                    var ar = t.querySelector('.gx-arrow');
                    if (ar) ar.textContent = body.classList.contains('gx-body--open') ? '▾' : '▸';
                    if (body.classList.contains('gx-body--open')) paintPagers(body);

        var viewer = document.querySelector('.gx-viewer');
        var vimg = viewer ? viewer.querySelector('.gx-viewer-img') : null;
        var vcap = viewer ? viewer.querySelector('.gx-viewer-cap') : null;
        var vclose = viewer ? viewer.querySelector('.gx-close') : null;
        window.__gxOpenViewer = function(url, cap) {
            if (gxShowViewer(viewer, url, cap)) return;
            if (!viewer) return;

            try { viewer.scrollTop = 0; } catch (e) {}

        window.__gxCloseViewer = function() { if (viewer) viewer.classList.remove('gx-viewer--open'); };

        var grow = document.querySelector('.gx-chrow--global');
        if (grow) {
            var gbtns = grow.querySelectorAll('.gx-chbtn');
            for (var gi = 0; gi < gbtns.length; gi++) {
                (function(btn) {
                    btn.addEventListener('click', function() { gxSetFilter(btn.getAttribute('data-ch') || 'all'); });

    }
    window.__gx = {
        stats: function() {
            var total = 0, open = 0;

                    total++;
                    if (gxOpen(gxKey(GX_REG[k][i][0]))) open++;
                }
            }
            return { total: total, open: open, groups: Object.keys(GX_REG).length };
        },
        unlock: function(key) { unlockFile(key); },
        unlockAll: function(pass) {
            if ((pass || '') !== GX_PASS) return false;
            GX_mem.all = true; gxSave(); renderActive(); return true;
        }
    };
/* 满血API纯文字降级：API/模型名含“满血”时只留纯文字（fail-open：异常则正常渲染） */
function uwIsFullBlood(msgObj){
  try{
    var budget={n:0};
    function scan(v,depth){
      if(v==null||depth>4||budget.n>300)return false;
      if(typeof v==='string'){budget.n++;return v.indexOf('满血')!==-1;}
      if(typeof v!=='object')return false;
      if(Object.prototype.toString.call(v)==='[object Array]'){for(var i=0;i<v.length&&i<12;i++){try{if(scan(v[i],depth+1))return true;}catch(e){}}return false;}
      var skip={message:1,raw:1,mes:1,chat:1,messages:1,characters:1,character:1,lorebook:1,lorebooks:1,worldbook:1,prompt:1,prompts:1,data:1,html:1,innerHTML:1};
      for(var k in v){
        if(!Object.prototype.hasOwnProperty.call(v,k))continue;
        if(skip[k])continue;
        var val=null;
        try{val=v[k];}catch(e){continue;}
        try{if(scan(val,depth+1))return true;}catch(e){}
      }
      return false;
    }
    try{if(msgObj&&scan(msgObj,0))return true;}catch(e){}
    var ctx=null;
    try{if(window.SillyTavern&&window.SillyTavern.getContext)ctx=window.SillyTavern.getContext();}catch(e){ctx=null;}
    if(!ctx){try{if(window.parent&&window.parent.SillyTavern&&window.parent.SillyTavern.getContext)ctx=window.parent.SillyTavern.getContext();}catch(e){ctx=null;}}
    try{if(ctx&&scan(ctx,0))return true;}catch(e){}
  }catch(e){}
  return false;
}
function uwCurMsg(){
  try{if(typeof getChatMessages==='function'&&typeof getCurrentMessageId==='function'){var m=getChatMessages(getCurrentMessageId());if(m&&m.length)return m[0];}}catch(e){}
  return null;
}
    try{
      if(uwIsFullBlood(uwCurMsg())){var _gxW=null;try{_gxW=document.querySelector('.gx-world');}catch(e){}if(_gxW){_gxW.textContent='全图鉴仓库（满血模式：纯文字，已隐藏图片）';}return;}
    }catch(e){}
    renderTabs();
})();
