<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>角色档案 · 手机浏览卡 v3.8 (双端视觉强化版)</title>
<style>
    :root{
        --accent:#c67b52;
        --accent-soft:rgba(198,123,82,0.14);
        --accent-glow:rgba(198,123,82,0.35);
        --bg:#eef0f3;
        --panel:#ffffff;
        --panel-2:#f5f6f8;
        --text:#1d1d1f;
        --text-sub:#8a8d93;
        --border:rgba(0,0,0,0.07);
        --shadow:rgba(20,24,40,0.10);
        --shadow-strong:rgba(20,24,40,0.22);
        --skeleton:linear-gradient(90deg,#eceef1 25%,#e2e5ea 50%,#eceef1 75%);
        --device-body:linear-gradient(150deg,#3a3a40 0%,#1c1c20 55%,#252529 100%);
        --status-ink:#1d1d1f;
        --modal-bg:rgba(238,240,243,0.92);
        --modal-bg-solid:rgba(238,240,243,0.97);
    }
    body.dark{
        --bg:#0e0f12;
        --panel:#17181c;
        --panel-2:#1f2025;
        --text:#f1f2f5;
        --text-sub:#83868f;
        --border:rgba(255,255,255,0.08);
        --shadow:rgba(0,0,0,0.5);
        --shadow-strong:rgba(0,0,0,0.7);
        --skeleton:linear-gradient(90deg,#1a1b1f 25%,#232429 50%,#1a1b1f 75%);
        --device-body:linear-gradient(150deg,#2a2a30 0%,#0d0d10 55%,#1a1a1e 100%);
        --status-ink:#f1f2f5;
        --modal-bg:rgba(10,11,14,0.94);
        --modal-bg-solid:rgba(10,11,14,0.97);
    }

    *{margin:0;padding:0;box-sizing:border-box;}
    body{
        font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
        background:transparent; padding:3vw; color:var(--text);
        -webkit-font-smoothing:antialiased;
        -webkit-tap-highlight-color:transparent;
    }

    .device{
        position:relative; max-width:1000px; margin:0 auto;
        background:var(--device-body); padding:15px; border-radius:46px;
        box-shadow:
            0 30px 60px -20px var(--shadow-strong),
            0 8px 20px var(--shadow),
            inset 0 0 0 2px rgba(255,255,255,0.06),
            inset 0 2px 2px rgba(255,255,255,0.10);
        opacity:0; transform:translateY(20px) scale(0.985);
        animation:deviceIn 0.7s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    @keyframes deviceIn{to{opacity:1;transform:translateY(0) scale(1);}}

    .dev-btn{position:absolute;background:#111214;border-radius:3px;box-shadow:inset 0 0 2px rgba(0,0,0,0.6);}
    .dev-btn.power{top:120px;right:-3px;width:3px;height:70px;}
    .dev-btn.vol-a{top:110px;left:-3px;width:3px;height:46px;}
    .dev-btn.vol-b{top:166px;left:-3px;width:3px;height:46px;}

    .screen{
        position:relative; border-radius:32px; overflow:hidden;
        background:
            radial-gradient(900px 420px at 78% -8%, var(--accent-soft), transparent 62%),
            radial-gradient(700px 380px at -10% 108%, var(--accent-soft), transparent 58%),
            linear-gradient(180deg, var(--bg), var(--bg));
        display:flex; flex-direction:column;
        min-height:560px; transition:background .4s ease;
    }
    body.dark .screen{
        background:
            radial-gradient(900px 420px at 78% -8%, var(--accent-soft), transparent 62%),
            radial-gradient(700px 380px at -10% 108%, var(--accent-soft), transparent 58%),
            linear-gradient(180deg, var(--bg), var(--bg));
    }

    .ambient{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
    .ambient::before,.ambient::after,.ambient .blob3{
        content:'';position:absolute;border-radius:50%;filter:blur(70px);
        background:var(--accent);animation:blob 9s ease-in-out infinite alternate;
    }
    .ambient::before{width:380px;height:380px;top:-140px;right:-80px;opacity:.32;animation-duration:8s;}
    .ambient::after{width:320px;height:320px;bottom:-120px;left:-60px;opacity:.22;animation-duration:11s;animation-direction:alternate-reverse;}
    .ambient .blob3{width:240px;height:240px;top:30%;left:35%;opacity:.16;animation-duration:14s;}
    body:not(.dark) .ambient::before{opacity:.36;}
    body:not(.dark) .ambient::after{opacity:.27;}
    body:not(.dark) .ambient .blob3{opacity:.18;}
    @keyframes blob{0%{transform:translate(0,0) scale(1);}100%{transform:translate(20px,-30px) scale(1.2);}}

    .pts{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
    .pt{position:absolute;bottom:-10px;border-radius:50%;background:var(--accent);
        box-shadow:0 0 6px var(--accent-glow),0 0 16px var(--accent-glow);
        animation:cFloat linear infinite;opacity:0;}
    @keyframes cFloat{
        0%{transform:translate(0,0) scale(.5);opacity:0;}
        12%{opacity:.55;}
        85%{opacity:.35;}
        100%{transform:translate(var(--drift,0px),-520px) scale(1.3);opacity:0;}
    }

    .status-bar{
        position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;
        padding:12px 26px 6px; font-size:13px; font-weight:600; color:var(--status-ink);
        letter-spacing:.3px;
    }
    .sb-right{display:flex;align-items:center;gap:6px;}
    .sb-right svg{display:block;}

    .browser-bar{
        position:relative;z-index:5;display:flex;align-items:center;gap:10px;
        margin:2px 16px 10px; padding:8px 14px; border-radius:14px;
        background:var(--panel); border:1px solid var(--border);
        box-shadow:0 2px 8px var(--shadow);
    }
    .bb-url{
        flex:1;display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;
        font-size:12.5px;color:var(--text-sub);font-family:"SF Mono",Consolas,monospace;
    }
    .bb-url b{
        color:var(--text);font-weight:600;white-space:nowrap;
        display:inline-flex;min-width:100%;overflow:hidden;
    }
    .bb-marquee{display:inline-flex;white-space:nowrap;}
    .bb-marquee.scroll{animation:bbRoll 12s linear infinite;}
    .bb-marquee.scroll .bb-seg{padding-right:48px;}
    .bb-marquee:hover{animation-play-state:paused;}
    @keyframes bbRoll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
    .bb-lock{flex-shrink:0;}
    .theme-toggle{
        flex-shrink:0;width:30px;height:30px;border:none;border-radius:9px;cursor:pointer;
        background:var(--panel-2);color:var(--accent);font-size:15px;display:flex;
        align-items:center;justify-content:center;transition:.25s;
    }
    .theme-toggle:hover{transform:scale(1.08) rotate(12deg);box-shadow:0 0 12px var(--accent-glow);}

    .screen-body{position:relative;z-index:4;flex:1;display:flex;padding:4px 16px 20px;gap:22px;}

    .sprite-area{
        position:relative;flex:0 0 40%;border-radius:22px;
        box-shadow:0 12px 30px -10px var(--shadow-strong);
        cursor:pointer;perspective:1400px;
    }
    .flip-inner{
        position:relative;width:100%;height:100%;border-radius:22px;
        transition:transform .75s cubic-bezier(.4,.15,.2,1);
        transform-style:preserve-3d;
    }
    .sprite-area.flipped .flip-inner{transform:rotateY(180deg);}
    .flip-face{
        position:absolute;inset:0;border-radius:22px;overflow:hidden;
        -webkit-backface-visibility:hidden;backface-visibility:hidden;
        background:var(--skeleton);background-size:200% 100%;
        animation:skeleton 1.4s linear infinite;
    }
    .flip-face.back{transform:rotateY(180deg);}
    @keyframes skeleton{to{background-position:-200% 0;}}
    .sprite-img{
        width:100%;height:100%;object-fit:cover;object-position:top center;display:block;
        opacity:0;transition:opacity .6s ease,transform .8s cubic-bezier(.2,.8,.2,1);
    }
    .sprite-img.loaded{opacity:1;}
    .sprite-area:hover .sprite-img.loaded{transform:scale(1.045);}
    .sprite-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.35),transparent 45%);pointer-events:none;z-index:2;}

    .online-pill{
        position:absolute;top:14px;left:14px;z-index:3;display:flex;align-items:center;gap:6px;
        padding:5px 11px;border-radius:20px;background:rgba(20,20,24,.55);backdrop-filter:blur(6px);
        color:#fff;font-size:11px;font-weight:600;letter-spacing:.5px;
    }
    .online-pill .dot{width:7px;height:7px;border-radius:50%;background:#4fd07f;box-shadow:0 0 8px #4fd07f;animation:pulseDot 2s infinite;}
    @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.4;}}

    .sprite-tag{
        position:absolute;bottom:14px;left:14px;z-index:3;padding:6px 14px;border-radius:12px;
        background:rgba(20,20,24,.5);backdrop-filter:blur(6px);color:#fff;
        font-size:12px;font-weight:600;letter-spacing:1px;
    }
    .flip-hint{
        position:absolute;top:14px;right:14px;z-index:4;display:flex;align-items:center;gap:5px;
        font-size:10px;color:#fff;background:rgba(20,20,24,.5);backdrop-filter:blur(6px);
        padding:5px 10px;border-radius:20px;letter-spacing:.5px;pointer-events:none;
        box-shadow:0 2px 8px rgba(0,0,0,.25);
    }
    .flip-hint svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:2;
        stroke-linecap:round;stroke-linejoin:round;animation:flipSpin 2.6s ease-in-out infinite;}
    @keyframes flipSpin{0%,68%,100%{transform:rotate(0);}82%{transform:rotate(180deg);}92%{transform:rotate(158deg);}}

    .info-area{flex:1;display:flex;flex-direction:column;min-width:0;padding-top:4px;}

    .cards-row{display:contents;}

    .ph-titletag{
        display:inline-flex;align-self:flex-start;align-items:center;gap:6px;
        font-size:12px;font-weight:700;letter-spacing:1px;color:var(--accent);
        background:var(--accent-soft);padding:5px 12px;border-radius:20px;
        opacity:0;animation:up .5s ease forwards .15s;
    }
    .ph-name{
        margin-top:12px;font-size:34px;font-weight:800;letter-spacing:1px;line-height:1.1;
        display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
        opacity:0;animation:up .5s ease forwards .22s;
    }
    .ph-en{font-size:14px;font-weight:600;color:var(--text-sub);letter-spacing:2px;text-transform:uppercase;font-family:"SF Mono",Consolas,monospace;}
    .ph-meta{margin-top:14px;display:flex;gap:9px;flex-wrap:wrap;opacity:0;animation:up .5s ease forwards .3s;}
    .chip{
        display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:12px;
        background:linear-gradient(180deg,var(--panel),var(--panel-2));
        border:1px solid var(--border);font-size:13px;font-weight:600;
        color:var(--text);box-shadow:0 2px 8px var(--shadow);
    }
    .chip i{font-style:normal;font-size:11px;color:var(--text-sub);font-weight:500;}
    .chip .gdot{width:7px;height:7px;border-radius:50%;background:#4fd07f;box-shadow:0 0 6px #4fd07f;}

    .mood-chip-mobile{display:none;}

    .ph-sign{
        margin-top:16px;font-size:14px;color:var(--text-sub);line-height:1.6;
        padding-left:13px;border-left:3px solid var(--accent);opacity:0;animation:up .5s ease forwards .38s;
    }

    .voice-card{
        position:relative;margin-top:20px;padding:18px 20px 16px;border-radius:16px;
        background:linear-gradient(180deg,var(--panel),var(--panel-2));
        border:1px solid var(--border);box-shadow:0 6px 18px var(--shadow);
        overflow:hidden;opacity:0;animation:up .55s ease forwards .46s;
    }
    .voice-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
    .vc-quote{position:absolute;top:-6px;right:16px;font-size:70px;line-height:1;color:var(--accent-soft);font-family:Georgia,serif;pointer-events:none;}

    .vc-theme{
        position:relative;z-index:1;margin-bottom:8px;padding-bottom:10px;
        border-bottom:1px dashed var(--border);
        display:flex;align-items:center;gap:9px;min-width:0;
        font-size:13px;font-style:italic;font-weight:600;color:var(--accent);
        letter-spacing:.5px;cursor:pointer;user-select:none;
        transition:opacity .25s;
    }
    .vc-theme:hover{opacity:.75;}
    .vc-eq{display:inline-flex;align-items:flex-end;gap:2.5px;height:14px;flex-shrink:0;}
    .vc-eq i{width:3px;border-radius:2px;background:var(--accent);height:4px;transition:height .35s ease;}
    .vc-theme.playing .vc-eq i{animation:eqJump .9s ease-in-out infinite;}
    .vc-theme.playing .vc-eq i:nth-child(1){animation-duration:.82s;animation-delay:0s;}
    .vc-theme.playing .vc-eq i:nth-child(2){animation-duration:1.08s;animation-delay:-.35s;}
    .vc-theme.playing .vc-eq i:nth-child(3){animation-duration:.68s;animation-delay:-.15s;}
    .vc-theme.playing .vc-eq i:nth-child(4){animation-duration:1.15s;animation-delay:-.55s;}
    @keyframes eqJump{0%,100%{height:4px;}30%{height:14px;}55%{height:7px;}75%{height:11px;}}

    .vc-song-wrap{
        flex:1; overflow:hidden; display:flex; align-items:center; white-space:nowrap; min-width:0;
    }
    .vc-song{
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;
    }
    .vc-song.marquee-text{
        display:inline-block; padding-left:100%; animation:songMarquee 8s linear infinite;
        overflow:visible; text-overflow:clip;
    }
    @keyframes songMarquee{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}
    .vc-theme.playing .vc-song{animation:songBreath 2.6s ease-in-out infinite;}
    .vc-theme.playing .vc-song.marquee-text{animation:songMarquee 8s linear infinite;}
    @keyframes songBreath{0%,100%{opacity:1;}50%{opacity:.55;}}

    .vc-player{display:flex;align-items:center;gap:10px;margin:12px 0 10px;position:relative;z-index:1;}
    .vp-btn{
        flex-shrink:0;width:30px;height:30px;border:none;border-radius:50%;cursor:pointer;
        background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;
        transition:.25s;box-shadow:0 2px 8px -2px var(--accent-glow);
    }
    .vp-btn svg{width:13px;height:13px;fill:currentColor;display:block;}
    .vp-btn:hover{background:var(--accent);color:#fff;transform:scale(1.08);box-shadow:0 4px 14px -2px var(--accent-glow);}
    .vp-track{flex:1;padding:8px 0;cursor:pointer;min-width:0;}
    .vp-rail{height:4px;border-radius:4px;background:var(--border);overflow:hidden;position:relative;}
    .vp-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-glow));border-radius:4px;transition:width .25s linear;}
    .vp-time{
        flex-shrink:0;font-size:10px;font-weight:600;color:var(--text-sub);
        font-family:"SF Mono",Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:.5px;
    }
    .vp-hint{
        position:absolute;left:0;top:-34px;z-index:6;display:inline-flex;align-items:center;gap:5px;
        background:var(--accent);color:#fff;font-size:11px;font-weight:600;padding:5px 11px;border-radius:12px;
        white-space:nowrap;box-shadow:0 4px 12px -2px var(--accent-glow);pointer-events:none;
        opacity:0;animation:hintIn .5s ease forwards 1.2s;
    }
    .vp-hint::after{content:'';position:absolute;left:14px;bottom:-4px;width:8px;height:8px;background:var(--accent);transform:rotate(45deg);border-radius:2px;}
    .vp-hint.gone{opacity:0 !important;animation:none;transition:.4s;transform:translateY(4px);}
    @keyframes hintIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

    .vc-label{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;position:relative;z-index:1;}
    .vc-text{margin-top:9px;font-size:15px;line-height:1.7;color:var(--text);font-weight:500;position:relative;z-index:1;}

    .heart-panel{
        margin-top:16px;padding:16px 20px;border-radius:16px;color:var(--accent);
        background:linear-gradient(180deg,var(--panel),var(--panel-2));
        border:1px solid var(--border);box-shadow:0 6px 18px var(--shadow);
        opacity:0;animation:up .55s ease forwards .54s;
    }
    .hp-top{display:flex;align-items:center;gap:12px;}
    .hp-heart{width:26px;height:26px;fill:var(--accent);flex-shrink:0;filter:drop-shadow(0 0 4px var(--accent-glow));animation:beat var(--beat,0.8s) ease-in-out infinite;}
    @keyframes beat{0%,100%{transform:scale(1);}14%{transform:scale(1.22);}28%{transform:scale(1);}42%{transform:scale(1.14);}}
    .hp-title{display:flex;flex-direction:column;line-height:1.2;}
    .hp-title b{font-size:14px;color:var(--text);font-weight:700;letter-spacing:.5px;}
    .hp-title span{font-size:10px;color:var(--text-sub);letter-spacing:2px;font-family:"SF Mono",Consolas,monospace;}
    .hp-bpm{margin-left:auto;font-size:30px;font-weight:800;color:var(--text);line-height:1;font-variant-numeric:tabular-nums;}
    .hp-bpm small{font-size:12px;font-weight:600;color:var(--text-sub);margin-left:3px;}
    .hp-mood{font-size:12px;font-weight:700;color:#fff;background:var(--mood-c,var(--accent));padding:4px 11px;border-radius:20px;margin-left:12px;
        display:inline-flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:0 2px 8px -1px var(--mood-c,var(--accent));}
    .ecg{margin-top:12px;height:44px;overflow:hidden;position:relative;color:var(--accent);}
    .ecg::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--panel),transparent 12% 88%,var(--panel));z-index:2;pointer-events:none;}
    .ecg-track{display:flex;width:200%;height:100%;animation:ecgScroll 3s linear infinite;}
    .ecg-track svg{width:50%;height:100%;flex-shrink:0;}
    @keyframes ecgScroll{to{transform:translateX(-50%);}}

    .actions{margin-top:auto;padding-top:18px;display:flex;align-items:center;gap:12px;opacity:0;animation:up .55s ease forwards .62s;flex-wrap:wrap;}
    .btn-gallery{
        display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:14px;border:none;cursor:pointer;
        background:linear-gradient(180deg,var(--accent),var(--accent));color:#fff;font-size:14px;font-weight:700;letter-spacing:.5px;
        box-shadow:0 6px 16px -4px var(--accent-glow);transition:.25s;
    }
    .btn-gallery:hover{transform:translateY(-2px);box-shadow:0 10px 22px -4px var(--accent-glow);}
    .btn-calendar{
        display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:14px;border:1px solid var(--border);cursor:pointer;
        background:linear-gradient(180deg,var(--panel),var(--panel-2));color:var(--text);font-size:14px;font-weight:700;letter-spacing:.5px;
        box-shadow:0 4px 12px var(--shadow);transition:.25s;
    }
    .btn-calendar svg{width:15px;height:15px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    .btn-calendar:hover{transform:translateY(-2px);border-color:var(--accent);color:var(--accent);box-shadow:0 8px 18px var(--shadow);}
    .sys-note{font-size:11px;color:var(--text-sub);font-family:"SF Mono",Consolas,monospace;letter-spacing:1px;}

    @keyframes up{to{opacity:1;transform:translateY(0);}}
    .ph-titletag,.ph-name,.ph-meta,.ph-sign,.voice-card,.heart-panel,.actions{transform:translateY(12px);}

    .home-bar{position:relative;z-index:5;width:120px;height:5px;border-radius:5px;background:var(--text-sub);opacity:.4;margin:6px auto 12px;}

    .gallery-modal{
        position:fixed;inset:0;z-index:9999;background:var(--modal-bg);backdrop-filter:blur(14px);
        display:flex;flex-direction:column;align-items:center;padding:32px 20px;overflow-y:auto;
        opacity:0;pointer-events:none;visibility:hidden;
        transition:opacity .35s ease, visibility .35s ease;
    }
    .gallery-modal.active{opacity:1;pointer-events:auto;visibility:visible;}
    .g-close{
        position:fixed;top:24px;right:26px;width:42px;height:42px;border-radius:50%;border:1px solid var(--border);
        background:var(--panel);color:var(--text);font-size:22px;display:flex;align-items:center;justify-content:center;
        cursor:pointer;z-index:20;box-shadow:0 4px 14px var(--shadow);transition:.25s;
    }
    .g-close:hover{background:#e0524e;color:#fff;transform:rotate(90deg);border-color:transparent;}
    .g-head{width:100%;max-width:1040px;text-align:center;margin-bottom:20px;}
    .g-title{font-size:24px;font-weight:800;letter-spacing:2px;color:var(--text);}
    .g-title small{display:block;font-size:11px;font-weight:600;color:var(--text-sub);letter-spacing:3px;margin-top:6px;text-transform:uppercase;}

    .g-tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
    .char-tab{
        padding:9px 20px;border-radius:24px;border:1.5px solid var(--border);background:var(--panel);
        color:var(--text);font-size:14px;font-weight:700;cursor:pointer;transition:.25s;box-shadow:0 2px 8px var(--shadow);
        display:inline-flex;align-items:center;gap:6px;
    }
    .char-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 18px -4px var(--accent-glow);}
    .char-tab:not(.active):not(.locked):hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px);}
    .char-tab.locked{background:var(--panel-2);color:var(--text-sub);border-style:dashed;cursor:not-allowed;opacity:.8;}
    .char-tab.demon{
        background:rgba(150,60,120,0.10);color:#a04f86;

    .cal-tip{

    .cal-tip::after{
        content:'';position:absolute;top:100%;left:50%;margin-left:-4px;
        border:4px solid transparent;border-top-color:var(--text);
    }

function pickN(n, k){
    const arr=[]; for(let i=1;i<=n;i++) arr.push(i);
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
    return arr.slice(0, Math.min(k, n));
}

/* ========== 解析 scene_card ========== */
function parseData(text){
    const r={charId:null,image:'',voice:'',bpm:0,mood:'',age:null,birthday:null,name:null,date:'',time:'',place:'',raw:text};
    const m=text.match(/<scene_card>([\s\S]*?)(?:<\/scene_card>|$)/);
    const body = m ? m[1] : text;
    const get=(k)=>{const mm=body.match(new RegExp('\\['+k+'\\|(.*?)\\]'));return mm?mm[1].trim():'';};
    r.charId=get('角色')||null;
    r.image=get('图片');
    r.voice=get('心声');
    const bpm=get('心跳'); r.bpm=bpm?parseInt(bpm,10)||0:0;
    r.mood=get('心情')||'';
    const age=get('年龄'); if(age) r.age=parseInt(age,10)||null;
    r.birthday=get('生日')||null;
    r.name=get('姓名')||null;
    r.date=get('日期')||'';
    r.time=get('时间')||'';
    r.place=get('地点')||'';

    if(!r.charId && r.image){
        for(const id in ROLE_PROFILES){
            if(r.image.indexOf(id)===0 || r.image.indexOf(imgIdOf(id))===0){r.charId=id;break;}
        }
    }
    if(!r.charId){
        for(const id in ROLE_PROFILES){
            if(ROLE_PROFILES[id].aliases.some(a=>body.includes(a))){r.charId=id;break;}
        }
    }
    if(!r.charId || !ROLE_PROFILES[r.charId]) r.charId='lin_wenxia';
    return r;
}

function parseImageField(charId,raw){
    let s=(raw||'').trim();
    if(!s) return {cat:'daily', index:1};
    s=s.replace(/\.png$/i,'');
    const prefixes=[imgIdOf(charId), charId].filter((v,i,a)=>a.indexOf(v)===i);
    let index=1, cat=s, matched=false;
    for(const pre of prefixes){
        const re=new RegExp('^'+pre+'(\\d+)?_');
        const mm=s.match(re);
        if(mm){
            if(mm[1]) index=parseInt(mm[1],10)||1;
            cat=s.slice(mm[0].length);
            matched=true;
            break;
        }
    }
    if(!matched){
        const tail=s.match(/^([a-z]+?)(\d+)?$/i);
        if(tail){ cat=tail[1]; if(tail[2]) index=parseInt(tail[2],10)||1; }
    }
    if(!CAT_COUNT.hasOwnProperty(cat)){ cat='daily'; index=1; }
    return {cat, index};
}

function tpSeek(ev){
    const a=TP.audio; if(!a || !isFinite(a.duration) || a.duration<=0) return;
    const rect=ev.currentTarget.getBoundingClientRect();
    const frac=Math.min(1,Math.max(0,(ev.clientX-rect.left)/rect.width));
    a.currentTime=frac*a.duration;
    tpSyncUI();
}

    const songEl = document.getElementById('vcSong');

    if (!wrap) return;
    if (songEl.scrollWidth > wrap.clientWidth) {

    } else {

    }

function tpSyncUI(){
    const a=TP.audio; if(!a) return;
    const btn=document.getElementById('vpBtn');
    const fill=document.getElementById('vpFill');
    const time=document.getElementById('vpTime');
    const themeRow=document.getElementById('vcTheme');
    const songEl=document.getElementById('vcSong');
    const dur=isFinite(a.duration)?a.duration:0;
    const cur=a.currentTime||0;
    const playing=!a.paused;
    if(btn) btn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    if(fill) fill.style.width = (dur? (cur/dur*100):0)+'%';
    if(time) time.textContent = tpFmt(cur)+' / '+tpFmt(dur);
    if(themeRow) themeRow.classList.toggle('playing', playing);

    if(songEl){
        const song=(ROLE_PROFILES[TP.charId]||{}).song||'';
        songEl.textContent = (playing?'正在播放':'点击播放')+'《'+song+'》';
        checkSongMarquee();
    }
}

function setupBarMarquee(){
    var box=document.getElementById('bbUrlText');
    var mq=document.getElementById('bbMarquee');
    if(!box||!mq) return;
    var seg=mq.querySelector('.bb-seg');
    if(!seg) return;
    requestAnimationFrame(function(){
        var need = seg.scrollWidth > box.clientWidth + 2;
        if(need){
            var clone=seg.cloneNode(true);
            clone.setAttribute('aria-hidden','true');
            mq.appendChild(clone);
            mq.classList.add('scroll');
        }else{
            mq.classList.remove('scroll');
        }
    });
}

function hexA(hex,a){
    const h=hex.replace('#','');
    const r=parseInt(h.substring(0,2),16),g=parseInt(h.substring(2,4),16),b=parseInt(h.substring(4,6),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
}

function mixHex(hex,amt,towardWhite){
    const h=hex.replace('#','');
    let r=parseInt(h.substring(0,2),16),g=parseInt(h.substring(2,4),16),b=parseInt(h.substring(4,6),16);
    const t=towardWhite?255:0;
    r=Math.round(r+(t-r)*amt);g=Math.round(g+(t-g)*amt);b=Math.round(b+(t-b)*amt);
    const hx=function(v){return (v<16?'0':'')+v.toString(16);};
    return '#'+hx(r)+hx(g)+hx(b);
}

function flipSprite(el){

window.calTip = function(el){
    var opened = el.classList.contains('show-tip');
    var all = document.querySelectorAll('.day.show-tip');
    for(var i=0;i<all.length;i++){ all[i].classList.remove('show-tip'); }

function renderCalendar(){
    const grid = document.getElementById('calGrid');
    const startY = 2025;
    let html = '';
    for(let i=0;i<12;i++){
        const m = (8+i)%12;
        const y = m>=8 ? startY : startY+1;
        const first = new Date(y, m, 1).getDay();
        const days  = new Date(y, m+1, 0).getDate();

        let dh = '';
        for(let e=0;e<first;e++) dh += '<div class="day empty"></div>';

        for(let d=1; d<=days; d++){
            const key = ('0'+(m+1)).slice(-2) + '-' + ('0'+d).slice(-2);
            const ev = CAL_EVENTS[key];
            const bd = BIRTHDAYS[key];
            const dow = new Date(y, m, d).getDay();

            let cls = 'day', st = '', tip = '';
            if(dow===0 || dow===6) cls += ' wknd';
            if(ev){ cls += ' ev-'+ev.k; tip += ev.t; }
            if(bd){ cls += ' is-bd'; st = '--bd-c:'+bd.c+';'; tip = (tip ? tip+' · ' : '') + '🎂 '+bd.n+' 的生日'; }

            dh += '<div class="'+cls+'" style="'+st+'"'+(tip?' onclick="calTip(this)"':'')+'>'+d+
                  (tip ? '<span class="cal-tip">'+esc(tip)+'</span>' : '')+'</div>';
        }

        html += '<div class="month-card">'+
                    '<div class="m-name"><b>'+(m+1)+'月</b><span>'+MONTH_EN[m]+'</span></div>'+
                    '<div class="d-week"><span class="wk-end">日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="wk-end">六</span></div>'+
                    '<div class="d-grid">'+dh+'</div>'+
                '</div>';
    }
    grid.innerHTML = html;
}

function hasCard(t){ return typeof t==='string' && t.indexOf('<scene_card>')!==-1; }

function pickCardText(){
    try{
        if(typeof getChatMessages==='function'){
            var id = (typeof getCurrentMessageId==='function') ? getCurrentMessageId() : null;
            if(id!==null && id!==undefined){
                var cur=getChatMessages(id);
                if(cur && cur.length){
                    for(var i=0;i<cur.length;i++){
                        if(hasCard(cur[i].message)) return cur[i].message;
                    }
                }
            }
            var all=getChatMessages();
            if(all && all.length){
                for(var j=all.length-1;j>=0;j--){
                    if(hasCard(all[j].message)) return all[j].message;
                }
            }
        }
    }catch(e){}
    return null;
}

function initReal(){
    var txt=pickCardText();
    if(txt){ renderPage(parseData(txt)); return; }
    renderPage(parseData(demoData()));
}
