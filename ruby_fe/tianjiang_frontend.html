<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galgame风场景切幕卡</title>
    <style>
        :root {
            --theme-color: #ff758c;
            --theme-light: rgba(255, 117, 140, 0.15);
            --theme-glow: rgba(255, 117, 140, 0.3);
            --danger-color: #ff4757;
            --danger-glow: rgba(255, 71, 87, 0.5);
            --bg-color: #fcfcfd;
            --panel-bg: #ffffff;
            --sprite-bg: #f8f9fa;
            --text-main: #2c2c2c;
            --text-sub: #888888;
            --border-color: rgba(0, 0, 0, 0.05);
            --shadow-base: rgba(0, 0, 0, 0.05);
            --shadow-heavy: rgba(0, 0, 0, 0.15);
            --skeleton-bg: linear-gradient(90deg, #f4f5f7 25%, #e9ecef 50%, #f4f5f7 75%);
            --overlay-pattern: rgba(255, 255, 255, 0.5);
            --modal-bg: rgba(252, 252, 253, 0.95);
            --tag-bg: rgba(255, 255, 255, 0.85);
            --tab-locked: #f0f0f0;
            --heart-empty: #eaeaea;
        }

        body.dark-mode {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --sprite-bg: #181818;
            --text-main: #e0e0e0;
            --text-sub: #8a8a8a;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-base: rgba(0, 0, 0, 0.4);
            --shadow-heavy: rgba(0, 0, 0, 0.6);
            --skeleton-bg: linear-gradient(90deg, #1e1e1e 25%, #252525 50%, #1e1e1e 75%);
            --overlay-pattern: rgba(0, 0, 0, 0.3);
            --modal-bg: rgba(18, 18, 18, 0.98);
            --tag-bg: rgba(30, 30, 30, 0.85);
            --tab-locked: #252525;
            --heart-empty: #333333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "Microsoft YaHei", "Noto Sans JP", sans-serif; background: transparent; padding: 3vw; transition: background-color 0.3s; }

        /* 防挤压滚动容器：仅作为不支持 zoom 的浏览器的兜底，正常情况下卡片会等比缩小不再溢出 */
        #render-target { overflow-x: auto; max-width: 100%; padding-bottom: 10px; }

        .adv-container {
            max-width: 950px; margin: 0 auto; border-radius: 16px; overflow: hidden;
            position: relative; background: var(--bg-color);
            box-shadow: 0 10px 30px var(--shadow-heavy), 0 2px 8px var(--shadow-base);
            opacity: 0; transform: translateY(15px) scale(0.98);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, containerBreathe 6s ease-in-out infinite 0.6s;
            display: flex; align-items: stretch; min-height: 450px;
            transition: background-color 0.5s ease, box-shadow 0.5s ease;
            contain: layout style;
        }
        @keyframes popIn { to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes containerBreathe {
            0%, 100% { box-shadow: 0 10px 30px var(--shadow-heavy), 0 0 0 var(--theme-light); }
            50% { box-shadow: 0 15px 40px var(--shadow-heavy), 0 0 20px var(--theme-light); }
        }

        .theme-toggle {
            position: absolute; top: 20px; right: 20px; width: 36px; height: 36px;
            border-radius: 50%; background: var(--panel-bg); border: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 50;
            box-shadow: 0 4px 10px var(--shadow-base); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-size: 16px; color: var(--theme-color);
        }
        .theme-toggle:hover { transform: scale(1.1) rotate(15deg); box-shadow: 0 4px 15px var(--theme-glow); border-color: var(--theme-color); }

        .adv-bg {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 75% 20%, var(--theme-light) 0%, transparent 60%), radial-gradient(circle at 20% 80%, var(--theme-glow) 0%, transparent 50%);
            opacity: 0.6; z-index: 0; pointer-events: none;
            animation: bgShift 15s ease-in-out infinite alternate;
        }
        @keyframes bgShift {
            0% { transform: scale(1) translate(0, 0) translateZ(0); }
            100% { transform: scale(1.1) translate(-2%, 2%) translateZ(0); }
        }

        .adv-char-pattern {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none; opacity: 0.08;
            transition: opacity 0.5s ease, background-image 0.5s ease;
        }
        .adv-container:hover .adv-char-pattern { opacity: 0.12; }
        body.dark-mode .adv-char-pattern { opacity: 0.05; }
        body.dark-mode .adv-container:hover .adv-char-pattern { opacity: 0.08; }

        .adv-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, var(--overlay-pattern) 2px, var(--overlay-pattern) 4px);
            z-index: 2; pointer-events: none; transition: background-image 0.5s ease;
        }

        .adv-particles {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3; pointer-events: none; overflow: hidden;
        }
        .adv-particle {
            position: absolute; border-radius: 50%;
            background: var(--theme-color); box-shadow: 0 0 8px var(--theme-color);
            opacity: 0; animation: floatUp var(--duration) ease-in infinite; animation-delay: var(--delay);
            width: var(--size); height: var(--size); left: var(--left); bottom: -10px;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5) translateZ(0); opacity: 0; }
            20% { opacity: 0.5; }
            80% { opacity: 0.3; }
            100% { transform: translateY(-400px) scale(1.5) translateZ(0); opacity: 0; }
        }

        .cross-star {
            position: absolute; width: 20px; height: 20px; pointer-events: none;
            animation: starTwinkle var(--duration) ease-in-out infinite; animation-delay: var(--delay); z-index: 3;
            left: var(--left); top: var(--top);
        }
        .cross-star::before, .cross-star::after {
            content:''; position: absolute; background: var(--theme-color);
            top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; opacity: 0.8;
        }
        .cross-star::before { width: 100%; height: 1.5px; }
        .cross-star::after { width: 1.5px; height: 100%; }
        @keyframes starTwinkle {
            0%, 100% { transform: scale(0.3) rotate(0deg) translateZ(0); opacity: 0.1; }
            50% { transform: scale(1.3) rotate(45deg) translateZ(0); opacity: 0.8; filter: drop-shadow(0 0 6px var(--theme-glow));}
        }

        .adv-sprite-box {
            width: 42%; aspect-ratio: 832 / 1216; position: relative; cursor: pointer; flex-shrink: 0;
            background: var(--sprite-bg); z-index: 5;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94), background-color 0.5s ease;
            transform-origin: center center; transform-style: preserve-3d;
        }
        .adv-sprite-box::after {
            content: ''; position: absolute; top: -1px; right: -1px; bottom: -1px; left: 0;
            background: linear-gradient(to right, transparent 0%, transparent 60%, var(--bg-color) 100%);
            pointer-events: none; z-index: 10; transition: background 0.5s ease;
        }

        .flip-inner { position: relative; width: 100%; height: 100%; }
        .flip-front, .flip-back {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.3s ease, background 0.5s ease;
            background: var(--skeleton-bg); background-size: 200% 100%;
            animation: skeletonLoading 1.5s infinite linear;
        }
        @keyframes skeletonLoading { to { background-position: -200% 0; } }
        .flip-front { opacity: 1; z-index: 2; pointer-events: auto; }
        .flip-back { opacity: 0; z-index: 1; pointer-events: none; }
        .flip-inner.is-flipped .flip-front { opacity: 0; pointer-events: none; }
        .flip-inner.is-flipped .flip-back { opacity: 1; pointer-events: auto; }

        .adv-sprite-img {
            width: 100%; height: 100%; object-fit: cover; object-position: center; display: block;
            opacity: 0; transform: translateZ(0);
            transition: opacity 0.5s ease, transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .adv-sprite-img.loaded { opacity: 1; }
        .adv-sprite-box:hover .adv-sprite-img.loaded { transform: scale(1.05) translateZ(0); }

        .route-flag {
            position: absolute; top: 25px; left: -6px; background: var(--theme-color); color: #fff; font-weight: 900; font-style: italic;
            font-size: 11px; padding: 5px 16px 5px 12px; border-radius: 0 10px 10px 0; letter-spacing: 1px;
            box-shadow: 2px 2px 10px var(--theme-glow); z-index: 15; display: flex; flex-direction: column;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: default; overflow: hidden;
        }
        .route-flag::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg); animation: flagShimmer 4s infinite 1s; pointer-events: none;
        }
        @keyframes flagShimmer { 0% { left: -100%; } 20%, 100% { left: 200%; } }
        .adv-sprite-box:hover .route-flag { transform: translateX(-120%); opacity: 0; box-shadow: none; }
        .route-flag:hover { padding-left: 20px; box-shadow: 4px 2px 15px var(--theme-glow); }
        .route-flag::before { content: ''; position: absolute; bottom: -6px; left: 0; border-top: 6px solid var(--theme-color); border-left: 6px solid transparent; filter: brightness(0.6); }
        .route-flag-sub { font-size: 7px; opacity: 0.8; font-family: "SF Mono", Consolas, monospace; letter-spacing: 2px; margin-bottom: 1px; }

        .adv-content { position: relative; width: 58%; z-index: 5; padding: 40px 40px 35px 10px; display: flex; flex-direction: column; justify-content: space-between; }
        .adv-top-bar { display: flex; justify-content: flex-end; align-items: flex-start; gap: 14px; margin-right: 40px; }
        .adv-info-col { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

        .adv-time-panel, .adv-loc-panel {
            background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 16px;
            box-shadow: 0 4px 10px var(--shadow-base); display: flex; align-items: center; gap: 10px;
            opacity: 0; transform: translateX(20px); animation: slideInRight 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); cursor: default;
        }
        .adv-time-panel { animation-delay: 0.1s; }
        .adv-loc-panel { animation-delay: 0.2s; border-bottom: 3px solid var(--theme-color); }

        .adv-weather-panel {
            background: var(--tag-bg); backdrop-filter: blur(4px); border: 1px solid var(--border-color);
            border-radius: 6px; padding: 4px 12px; font-size: 11px; font-weight: bold; color: var(--text-sub);
            display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 6px var(--shadow-base);
            opacity: 0; transform: translateX(20px); animation: slideInRight 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation-delay: 0.25s; cursor: default; transition: all 0.3s;
        }
        .adv-weather-panel:hover { color: var(--theme-color); border-color: var(--theme-color); box-shadow: 0 4px 10px var(--theme-glow); }
        .adv-weather-panel svg { opacity: 0.6; transition: opacity 0.3s, transform 0.3s, filter 0.3s; }
        .adv-weather-panel:hover svg { opacity: 1; transform: scale(1.1); filter: drop-shadow(0 0 4px var(--theme-glow)); }

        .adv-time-panel:hover, .adv-loc-panel:hover { transform: translateY(-3px); box-shadow: 0 8px 15px var(--shadow-heavy), 0 0 15px var(--theme-light); border-color: var(--theme-color); }
        .adv-loc-panel:hover svg { filter: drop-shadow(0 0 4px var(--theme-glow)); transform: scale(1.1); transition: transform 0.2s; }
        @keyframes slideInRight { to { opacity: 1; transform: translateX(0); } }

        .adv-cal-icon { background: var(--theme-color); color: #fff; font-size: 13px; font-weight: bold; padding: 3px 8px; border-radius: 4px; display: flex; flex-direction: column; align-items: center; line-height: 1.2; box-shadow: 0 2px 5px var(--theme-glow); transition: transform 0.3s; }
        .adv-time-panel:hover .adv-cal-icon { transform: scale(1.05); }
        .adv-cal-icon span { font-size: 9px; background: rgba(0,0,0,0.2); width: 100%; text-align: center; border-radius: 2px 2px 0 0; padding: 2px 0; }
        .adv-time-text { font-size: 15px; font-weight: 700; color: var(--text-main); transition: color 0.3s; }
        .adv-loc-text { font-size: 15px; font-weight: 700; color: var(--theme-color); transition: color 0.3s; }

        .adv-middle { display: flex; flex-direction: column; align-items: flex-end; margin-top: 20px; margin-bottom: auto; }
        .adv-name-box { display: flex; align-items: baseline; gap: 12px; opacity: 0; transform: translateY(10px); animation: fadeInUp 0.5s ease forwards; animation-delay: 0.3s; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        .adv-name-en { font-family: "SF Mono", Consolas, monospace; font-size: 14px; color: var(--text-sub); letter-spacing: 2px; text-transform: uppercase; transition: color 0.3s; }
        .adv-name-cn {
            font-size: 38px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 2px 10px var(--shadow-base);
            background: linear-gradient(90deg, var(--text-main) 0%, var(--theme-color) 40%, var(--text-sub) 60%, var(--text-main) 100%);
            background-size: 200% auto; color: transparent; -webkit-background-clip: text;
            animation: shineText 5s linear infinite; transition: background 0.3s;
        }
        @keyframes shineText { to { background-position: 200% center; } }

        .char-switch-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; opacity: 0; animation: fadeInUp 0.5s ease forwards; animation-delay: 0.35s; justify-content: flex-end; }
        .char-switch-btn { background: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-sub); padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; transition: all 0.3s; letter-spacing: 1px; box-shadow: 0 2px 5px var(--shadow-base); pointer-events: auto; }
        .char-switch-btn.active { background: var(--theme-color); color: #fff; border-color: var(--theme-color); box-shadow: 0 2px 10px var(--theme-glow); }
        .char-switch-btn:hover:not(.active) { border-color: var(--theme-color); color: var(--theme-color); }

        .adv-status-tag {
            margin-top: 10px; background: var(--panel-bg); border: 1px solid var(--theme-color); color: var(--theme-color);
            padding: 6px 20px; border-radius: 20px; font-size: 14px; font-weight: bold; letter-spacing: 1px;
            display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 8px var(--shadow-base);
            position: relative; overflow: hidden; opacity: 0; animation: fadeInUp 0.5s ease forwards; animation-delay: 0.4s;
            transition: all 0.3s ease; cursor: default;
        }
        .adv-status-tag::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, var(--tag-bg), transparent); transform: skewX(-20deg); animation: shimmer 3s infinite; pointer-events: none; }
        @keyframes shimmer { 0% { left: -100%; } 20%, 100% { left: 200%; } }
        .adv-status-tag:hover { background: var(--theme-color); color: #fff; box-shadow: 0 0 15px var(--theme-glow); transform: scale(1.05); border-color: transparent; }
        .adv-status-tag::before { content: '✧'; font-size: 14px; color: var(--theme-color); animation: twinkle 2s infinite; transition: color 0.3s; }
        @keyframes twinkle { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        .adv-status-tag:hover::before { color: #fff; }

        .adv-bottom { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; opacity: 0; transform: translateY(15px); animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; animation-delay: 0.5s; padding-bottom: 25px; }

        .thought-container {
            margin-bottom: 12px; background: var(--panel-bg); border: 1px dashed var(--theme-color); border-radius: 8px;
            padding: 8px 16px; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative; overflow: hidden; width: fit-content; max-width: 90%;
            box-shadow: inset 0 0 0 transparent, 0 2px 5px var(--shadow-base);
        }
        .thought-container:hover { background: var(--tag-bg); box-shadow: inset 0 0 8px var(--theme-light), 0 4px 10px var(--theme-glow); border-style: solid; }
        .thought-title { font-size: 12px; font-weight: bold; color: var(--theme-color); display: flex; align-items: center; gap: 6px; letter-spacing: 1px; transition: color 0.3s; }
        .thought-title svg { transition: transform 0.3s, opacity 0.3s; }
        .thought-container:hover .thought-title svg { transform: scale(1.1); filter: drop-shadow(0 0 4px var(--theme-glow)); }
        .thought-content { max-height: 0; opacity: 0; transition: all 0.4s ease-in-out; font-size: 13px; color: var(--text-main); margin-top: 0; font-style: italic; line-height: 1.6; }
        .thought-container.open { width: 100%; border-style: solid; background: var(--panel-bg); }
        .thought-container.open .thought-title { color: var(--text-sub); font-size: 11px; margin-bottom: 6px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
        .thought-container.open .thought-content { max-height: 200px; opacity: 1; margin-top: 4px; }

        .love-meter-title { font-size: 12px; font-weight: 900; color: var(--text-sub); letter-spacing: 2px; text-transform: uppercase; padding-left: 4px; transition: color 0.3s; }
        .love-meter-box {
            display: flex; align-items: center; gap: 18px; background: var(--panel-bg); padding: 10px 20px; border-radius: 50px;
            border-left: 6px solid var(--theme-color); box-shadow: 0 4px 15px var(--shadow-base); width: fit-content;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); cursor: default;
            border-top: 1px solid var(--border-color); border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);
        }
        .love-meter-box:hover { border-left-width: 10px; box-shadow: 0 8px 25px var(--shadow-heavy), 0 0 20px var(--theme-light); transform: translateX(-5px); border-color: var(--theme-color); }
        .hearts-container { display: flex; gap: 6px; z-index: 2; }
        .heart-icon { width: 22px; height: 22px; fill: var(--heart-empty); transition: fill 0.5s, transform 0.5s; }
        .heart-icon.filled { fill: var(--theme-color); filter: drop-shadow(0 0 2px var(--theme-glow)); animation: heartbeat 1.5s ease-in-out infinite; }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .love-meter-box:hover .heart-icon.filled { animation-duration: 0.8s; }
        .bond-text { font-size: 15px; font-weight: 900; color: var(--theme-color); margin-left: 20px; letter-spacing: 1px; z-index: 2; transition: transform 0.3s; }
        .love-meter-box:hover .bond-text { transform: scale(1.05); }

        .adv-chibi-box {
            position: absolute; right: 40px; bottom: 60px; width: 85px; height: 85px;
            border-radius: 50%; background: var(--panel-bg); border: 2px dashed var(--theme-color);
            box-shadow: 0 4px 15px var(--shadow-base), inset 0 0 10px var(--theme-light);
            display: flex; align-items: flex-end; justify-content: center;
            z-index: 20; opacity: 0; overflow: hidden;
            animation: popInChibi 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 0.6s, floatChibi 4s ease-in-out infinite 1.4s;
            transition: all 0.3s ease; cursor: pointer;
        }
        .adv-chibi-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 1; }
        .adv-chibi-img.loaded { opacity: 0.95; }
        .adv-chibi-text { position: relative; z-index: 2; font-size: 9px; color: var(--theme-color); font-weight: 900; letter-spacing: 1px; margin-bottom: 6px; background: var(--tag-bg); backdrop-filter: blur(2px); padding: 2px 6px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); opacity: 0.9; transition: all 0.3s ease; }
        @keyframes popInChibi { 0% { opacity: 0; transform: scale(0.5) rotate(-15deg); } 60% { transform: scale(1.1) rotate(5deg); } 100% { opacity: 1; transform: scale(1) rotate(0deg); } }
        @keyframes floatChibi { 0%, 100% { transform: translateY(0) translateZ(0); } 50% { transform: translateY(-8px) translateZ(0); } }
        .adv-chibi-box:hover { animation: swingChibi 0.5s ease-in-out forwards; border-style: solid; border-width: 3px; box-shadow: 0 8px 25px var(--shadow-heavy), 0 0 20px var(--theme-glow); transform: scale(1.05); }
        .adv-chibi-box:hover .adv-chibi-img.loaded { transform: scale(1.15) translateZ(0); opacity: 1; }
        .adv-chibi-box:hover .adv-chibi-text { opacity: 1; transform: translateY(-2px); }
        @keyframes swingChibi { 0% { transform: scale(1.05) rotate(0deg); } 20% { transform: scale(1.05) rotate(10deg); } 40% { transform: scale(1.05) rotate(-8deg); } 60% { transform: scale(1.05) rotate(5deg); } 80% { transform: scale(1.05) rotate(-3deg); } 100% { transform: scale(1.05) rotate(0deg); } }

        .adv-sys-bar {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, var(--theme-color), transparent, var(--theme-color), transparent);
            background-size: 200% 100%; animation: slideBar 3s linear infinite; opacity: 0.8; z-index: 10;
        }
        @keyframes slideBar { to { background-position: 200% 0; } }
        .adv-sys-text { position: absolute; bottom: 8px; right: 20px; font-family: "SF Mono", Consolas, monospace; font-size: 10px; color: var(--text-sub); letter-spacing: 2px; z-index: 10; opacity: 0; animation: fadeIn 1s ease forwards; animation-delay: 0.8s; display: flex; align-items: center; gap: 15px; transition: color 0.3s; }
        @keyframes fadeIn { to { opacity: 1; } }
        .btn-gallery { background: var(--panel-bg); border: 1px solid var(--theme-color); color: var(--theme-color); padding: 5px 14px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: all 0.3s; pointer-events: auto; font-family: "SF Mono", Consolas, monospace; display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px var(--shadow-base); }
        .btn-gallery:hover { background: var(--theme-color); color: #fff; box-shadow: 0 4px 15px var(--theme-glow); transform: translateY(-2px); }

        .gallery-modal, .calendar-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            background: var(--modal-bg);
            z-index: 9999; display: flex; flex-direction: column; align-items: center;

        .gallery-close { position: fixed; top: 30px; right: 40px; width: 40px; height: 40px; background: var(--panel-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--theme-color); box-shadow: 0 4px 15px var(--shadow-base); cursor: pointer; transition: all 0.3s; z-index: 100; font-weight: bold; border: 1px solid var(--border-color); }

        .mode-tab-btn:not(.active):not(.locked-pwd):hover { transform: translateY(-3px); border-color: var(--theme-color); color: var(--theme-color); }
        .mode-tab-btn.locked-pwd { background: var(--tab-locked); border-color: transparent; color: var(--text-sub); cursor: not-allowed; box-shadow: none; }
        .gallery-tab-btn { background: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 18px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.3s; box-shadow: 0 2px 5px var(--shadow-base); }

        .gallery-pagination { display: flex; justify-content: center; gap: 8px; margin-top: 10px; width: 100%; max-width: 1000px; margin-bottom: 20px; flex-wrap: wrap; z-index: 10; position: relative; pointer-events: auto; }
        .page-btn { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-family: monospace; font-weight: bold; color: var(--text-main); transition: all 0.2s; }

        .gallery-grid { width: 100%; max-width: 1000px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; padding-bottom: 60px; pointer-events: auto; }
        .gallery-item { width: 100%; aspect-ratio: 2/3; border-radius: 12px; overflow: hidden; background: var(--skeleton-bg); background-size: 200% 100%; animation: skeletonLoading 1.5s infinite linear; box-shadow: 0 4px 10px var(--shadow-base); position: relative; cursor: zoom-in; transition: transform 0.3s, box-shadow 0.3s; opacity: 0; transform: translateY(20px) translateZ(0); }
        .gallery-item.shown { animation: gridItemPop 0.5s ease forwards; }
        @keyframes gridItemPop { to { opacity: 1; transform: translateY(0) translateZ(0); } }
        .gallery-item:hover { transform: translateY(-5px) translateZ(0); box-shadow: 0 8px 20px var(--theme-glow); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s ease; }
        .gallery-item img.loaded { opacity: 1; }
        .gallery-item .img-label { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(transparent, rgba(0,0,0,0.8)); color: #fff; padding: 15px 10px 8px; font-size: 11px; font-family: monospace; opacity: 0; transition: opacity 0.3s; }
        .gallery-item:hover .img-label { opacity: 1; }

        .preview-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; background: rgba(0,0,0,0.85); z-index: 10000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.3s ease, visibility 0s linear 0.3s; }
        .preview-modal.active { opacity: 1; visibility: visible; pointer-events: auto; cursor: zoom-out; transition: opacity 0.3s ease; }
        .preview-modal img { max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); object-fit: contain; }

            box-shadow: 0 20px 60px var(--shadow-heavy), 0 0 30px var(--theme-light);

        .cal-nav-btn {

        .loading { text-align: center; padding: 60px; color: var(--text-sub); font-size: 16px; width: 100%; display: flex; align-items: center; justify-content: center; }

        /* =========================================================
           移动端专属类 .mobile-view

        .mobile-view .adv-chibi-text { font-size: 6px; padding: 1px 3px; margin-bottom: 2px; backdrop-filter: none; }

        .mobile-view .route-flag::after, .mobile-view .route-flag::before { display: none; }

        /* 移动端模态框专属适配 */
        .mobile-view-modal { padding: 15px 5px !important; backdrop-filter: none !important; }

        .mobile-view-modal .calendar-container { max-width: 95%; border-radius: 10px; }

        @media (prefers-reduced-motion: reduce) {

<body>
    <div id="render-target">
        <!-- 容器会在初始化时由 JS 自动装载 -->
        <div class="adv-container"><div class="loading">SYSTEM LOADING...</div></div>
    </div>

    <!-- 画廊模态框，点击背景也能关闭 -->
    <div class="gallery-modal" id="galleryModal" onclick="if(event.target === this) closeGallery()">
        <div class="gallery-close" onclick="closeGallery()">×</div>
        <div class="gallery-header">
            <div class="gallery-tabs" id="modeTabs"></div>
            <div class="gallery-tabs" id="charTabs"></div>
            <div class="gallery-tabs" id="catTabs" style="margin-top: -5px;"></div>
        </div>
        <div class="gallery-pagination" id="paginationBox"></div>
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <!-- 日历模态框，点击背景也能关闭 -->
    <div class="calendar-modal" id="calendarModal" onclick="if(event.target === this) closeCalendar()">
        <div class="gallery-close" onclick="closeCalendar()">×</div>
        <div class="calendar-container">
            <div class="calendar-header">
                <div class="cal-nav-btn" onclick="calNavMonth(-1)">‹</div>
                <div class="cal-month-title" id="calMonthTitle"><span class="cal-year">2024</span><span>5月</span></div>
                <div class="cal-nav-btn" onclick="calNavMonth(1)">›</div>
            </div>
            <div class="calendar-body">
                <div class="cal-weekdays">
                    <div class="cal-weekday">日</div><div class="cal-weekday">月</div><div class="cal-weekday">火</div>
                    <div class="cal-weekday">水</div><div class="cal-weekday">木</div><div class="cal-weekday">金</div><div class="cal-weekday">土</div>
                </div>
                <div class="cal-days" id="calDays"></div>
                <div class="cal-event-panel" id="calEventPanel">
                    <div class="cal-event-panel-title">Events</div>
                    <div class="cal-event-empty">点击有标记的日期查看事件</div>
                </div>
            </div>
        </div>
    </div>

    <div class="preview-modal" id="previewModal" onclick="closePreview()">
        <img id="previewImg" src="" alt="preview" decoding="async">
    </div>

    <script>
        // 【核心优化】真实设备基因检测：只在真正的手机和平板上识别为移动端，完全抛弃分辨率探测。
        var isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth <= 1024 && ('ontouchstart' in window));

        (function() {
            try {
                var savedTheme = localStorage.getItem('gal_scene_theme');
                if (savedTheme === 'dark') document.body.classList.add('dark-mode');
            } catch (e) {}
        })();

        /* 【窄窗口适配】电脑端聊天栏比卡片窄时，把卡片整体等比缩小，
           避免横向滚动条导致右侧被截断；宽度足够时完全保持原样。 */
        var CARD_COMFORT_WIDTH = 880;
        function fitSceneCardScale() {
            var rt = document.getElementById('render-target');
            var card = document.getElementById('adv-main-container');
            if (!rt || !card) return;
            if (isMobileDevice || !('zoom' in card.style)) { card.style.zoom = ''; return; }
            var available = rt.clientWidth;
            if (available > 0 && available < CARD_COMFORT_WIDTH) {
                card.style.zoom = (available / CARD_COMFORT_WIDTH).toFixed(4);
            } else {
                card.style.zoom = '';
            }
        }
        window.addEventListener('resize', fitSceneCardScale);
        if (window.ResizeObserver) { new ResizeObserver(fitSceneCardScale).observe(document.body); }

        /* SillyTavern wraps chat messages in transformed/zoomed containers, which
           breaks position:fixed. Move the modals to <body> so they anchor to the
           real viewport and don't get clipped/offset when zooming. */
        function mountSceneModals() {
            var host = document.getElementById('sceneCardModalHost');
            if (!host) {
                host = document.createElement('div');
                host.id = 'sceneCardModalHost';
                document.body.appendChild(host);
            }
            ['galleryModal', 'calendarModal', 'previewModal'].forEach(function(id) {
                var el = document.getElementById(id);
                if (el && el.parentNode !== host) {
                    var stale = host.querySelectorAll('#' + id);
                    for (var i = 0; i < stale.length; i++) stale[i].remove();
                    host.appendChild(el);
                    // 为真手机设备挂载缩放样式
                    if (isMobileDevice) {
                        el.classList.add('mobile-view-modal');
                    }
                }
            });
        }
        mountSceneModals();
        document.addEventListener('DOMContentLoaded', mountSceneModals);

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            var isDark = document.body.classList.contains('dark-mode');
            try { localStorage.setItem('gal_scene_theme', isDark ? 'dark' : 'light'); } catch(e) {}
            var themeBtn = document.getElementById('themeBtn');
            if (themeBtn) themeBtn.innerHTML = isDark ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2"/></svg>' : '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>';
        }

        window.handleTilt = function(e, el) {
            if(isMobileDevice) return;
            var rect = el.getBoundingClientRect();
            var x = e.clientX - rect.left;
            var y = e.clientY - rect.top;
            var rx = (y / rect.height - 0.5) * -12;
            var ry = (x / rect.width - 0.5) * 12;
            el.style.transform = 'perspective(1200px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';

        function isBirthdayEvent(text) { return text.includes('生日'); }

        function openCalendar() {
            calCurrentMonth = calParseMonth;
            calCurrentYear = calParseYear;
            document.getElementById('calendarModal').classList.add('active');
            renderCalendar();
        }
        function closeCalendar() { document.getElementById('calendarModal').classList.remove('active'); }

        function calNavMonth(dir) {
            calCurrentMonth += dir;
            if (calCurrentMonth > 12) { calCurrentMonth = 1; calCurrentYear++; }
            if (calCurrentMonth < 1) { calCurrentMonth = 12; calCurrentYear--; }
            renderCalendar();
        }

        function renderCalendar() {
            document.getElementById('calMonthTitle').innerHTML = '<span class="cal-year">' + calCurrentYear + '</span><span>' + calCurrentMonth + '月</span>';
            var firstDay = new Date(calCurrentYear, calCurrentMonth - 1, 1).getDay();
            var daysInMonth = new Date(calCurrentYear, calCurrentMonth, 0).getDate();
            var daysHtml = '';
            for (var e = 0; e < firstDay; e++) { daysHtml += '<div class="cal-day empty"></div>'; }
            for (var d = 1; d <= daysInMonth; d++) {
                var key = calCurrentMonth + '-' + d;
                var events = SCHOOL_EVENTS[key] || [];
                var dayOfWeek = new Date(calCurrentYear, calCurrentMonth - 1, d).getDay();
                var classes = 'cal-day';
                if (dayOfWeek === 0) classes += ' sunday';
                if (dayOfWeek === 6) classes += ' saturday';

                if (d === calParseDay && calCurrentMonth === calParseMonth && calCurrentYear === calParseYear) {
                    classes += ' today';
                }

                if (events.length > 0) classes += ' has-event';

                var dotsHtml = '';
                if (events.length > 0) {
                    dotsHtml = '<div class="cal-dot-row">';
                    var hasBirthday = events.some(function(ev) { return isBirthdayEvent(ev); });
                    var hasEvent = events.some(function(ev) { return !isBirthdayEvent(ev); });
                    if (hasEvent) dotsHtml += '<div class="cal-dot event"></div>';
                    if (hasBirthday) dotsHtml += '<div class="cal-dot birthday"></div>';
                    dotsHtml += '</div>';
                }
                var clickAttr = events.length > 0 ? ' onclick="showCalEvents(' + calCurrentMonth + ',' + d + ')"' : '';
                daysHtml += '<div class="' + classes + '"' + clickAttr + '>' + d + dotsHtml + '</div>';
            }
            document.getElementById('calDays').innerHTML = daysHtml;
            document.getElementById('calEventPanel').innerHTML = '<div class="cal-event-panel-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Events</div><div class="cal-event-empty">点击有标记的日期查看事件</div>';
        }

        function initCalendarFromTime(timeStr) {
            var now = new Date();
            calParseYear = now.getFullYear();
            calParseMonth = 5;
            calParseDay = 10;
            calParseHour = "--:--";

            if (!timeStr) return;

            var mMatch = timeStr.match(/(?:(\d{4})年)?\s*(\d{1,2})月(\d{1,2})日/);
            if (mMatch) {
                if (mMatch[1]) calParseYear = parseInt(mMatch[1]);
                calParseMonth = parseInt(mMatch[2]);
                calParseDay = parseInt(mMatch[3]);
            } else {
                var parts = timeStr.split(' ');
                if (parts[0]) {
                    var slashMatch = parts[0].match(/(\d{1,2})[\/\-](\d{1,2})/);
                    if (slashMatch) {
                        calParseMonth = parseInt(slashMatch[1]);
                        calParseDay = parseInt(slashMatch[2]);
                    }
                }
            }

            var timeMatch = timeStr.match(/(\d{1,2}:\d{2})/);
            if (timeMatch) {
                calParseHour = timeMatch[1];
            }

            calCurrentMonth = calParseMonth;
            calCurrentYear = calParseYear;
            calCurrentDay = calParseDay;
        }

        function showCalEvents(month, day) {
            var key = month + '-' + day;
            var events = SCHOOL_EVENTS[key] || [];
            var panelHtml = '<div class="cal-event-panel-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> ' + month + '月' + day + '日</div>';
            if (events.length === 0) {
                panelHtml += '<div class="cal-event-empty">这天没有特别的事件</div>';
            } else {
                panelHtml += '<div class="cal-event-list">';
                events.forEach(function(ev) {
                    var isBday = isBirthdayEvent(ev);
                    var iconSvg = getEventIconSvg(ev);
                    panelHtml += '<div class="cal-event-item' + (isBday ? ' birthday' : '') + '"><span class="event-icon">' + iconSvg + '</span><span class="event-text">' + ev + '</span></div>';
                });
                panelHtml += '</div>';
            }
            document.getElementById('calEventPanel').innerHTML = panelHtml;
        }

        function renderGalleryGrid() {
            var grid = document.getElementById('galleryGrid');
            var pageBox = document.getElementById('paginationBox');
            grid.innerHTML = '<div style="color:var(--text-sub);width:100%;text-align:center;grid-column:1/-1;padding:40px;">LOADING...</div>';
            pageBox.innerHTML = '';
            var catInfo = GALLERY_STRUCTURE[currentMode].find(function(c) { return c.id === currentGalleryCat; });
            var suffix = catInfo.suffix; var count = catInfo.count; var charId = currentGalleryChar;
            if (charId === 'chen' && currentGalleryCat === 'nsfw') count = 30;   // 澄的基础 NSFW 总数也改为 30
            if (charId === 'chun' && currentGalleryCat === 'huai_yun') count = 2;

            var startIndex = 1; var endIndex = count;
            if (currentMode === 'SFW' && count > SFW_PAGE_SIZE) {
                var totalPages = Math.ceil(count / SFW_PAGE_SIZE);
                startIndex = (sfwCurrentPage - 1) * SFW_PAGE_SIZE + 1;
                endIndex = Math.min(sfwCurrentPage * SFW_PAGE_SIZE, count);
                var pageHtml = '';
                for (var p = 1; p <= totalPages; p++) { pageHtml += '<div class="page-btn ' + (p === sfwCurrentPage ? 'active' : '') + '" onclick="setSfwPage(' + p + ')">PAGE ' + p + '</div>'; }
                pageBox.innerHTML = pageHtml;
            }
            var html = ''; var animDelay = 0;
            for (var i = startIndex; i <= endIndex; i++) {
                var imgCharId = charId;
                if (charId === 'chen' && suffix && BUCHONG_SUFFIXES.indexOf(suffix) !== -1) { imgCharId = 'cheng'; }
                var imgName = suffix ? imgCharId + suffix + '_' + i + '.png' : imgCharId + '_' + i + '.png';

                animDelay += 0.05;
            }
            grid.innerHTML = html;
        }
