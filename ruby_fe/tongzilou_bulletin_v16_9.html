<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>筒子楼情况简报 · 2008 MSN Special V16.9</title>
    <style>
        :root {
            --win-gray: #c0c0c0;
            --win-blue: #000080;
            --win-light: #ffffff;
            --win-shadow: #808080;
            --glass-bg: rgba(235, 245, 255, 0.94);
            --text-main: #0f172a;
            --paper-font-size: 17px;
            --paper-line-height: 38px;
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #fbcfe8 45%, #e9d5ff 75%, #bae6fd 100%);
            --theme-glow: 0 25px 60px rgba(100, 120, 180, 0.35);
            --bg-pattern: radial-gradient(rgba(255, 255, 255, 0.7) 1px, transparent 0);
            --bg-pattern-size: 24px 24px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: "Tahoma", "Microsoft YaHei", "SimSun", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 6px;
            position: relative;
            overflow-x: hidden;
            color: var(--text-main);
            transition: background 0.5s ease, color 0.5s ease;
            background: var(--bg-gradient);
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: 
                var(--bg-pattern),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.02) 2px, rgba(0,0,0,0.02) 4px);
            background-size: var(--bg-pattern-size), 100% 4px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.6;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.2);
            pointer-events: none;
            z-index: 2;
        }

        body[data-theme="default"] {
            --win-blue: #000080;
            --glass-bg: rgba(235, 245, 255, 0.94);
            --text-main: #0f172a;
            --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #fbcfe8 45%, #e9d5ff 75%, #bae6fd 100%);
            --theme-glow: 0 25px 60px rgba(100, 120, 180, 0.35);
            --bg-pattern: radial-gradient(rgba(255, 255, 255, 0.7) 1px, transparent 0);
        }
        body[data-theme="y2k"] {
            --win-blue: #be185d;
            --glass-bg: rgba(254, 242, 248, 0.95);
            --text-main: #831843;
            --bg-gradient: linear-gradient(135deg, #fbcfe8 0%, #f472b6 40%, #c084fc 80%, #f472b6 100%);
            --theme-glow: 0 25px 60px rgba(236, 72, 153, 0.45);
            --bg-pattern: radial-gradient(rgba(255, 255, 255, 0.8) 1.5px, transparent 0);
        }
        body[data-theme="amber"] {
            --win-blue: #78350f;
            --glass-bg: rgba(254, 243, 199, 0.96);
            --text-main: #451a03;
            --bg-gradient: radial-gradient(circle at 50% 50%, #fef3c7 0%, #fde68a 50%, #d97706 100%);
            --theme-glow: 0 25px 60px rgba(217, 119, 6, 0.35);
            --bg-pattern: repeating-linear-gradient(0deg, rgba(180, 120, 60, 0.08) 0px, rgba(180, 120, 60, 0.08) 1px, transparent 1px, transparent 12px);
        }
        body[data-theme="cyber"] {
            --win-blue: #065f46;
            --glass-bg: rgba(4, 47, 36, 0.96);
            --text-main: #a7f3d0;
            --bg-gradient: linear-gradient(135deg, #022c22 0%, #064e3b 50%, #022c22 100%);
            --theme-glow: 0 25px 60px rgba(16, 185, 129, 0.5);
            --bg-pattern: linear-gradient(rgba(16, 185, 129, 0.15) 1px, transparent 1px);
            --bg-pattern-size: 100% 4px;
        }

        body[data-fontsize="small"] {
            --paper-font-size: 15px;
            --paper-line-height: 32px;
        }
        body[data-fontsize="medium"] {
            --paper-font-size: 17px;
            --paper-line-height: 38px;
        }
        body[data-fontsize="large"] {
            --paper-font-size: 20px;
            --paper-line-height: 44px;
        }

        body.crt-mode .bulletin-container::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.85;
        }
        body.crt-mode .bulletin-container {
            box-shadow: var(--theme-glow), 0 0 25px rgba(255, 255, 255, 0.3);
            animation: crtFlicker 0.15s infinite alternate;
        }
        @keyframes crtFlicker {
            0% { opacity: 0.98; }
            100% { opacity: 1; }
        }

        body.dark-mode[data-theme="default"] {
            --win-blue: #1e1b4b;
            --glass-bg: rgba(15, 23, 42, 0.95);
            --text-main: #f1f5f9;
            --bg-gradient: linear-gradient(135deg, #030712 0%, #0f172a 50%, #1e1b4b 100%);
            --theme-glow: 0 25px 60px rgba(99, 102, 241, 0.3);
        }
        body.dark-mode[data-theme="y2k"] {
            --win-blue: #831843;
            --glass-bg: rgba(30, 10, 25, 0.95);
            --text-main: #fbcfe8;
            --bg-gradient: linear-gradient(135deg, #1f0412 0%, #4c0519 50%, #2e1065 100%);
            --theme-glow: 0 25px 60px rgba(244, 114, 182, 0.35);
        }
        body.dark-mode[data-theme="amber"] {
            --win-blue: #78350f;
            --glass-bg: rgba(28, 19, 8, 0.95);
            --text-main: #fef3c7;
            --bg-gradient: linear-gradient(135deg, #180e04 0%, #451a03 50%, #291203 100%);
            --theme-glow: 0 25px 60px rgba(245, 158, 11, 0.3);
        }
        body.dark-mode[data-theme="cyber"] {
            --win-blue: #022c22;
            --glass-bg: rgba(2, 44, 34, 0.96);
            --text-main: #6ee7b7;
            --bg-gradient: linear-gradient(135deg, #000000 0%, #022c22 50%, #064e3b 100%);
            --theme-glow: 0 25px 60px rgba(52, 211, 153, 0.5);
        }

        body.dark-mode .bulletin-container { 
            border-color: rgba(255, 255, 255, 0.18); 
            box-shadow: 0 0 60px rgba(50, 100, 255, 0.08);
        }
        body.dark-mode .notebook-paper {
            background: #1e293b;
            color: #f8fafc;
            border-color: #334155;
        }
        body.dark-mode .notebook-body {
            color: #f8fafc;
            background-image: linear-gradient(to bottom, transparent 94%, #334155 94%);
        }
        body.dark-mode .status-sticky-note {
            background: #422006;
            border-color: #713f12;
            color: #fef08a;
        }
        body.dark-mode .rumor-card { background: #4c0519; border-color: #f43f5e; }
        body.dark-mode .rumor-content { color: #fecdd3; }
        body.dark-mode .photo-card {
            background: #1e293b;
            border-color: #334155;
        }
        body.dark-mode .photo-frame { background: #1e293b; }
        body.dark-mode .photo-caption-bar { background: #334155; color: #fff; }
        body.dark-mode .item-modal-box { background: #1e293b; border-color: #334155; }
        body.dark-mode .item-modal-body { background: #1e293b; color: #f8fafc; }
        body.dark-mode .item-modal-header { background: #1e1b4b; }
        body.dark-mode .map-modal-content { background: #1e293b; border-color: #334155; }
        body.dark-mode .map-modal-header { background: #1e1b4b; color: #fff; }
        body.dark-mode .map-modal-body { background: #1a1a2e; }
        body.dark-mode .map-modal-body .map-item { background: #16213e; border-color: #2a3a5e; }
        body.dark-mode .map-modal-body .map-item .map-label { color: #c8d0e0; background: #1a2744; border-top-color: #2a3a5e; }
        body.dark-mode .map-fullscreen-overlay .fs-label { background: rgba(0,0,0,0.8); color: #f0f0f0; }
        body.dark-mode .map-fullscreen-overlay .fs-close { color: #fff; }

        @keyframes msnNudge {
            0% { transform: translate(0, 0) rotate(0deg); }
            15% { transform: translate(-8px, -6px) rotate(-1deg); }
            30% { transform: translate(8px, 6px) rotate(1deg); }
            45% { transform: translate(-6px, 4px) rotate(-0.5deg); }
            60% { transform: translate(6px, -4px) rotate(0.5deg); }
            75% { transform: translate(-3px, 2px) rotate(0deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .nudge-active { animation: msnNudge 0.45s ease-in-out; }

        .photo-overlay-mask {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .photo-overlay-mask.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .photo-placeholder {
            display: none;
            width: 100%;
        }

        .wink-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .wink-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .wink-box {
            background: #fff;
            border: 4px solid #ec4899;
            border-radius: 16px;
            padding: 20px 30px;
            box-shadow: 0 20px 50px rgba(236, 72, 153, 0.5);
            text-align: center;
            transform: scale(0.5);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .wink-overlay.active .wink-box { transform: scale(1.1); }
        .wink-emoji { font-size: 64px; animation: winkBounce 0.6s infinite alternate; }
        @keyframes winkBounce { 0% { transform: scale(1); } 100% { transform: scale(1.2) rotate(10deg); } }

        .bulletin-container {
            width: 100%;
            max-width: 1120px;
            background: var(--glass-bg);
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: var(--theme-glow);
            padding: 14px;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: box-shadow 0.5s ease, background 0.5s ease;
        }
        .bulletin-header {
            background: var(--win-blue);
            color: #ffffff;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            transition: background 0.4s ease;
            position: relative;
        }
        .bulletin-header-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        
        .mobile-toggle-btn {
            display: none;
            background: var(--win-gray);
            border-top: 1px solid var(--win-light);
            border-left: 1px solid var(--win-light);
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
            font-size: 12px;
            color: #000;
            padding: 2px 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .news-ticker-bar {
            background: #0b1a2d;
            border: 1px inset #808080;
            color: #38bdf8;
            font-family: "SimSun", monospace;
            font-size: 13px;
            padding: 4px 10px;
            overflow: hidden;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .news-ticker-tag {
            background: #c41e3a;
            color: #fff;
            font-size: 11px;
            padding: 2px 10px;
            letter-spacing: 2px;
            font-weight: bold;
            flex-shrink: 0;
            box-shadow: inset 0 -2px 0 #8b0000;
        }
        .news-ticker-text {
            display: inline-block;
            white-space: nowrap;
            animation: tickerScroll 28s linear infinite;
            padding-left: 100%;
        }
        @keyframes tickerScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        .win-mode-btn {
            background: var(--win-gray);
            border-top: 1px solid var(--win-light);
            border-left: 1px solid var(--win-light);
            border-right: 1px solid #000000;
            border-bottom: 1px solid #000000;
            font-size: 12px;
            color: #000;
            padding: 3px 7px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            user-select: none;
            touch-action: manipulation;
            transition: 0.15s;
        }
        .win-mode-btn:hover {
            background: #d0d0d0;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.5);
        }
        .win-mode-btn:active {
            border-top: 1px solid #000000;
            border-left: 1px solid #000000;
            border-right: 1px solid var(--win-light);
            border-bottom: 1px solid var(--win-light);
        }
        .bulletin-body { display: flex; gap: 14px; align-items: stretch; }
        .left-column { flex: 0 0 340px; display: flex; flex-direction: column; gap: 10px; }

        .photo-card {
            background: #fcf9f5;
            padding: 12px 12px 30px 12px;
            border: 2px solid var(--win-light);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15), 0 2px 8px rgba(0,0,0,0.06);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            width: 100%;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 20;
        }
        .photo-card::before {
            content: "";
            position: absolute;
            top: -10px; left: 50%;
            transform: translateX(-50%) rotate(-1deg);
            width: 100px; height: 24px;
            background: rgba(253, 224, 71, 0.85);
            border: 1px dashed rgba(202, 138, 4, 0.6);
            z-index: 25;
        }
        .photo-frame {
            width: 100%; height: 340px;
            background: #faf8f5;
            overflow: hidden;
            position: relative;
            border: 1px solid #90b0d0;
            border-radius: 2px;
        }
        .photo-corner-tl, .photo-corner-tr, .photo-corner-bl, .photo-corner-br {
            position: absolute; width: 18px; height: 18px; z-index: 15; pointer-events: none;
        }
        .photo-corner-tl { top:0; left:0; border-top: 6px solid #1e293b; border-left: 6px solid #1e293b; }
        .photo-corner-tr { top:0; right:0; border-top: 6px solid #1e293b; border-right: 6px solid #1e293b; }
        .photo-corner-bl { bottom:0; left:0; border-bottom: 6px solid #1e293b; border-left: 6px solid #1e293b; }
        .photo-corner-br { bottom:0; right:0; border-bottom: 6px solid #1e293b; border-right: 6px solid #1e293b; }
        .photo-sticker-tag {
            position: absolute; top: 8px; right: 8px;
            background: linear-gradient(135deg, #f43f5e, #ec4899);
            color: #fff; font-size: 10px; font-weight: bold;
            padding: 2px 7px; border-radius: 10px;
            transform: rotate(6deg); z-index: 14; border: 1px solid #fff;
        }
        
        .photo-close-btn {
            display: none;
            position: absolute;
            top: 6px;
            right: 8px;
            background: #dc2626;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border: 1px solid #fff;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        
        .photo-card.peeled {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            width: min(92vw, 420px) !important;
            max-height: 88vh !important;
            transform: translate(-50%, -50%) scale(1) !important;
            z-index: 999 !important;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.85) !important;
            display: flex;
            flex-direction: column;
            padding: 16px 16px 36px 16px;
            background: #fcf9f5;
            border: 3px solid #ffffff;
            animation: photoPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes photoPop {
            0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .photo-card.peeled .photo-close-btn { display: block; }
        .photo-card.peeled .photo-frame {
            height: auto !important;
            max-height: calc(88vh - 150px) !important;
            width: 100% !important;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .photo-card.peeled .photo-frame img {
            width: 100% !important;
            height: auto !important;
            max-height: calc(88vh - 170px) !important;
            object-fit: contain !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .photo-card.peeled .photo-nav {
            display: flex !important;
        }
        .photo-card.peeled .photo-birthday {
            display: block !important;
        }
        .photo-nav {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 6px;
            font-size: 13px;
            color: #555;
        }
        .photo-nav button {
            background: var(--win-gray);
            border-top: 1px solid var(--win-light);
            border-left: 1px solid var(--win-light);
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
            padding: 2px 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #000;
            transition: 0.1s;
        }
        .photo-nav button:active {
            border-top: 1px solid #000;
            border-left: 1px solid #000;
            border-right: 1px solid var(--win-light);
            border-bottom: 1px solid var(--win-light);
        }
        .photo-nav span {
            min-width: 40px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
        .photo-birthday {
            display: none;
            text-align: center;
            font-size: 13px;
            color: #831843;
            font-weight: bold;
            margin-top: 4px;
            padding: 2px 0;
            background: rgba(252, 231, 243, 0.6);
            border-radius: 3px;
        }
        body.dark-mode .photo-birthday {
            color: #fbcfe8;
            background: rgba(131, 24, 67, 0.3);
        }
        
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .photo-caption-bar {
            margin-top: 8px;
            background: var(--win-gray);
            border: 1px inset #808080;
            text-align: center; padding: 6px;
            font-size: 13px; font-weight: bold; color: #000;
        }

        .rumor-card {
            background: #fff1f2;
            border: 2px dashed #f43f5e;
            padding: 10px 12px;
            position: relative;
            box-shadow: 0 4px 10px rgba(225, 29, 72, 0.1);
        }
        .rumor-card::before {
            content: "🗣️ 筒子楼情报站";
            position: absolute;
            top: -12px; left: 12px;
            background: #be123c; color: #fff;
            font-size: 11px; font-weight: bold;
            padding: 1px 8px; border-radius: 3px;
        }
        .rumor-content {
            margin-top: 6px;
            font-size: 13px;
            line-height: 1.6;
            color: #9f1239;
            font-family: "SimSun", serif;
        }

        /* 地图按钮 - 替换原MSN状态栏 */
        .map-btn-card {
            background: #e8f5e9;
            border: 2px solid #43a047;
            padding: 10px 12px;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease, background 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: bold;
            font-size: 15px;
            color: #1b5e20;
        }
        .map-btn-card:hover {
            background: #c8e6c9;
            transform: scale(1.02);
        }
        .map-btn-card:active {
            transform: scale(0.96);
        }
        body.dark-mode .map-btn-card {
            background: #1e3a2f;
            border-color: #4caf50;
            color: #a5d6a7;
        }
        body.dark-mode .map-btn-card:hover {
            background: #2e4f3f;
        }

        /* 地图模态框 */
        .map-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 10002;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .map-modal-overlay.active {
            display: flex;
        }
        .map-modal-content {
            background: #fff;
            border: 3px solid var(--win-light);
            max-width: 820px;
            width: 100%;
            max-height: 92vh;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            animation: mapModalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes mapModalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .map-modal-header {
            background: var(--win-blue);
            color: #fff;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 15px;
            flex-shrink: 0;
        }
        .map-modal-header .map-close-btn {
            background: var(--win-gray);
            border: 1px solid #000;
            color: #000;

        function playRetroBeep(freq = 600, type = 'sine', duration = 0.04) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function parseData(text) {
            const result = { time: '', location: '', text: '', roles: [], statusText: '', rumors: '' };
            const rMatch = text.match(/<rumor_block>([\s\S]*?)<\/rumor_block>/);
            if (rMatch && rMatch[1]) result.rumors = rMatch[1].trim();
            const vMatch = text.match(/<vintage_post>([\s\S]*?)<\/vintage_post>/);
            if (vMatch && vMatch[1]) {
                const c = vMatch[1];
                const tm = c.match(/时间[：:]\s*([^\n]+)/);
                if (tm) result.time = tm[1].trim();
                const lm = c.match(/地点[：:]\s*([^\n]+)/);
                if (lm) result.location = lm[1].trim();
                const txm = c.match(/文本[：:]\s*([\s\S]*?)(?=\n\s*\n|$)/);
                result.text = txm ? txm[1].trim() : c.replace(/时间[：:].*/g, '').replace(/地点[：:].*/g, '').trim();
                const roleSection = c.match(/角色[：:]\s*([\s\S]*?)(?=\n\s*文本[：:]|\n\s*\n|$)/);
                if (roleSection && roleSection[1]) {
                    roleSection[1].split('\n').forEach(line => {
                        const cleaned = line.replace(/^[\s\-\*]+/, '').trim();
                        if (cleaned.includes('|')) {
                            const parts = cleaned.split('|');
                            result.roles.push({ name: parts[0].trim(), outfit: parts[1].trim() });
                        }
                    });
                }
            }
            if (result.roles.length === 0) result.roles.push({ name: '洪晓花', outfit: '日常' });
            const sMatch = text.match(/<Status_block>([\s\S]*?)<\/Status_block>/);
            if (sMatch && sMatch[1]) result.statusText = sMatch[1].replace(/<\/?details>/g, '').trim();
            return result;
        }

        function getFixedIndex(dateStr, charName, outfit) {
            const dateMatch = dateStr.match(/(\d{4})年(\d{2})月(\d{2})日/);
            let baseSeed = 0;
            if (dateMatch) {
                const y = parseInt(dateMatch[1]);
                const m = parseInt(dateMatch[2]);
                const d = parseInt(dateMatch[3]);
                baseSeed = y * 10000 + m * 100 + d;
            } else {
                let hash = 0;
                for (let i = 0; i < dateStr.length; i++) {
                    hash = (hash << 5) - hash + dateStr.charCodeAt(i);
                    hash |= 0;
                }
                baseSeed = Math.abs(hash);
            }
            const extra = charName + outfit;
            let extraHash = 0;
            for (let i = 0; i < extra.length; i++) {
                extraHash = (extraHash << 5) - extraHash + extra.charCodeAt(i);
                extraHash |= 0;
            }
            const combined = baseSeed + extraHash;
            return Math.abs(combined) % 5;
        }

        function getWeatherByDate(dateStr) {
            const match = dateStr.match(/(\d{4})年(\d{2})月(\d{2})日/);
            if (!match) return '🌤️ 北京 · 晴转多云 18°C~26°C';
            const m = parseInt(match[2]);
            const d = parseInt(match[3]);
            const seed = d % 3;
            const temps = [
                ['晴转多云', '18°C~26°C'],
                ['多云转阴', '15°C~22°C'],
                ['小雨', '12°C~18°C'],
            ];
            const weather = temps[seed];
            return `🌤️ 北京 · ${weather[0]} ${weather[1]}`;
        }

        function getEventByDate(dateStr) {
            const match = dateStr.match(/(\d{4})年(\d{2})月(\d{2})日/);
            if (!match) return '筒子楼小卖部北冰洋买二送一';
            const m = parseInt(match[2]);
            const events = {
                3: '周杰伦《青花瓷》蝉联冠军',
                4: '周杰伦《青花瓷》蝉联冠军',
                5: '举国同心 · 抗震救灾',
                6: '奥运倒计时 · 备战冲刺',
                7: '奥运倒计时 · 最后冲刺',
                8: '北京奥运 · 举国欢庆',
            };
            return events[m] || '筒子楼小卖部北冰洋买二送一';
        }

        function getTemperature(dateStr) {
            const match = dateStr.match(/(\d{4})年(\d{2})月(\d{2})日/);
            if (!match) return { outdoor: 22, indoor: 26 };
            const m = parseInt(match[2]);
            const base = m >= 6 && m <= 8 ? 28 : m >= 3 && m <= 5 ? 18 : 10;
            const outdoor = base + Math.floor(Math.random() * 6) - 3;
            const indoor = outdoor + 4 + Math.floor(Math.random() * 3);
            return { outdoor, indoor };
        }

        function checkBirthday(dateStr) {
            const match = dateStr.match(/(\d{4})年(\d{2})月(\d{2})日/);
            if (!match) return null;
            const mmdd = match[2] + '月' + match[3] + '日';
            for (const [name, bday] of Object.entries(birthdays)) {
                if (bday === mmdd) return name;
            }
            return null;
        }

                currentPhotoIndex = idx;
                imgElement.src = urls[idx];
                captionBar.textContent = `姓名：${current.name} ｜ 装扮：${current.outfit}`;
                if (navSpan) navSpan.textContent = `${idx + 1} / ${urls.length}`;
                
                if (bdaySpan && birthdays[current.name]) {
                    bdaySpan.textContent = '🎂 生日：' + birthdays[current.name];
                } else if (bdaySpan) {
                    bdaySpan.textContent = '';
                }
                
                updateBirthdayBanner(displayTime, current.name);
            }
            updateRole();

            setTimeout(() => {
                updateBirthdayBanner(displayTime, roles[0]?.name);
            }, 100);

            document.querySelectorAll('.char-tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.char-tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    activeIndex = parseInt(this.dataset.index);
                    updateRole(this.dataset.name);
                });
            });

            let charIndex = 0;
            const target = document.getElementById('typewriterTarget');
            function typeWriter() {
                if (charIndex < fullText.length) {
                    target.innerHTML = fullText.substring(0, charIndex + 1) + '<span class="typewriter-cursor"></span>';
                    charIndex++;
                    setTimeout(typeWriter, 16);
                } else {
                    target.innerHTML = fullText;
                }
            }
            typeWriter();

            roles.forEach(r => {
                if (!memoryUnlocked.has(r.name)) {
                    memoryUnlocked.add(r.name);
                }
            });
            updateMemoryProgress();
        }

        function init() {
            try {
                const raw = getMessageData();
                if (!raw) throw new Error('未捕获到对应档案数据。');
                render(parseData(raw), raw);
            } catch(e) {
                document.getElementById('workspaceContent').innerHTML = `<div style="text-align:center; padding:40px; color:#004080;">档案加载异常：${e.message}</div>`;
            }
        }
        if (typeof $ !== 'undefined') $(init); else document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
