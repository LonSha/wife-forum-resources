<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --bg: #0b0a0f;
            --text: #f3f0ff;
            --muted: #9ea0b5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: transparent;
            color: var(--text);
            padding: 12px 8px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            max-width: 300px;
            margin: 0 auto 8px;
            padding: 0;
        }

        .item img {
            width: 100%;
            max-width: 300px;
            border-radius: 6px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
            object-fit: cover;
        }

        .item .placeholder {
            width: 100%;
            max-width: 300px;
            min-height: 360px;
            border-radius: 6px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--muted);
            font-size: 56px;
            font-weight: 700;
        }

        .label {
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 0.04em;
        }
    </style>
</head>

        const sceneText = `$1`;

        const canonicalNames = Object.keys(characters);

        function normalizeName(value) {
            return (value || '').replace(/\s+/g, '').trim();
        }

        function getUniqueCharacters(value) {
            return Array.from(new Set(normalizeName(value).split('').filter(Boolean)));
        }

        function getCharacterCoverage(rawName, candidateName) {
            const targetChars = getUniqueCharacters(rawName);
            const candidateChars = getUniqueCharacters(candidateName);
            if (targetChars.length === 0 || candidateChars.length === 0) {
                return { matchedCount: 0, requiredCount: 0, coverage: 0 };
            }

            const targetSet = new Set(targetChars);
            const matchedCount = candidateChars.filter(char => targetSet.has(char)).length;
            const requiredCount = candidateChars.length >= 3 ? 2 : candidateChars.length;

            return {
                matchedCount,
                requiredCount,
                coverage: matchedCount / candidateChars.length
            };
        }

        function levenshteinDistance(a, b) {
            const s = normalizeName(a);
            const t = normalizeName(b);
            const m = s.length;
            const n = t.length;
            if (m === 0) return n;
            if (n === 0) return m;

            const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
            for (let i = 0; i <= m; i++) dp[i][0] = i;
            for (let j = 0; j <= n; j++) dp[0][j] = j;

            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    const cost = s[i - 1] === t[j - 1] ? 0 : 1;
                    dp[i][j] = Math.min(
                        dp[i - 1][j] + 1,
                        dp[i][j - 1] + 1,
                        dp[i - 1][j - 1] + cost
                    );
                }
            }

            return dp[m][n];
        }

        function resolveName(rawName) {
            const target = normalizeName(rawName);
            if (!target) return null;

            if (canonicalNames.includes(target)) {
                return target;
            }

            let coverageBestNames = [];
            let coverageBestScore = -1;
            let coverageBestMatchedCount = -1;

            for (const candidate of canonicalNames) {
                const { matchedCount, requiredCount, coverage } = getCharacterCoverage(target, candidate);
                if (matchedCount < requiredCount) {
                    continue;
                }

                if (
                    coverage > coverageBestScore ||
                    (coverage === coverageBestScore && matchedCount > coverageBestMatchedCount)
                ) {
                    coverageBestNames = [candidate];
                    coverageBestScore = coverage;
                    coverageBestMatchedCount = matchedCount;
                } else if (coverage === coverageBestScore && matchedCount === coverageBestMatchedCount) {
                    coverageBestNames.push(candidate);
                }
            }

            if (coverageBestNames.length === 1) {
                return coverageBestNames[0];
            }

            let bestNames = [];
            let bestDistance = Infinity;

            for (const candidate of canonicalNames) {
                const dist = levenshteinDistance(target, candidate);
                if (dist < bestDistance) {
                    bestDistance = dist;
                    bestNames = [candidate];
                } else if (dist === bestDistance) {
                    bestNames.push(candidate);
                }
            }

            if (bestNames.length === 1) {
                const limit = Math.max(1, Math.ceil(Math.min(target.length, bestNames[0].length) * 0.4));
                return bestDistance <= limit ? bestNames[0] : null;
            }
            
            return null;
        }

        function parseLines() {
            const blocks = [];
            const re = /<environment_details>([\s\S]*?)<\/environment_details>/gm;
            let m;
            while ((m = re.exec(sceneText)) !== null) {
                blocks.push(m[1]);
            }
            if (blocks.length === 0) blocks.push(sceneText);

            const lines = [];
            for (const b of blocks) {
                const match = b.match(/在场角色[：:]\s*([\s\S]*?)(?=\n\n|$)/);
                if (!match) continue;
                const segLines = match[1]
                    .split('\n')
                    .map(l => l.trim())
                    .filter(l => l.startsWith('-'))
                    .map(l => l.replace(/^\-\s*/, ''));
                lines.push(...segLines);
            }
            return lines;
        }

        function buildItems(lines) {
            const items = [];
            for (const line of lines) {
                const parts = line.split('|').map(s => s.trim());
                if (parts.length < 2) continue;
                const name = resolveName(parts[0]);
                const action = parts[1];
                if (!name || !characters[name] || !variants[action]) continue;
                items.push({ code: characters[name], label: action, key: variants[action] });
            }
            return items;
        }

        function render(items) {
            const list = document.getElementById('list');
            list.innerHTML = items.map(item => {
                const base = baseUrlMap[item.code];
                let src = base !== 'WAITING_FOR_IMAGE_HOST' ? `${base}/${item.code}_${item.key}.png` : '';
                if (overrideUrls[`${item.code}_${item.key}`]) {
                    src = overrideUrls[`${item.code}_${item.key}`];
                }
                return `
                    <div class="item">
                        ${src
                        ? `<img src="${src}" alt="${item.label}" loading="lazy">`
                        : `<div class="placeholder">${fallbackAvatars[item.code] || '?'}</div>`}
                        <div class="label">${item.label}</div>
                    </div>
                `;
            }).join('');
        }

        render(buildItems(parseLines()));
    </script>
</body>

</html>
