<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>海鸣町夏日画报 · 正文美化</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: transparent;
            padding: 8px;
            min-height: auto;
            position: relative;
            overflow-x: hidden;
            color: #2b2b3a;
        }

        .story-container {
            max-width: 1024px;
            margin: 0 auto;
            padding: 60px 24px 60px;
            background-color: #fffdf6;
            background-image:
                linear-gradient(rgba(2, 132, 199, 0.07) 1.5px, transparent 1.5px),
                linear-gradient(90deg, rgba(2, 132, 199, 0.07) 1.5px, transparent 1.5px);
            background-size: 26px 26px;
            border-radius: 18px;
            border: 3px solid #2b2b3a;
            box-shadow: 6px 6px 0 #2b2b3a;
            position: relative;
            z-index: 1;
        }

        .story-container::before {
            content: 'UMINARI-CHO ★ 盛夏限定连载';
            position: absolute;
            top: 16px;
            left: 20px;
            font-size: 11px;
            font-weight: 900;
            color: #fff;
            background: #2b2b3a;
            border-radius: 20px;
            padding: 4px 14px;
            letter-spacing: 3px;
            transform: rotate(-2deg);
        }

        .story-container::after {
            content: '连载更新中 · ONGOING';
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 10px;
            font-weight: 900;
            color: #2b2b3a;
            letter-spacing: 2px;
            background: #ffd66e;
            padding: 4px 12px;
            border-radius: 20px;
            border: 2px solid #2b2b3a;
            box-shadow: 2px 2px 0 #2b2b3a;
        }

        .corner-tl, .corner-tr, .corner-bl, .corner-br {
            position: absolute;
            width: 24px;
            height: 24px;
            pointer-events: none;
            z-index: 5;
        }
        .corner-tl { top: -2px; left: -2px; border-top: 4px solid #2b2b3a; border-left: 4px solid #2b2b3a; border-top-left-radius: 18px; }
        .corner-tr { top: -2px; right: -2px; border-top: 4px solid #2b2b3a; border-right: 4px solid #2b2b3a; border-top-right-radius: 18px; }
        .corner-bl { bottom: -2px; left: -2px; border-bottom: 4px solid #2b2b3a; border-left: 4px solid #2b2b3a; border-bottom-left-radius: 18px; }
        .corner-br { bottom: -2px; right: -2px; border-bottom: 4px solid #2b2b3a; border-right: 4px solid #2b2b3a; border-bottom-right-radius: 18px; }

        .wave-bg-container {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            border-radius: 15px;
            z-index: 0;
            pointer-events: none;
            opacity: 0.5;
        }
        .wave-bg {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: auto;
            opacity: 0.5;
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
        }

        .narrative {
            line-height: 2.1;
            font-size: 16.5px;
            margin-bottom: 28px;
            text-align: justify;
            color: #2b2b3a;
            letter-spacing: 1px;
            padding: 30px 26px 24px;
            background: #fff;
            border-radius: 4px 14px 14px 14px;
            position: relative;
            border: 2.5px solid #2b2b3a;
            border-left-width: 8px;
            border-left-color: #0284c7;
            box-shadow: 4px 4px 0 rgba(43, 43, 58, 0.25);
            animation: slide-in-left 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards;
            opacity: 0;
        }

        .narrative::before {
            content: '';
            position: absolute;
            top: -2.5px; left: -2.5px;
            width: 14px; height: 14px;
            background: #ffd66e;
            border: 2.5px solid #2b2b3a;
            border-radius: 50%;
            z-index: 3;
        }

        .narrative::after {
            content: '[ SCENE LOG ]';
            position: absolute;
            top: 8px; right: 12px;
            font-size: 10px;
            font-weight: 900;
            color: #fff;
            background: #2b2b3a;
            border-radius: 10px;
            padding: 2px 10px;
            letter-spacing: 2px;
        }

        .narrative .uni-tag { margin-bottom: 10px; }
        .narrative p {
            margin-top: 14px;
            text-indent: 2em;
        }
        .narrative p:first-of-type {
            margin-top: 0;
            text-indent: 0;
        }
        .narrative p:first-of-type::first-letter {
            font-size: 1.5em;
            font-weight: 900;
            color: #fff;
            background: #0284c7;
            border: 2px solid #2b2b3a;
            border-radius: 8px;
            margin-right: 6px;
            padding: 0 8px;
            float: left;
            line-height: 1.4;
            margin-top: 2px;
            box-shadow: 2px 2px 0 #2b2b3a;
        }

        @keyframes slide-in-left {
            0% { opacity: 0; transform: translateX(-30px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .dialogue-box {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            margin: 40px 0;
            gap: 8px;
            opacity: 0;
            transform: translateY(30px);
        }

        /* 统一名牌：角色/旁白标签 */
        .uni-tag {
            align-self: flex-start;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            background: #2b2b3a;
            border: 2px solid #2b2b3a;
            border-radius: 12px;
            padding: 2px 12px;
            box-shadow: 2px 2px 0 rgba(43, 43, 58, 0.3);
        }
        .uni-mio { background: #0284c7; border-color: #0284c7; }
        .uni-tsuru { background: #ea580c; border-color: #ea580c; }
        .uni-npc { background: #fff; color: #2b2b3a; }
        .uni-nar { background: #ffd66e; color: #2b2b3a; }
        .dialogue-box:has(.uni-mio) .bubble { border-left-color: #0284c7; box-shadow: 4px 4px 0 #bae6fd; }
        .dialogue-box:has(.uni-tsuru) .bubble { border-radius: 22px; box-shadow: 4px 4px 0 #fdba74; }

        .animate-pop {
            animation: pop-in 0.6s cubic-bezier(0.2, 0.9, 0.2, 1.1) forwards;
        }

        @keyframes pop-in {
            0% { opacity: 0; transform: translateY(30px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .avatar-section {
            position: relative;
            flex-shrink: 0;
            width: 90px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .avatar-section::after {
            content: '';
            position: absolute;
            bottom: -8px;
            width: 60px;
            height: 10px;
            background: #2b2b3a;
            border-radius: 50%;
            opacity: 0.18;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .avatar-section:hover::after {
            transform: translateY(3px) scale(1.15);
            opacity: 0.25;
        }

        .avatar-ring-outer {
            position: absolute;
            width: 97px;
            height: 97px;
            border: 2.5px dashed rgba(2, 132, 199, 0.55);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .avatar-ring-middle {
            position: absolute;
            width: 88px;
            height: 88px;
            border-top: 3px solid rgba(2, 132, 199, 0.7);
            border-bottom: 3px solid rgba(2, 132, 199, 0.7);
            border-left: 3px solid transparent;
            border-right: 3px solid transparent;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .avatar-ring-inner {
            position: absolute;
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: #bae6fd;
            border: 2px solid #2b2b3a;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .avatar-section:hover .avatar-ring-outer { opacity: 1; animation: spin-slow 12s linear infinite; }
        .avatar-section:hover .avatar-ring-middle { opacity: 1; animation: spin-reverse 8s linear infinite; }
        .avatar-section:hover .avatar-ring-inner { opacity: 0.6; animation: halo-pulse 1.5s infinite alternate ease-in-out; }

        @keyframes spin-slow { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        @keyframes halo-pulse { 0% { transform: scale(0.96); opacity: 0.4; } 100% { transform: scale(1.06); opacity: 0.7; } }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 54%;
            background-color: #f0f9ff;
            border: 3px solid #2b2b3a;
            box-shadow: 3px 3px 0 #2b2b3a;
            position: relative;
            z-index: 2;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            image-rendering: high-quality;
            image-rendering: -webkit-optimize-contrast;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .avatar.loading-img {
            animation: pulse-bg 1.2s infinite alternate;
            filter: grayscale(60%);
        }

        .avatar-section:hover .avatar {
            transform: scale(1.06) rotate(-2deg);
            box-shadow: 5px 5px 0 #2b2b3a;
        }

        .dialogue-content {
            display: flex;
            flex-direction: column;
            max-width: calc(100% - 114px);
            position: relative;
            min-width: 0;
        }

        .npc-box { gap: 0; margin: 36px 0; }
        .npc-content { max-width: 95%; }

        .name-plate-wrapper {
            position: relative;
            margin-bottom: 10px;
            padding-bottom: 4px;
        }

        .name-plate-wrapper::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            height: 3px;
            background: repeating-linear-gradient(90deg, #2b2b3a 0, #2b2b3a 8px, transparent 8px, transparent 14px);
            opacity: 0.35;
        }

        .name-plate {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-left: 12px;
            position: relative;
            flex-wrap: wrap;
        }

        .name-plate::before {
            content: '';
            position: absolute;
            left: 0; top: 10%; height: 80%; width: 6px;
            background: #0284c7;
            border: 2px solid #2b2b3a;
            border-radius: 4px;
        }

        .char-info {
            font-size: 20px;
            font-weight: 900;
            color: #0369a1;
            letter-spacing: 3px;
            text-shadow: 2px 2px 0 #bae6fd;
        }

        .npc-plate-wrapper::after { opacity: 0.2; }
        .npc-plate::before { background: #8a93a7; }
        .npc-char-info { font-size: 14px; font-weight: 900; color: #2b2b3a; letter-spacing: 2px; }

        .badge-group {
            display: flex;
            align-items: center;
            background: #fff;
            border: 2.5px solid #2b2b3a;
            border-radius: 20px;
            padding: 2px 4px;
            box-shadow: 2px 2px 0 #2b2b3a;
        }

        .npc-badge {
            background: #fff;
            border: 2px solid #2b2b3a;
            border-radius: 8px;
            padding: 1px 6px;
            font-size: 10px;
            font-weight: 900;
            color: #2b2b3a;
            letter-spacing: 1px;
        }

        .char-sub {
            font-size: 10px;
            font-weight: 900;
            color: #fff;
            background: #0284c7;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 2px 8px;
            border-radius: 8px;
            font-family: inherit;
        }

        .emotion-tag {
            font-size: 11px;
            font-weight: 900;
            padding: 2px 8px;
            color: #0369a1;
            letter-spacing: 1px;
        }

        /* ================= 气泡：纸片硬描边 ================= */
        .bubble {
            background: #fff;
            padding: 22px 28px;
            border-radius: 6px 20px 20px 20px;
            font-size: 17px;
            line-height: 2;
            color: #2b2b3a;
            position: relative;
            box-shadow: 4px 4px 0 rgba(43, 43, 58, 0.3);
            border: 2.5px solid #2b2b3a;
            z-index: 1;
            overflow: hidden;
        }

        /* 气泡尾巴 */
        .bubble::after {
            content: '';
            position: absolute;
            top: 22px;
            left: -11px;
            width: 16px;
            height: 16px;
            background: #fff;
            border-left: 2.5px solid #2b2b3a;
            border-bottom: 2.5px solid #2b2b3a;
            transform: rotate(45deg) skew(8deg, 8deg);
            z-index: 3;
        }

        /* 确保正文永远在最上层 */
        .bubble-text {
            position: relative;
            z-index: 2;
        }

        /* ---------------- 三大随机内部装饰类 ---------------- */

        /* 通用底纹层 */
        .bubble-deco {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 变体 1：水印双引号 (文学感) */
        .deco-var-1 .bubble-deco::after {
            content: '"';
            position: absolute;
            right: 12px;
            bottom: -38px;
            font-size: 130px;
            font-family: Georgia, serif;
            color: rgba(2, 132, 199, 0.10);
            font-weight: 900;
            line-height: 1;
        }

        /* 变体 2：精密切割点阵 (视觉小说感) */
        .deco-var-2 .bubble-deco {
            background-image: radial-gradient(rgba(2, 132, 199, 0.16) 1.2px, transparent 1.2px);
            background-size: 9px 9px;
            mask-image: linear-gradient(90deg, transparent 55%, black 100%);
            -webkit-mask-image: linear-gradient(90deg, transparent 55%, black 100%);
        }

        /* 变体 3：基准尺标与十字星 (科技设定感) */
        .deco-var-3 .bubble-deco::before {
            content: '+ + +';
            position: absolute;
            top: 14px; right: 20px;
            font-size: 12px;
            font-weight: 900;
            color: rgba(2, 132, 199, 0.35);
            letter-spacing: 8px;
        }
        .deco-var-3 .bubble-deco::after {
            content: '';
            position: absolute;
            bottom: 18px; left: 24px;
            width: 44px; height: 4px;
            background: repeating-linear-gradient(90deg, rgba(2, 132, 199, 0.35) 0, rgba(2, 132, 199, 0.35) 6px, transparent 6px, transparent 12px);
        }

        /* --- NPC 的次级气泡 --- */
        .npc-bubble {
            background: #f4f6fa;
            border-radius: 10px 18px 18px 18px;
            border: 2.5px dashed rgba(43, 43, 58, 0.55);
            box-shadow: none;
            color: #3d4657;
            font-size: 16px;
            padding: 16px 22px;
            overflow: hidden;
        }
        .npc-bubble::before, .npc-bubble::after { display: none; }

        /* NPC 的装饰统一染成低调灰蓝 */
        .npc-box .deco-var-1 .bubble-deco::after { color: rgba(43, 43, 58, 0.10); }
        .npc-box .deco-var-2 .bubble-deco { background-image: radial-gradient(rgba(43, 43, 58, 0.18) 1.2px, transparent 1.2px); }
        .npc-box .deco-var-3 .bubble-deco::before { color: rgba(43, 43, 58, 0.35); }
        .npc-box .deco-var-3 .bubble-deco::after { background: repeating-linear-gradient(90deg, rgba(43, 43, 58, 0.3) 0, rgba(43, 43, 58, 0.3) 6px, transparent 6px, transparent 12px); }


        /* ================= 角色专属：姐姐鹤（暖阳圆润） ================= */
        .name-plate-wrapper.tsuru::after { opacity: 0.3; }
        .name-plate.tsuru::before { background: #ea580c; }
        .name-plate.tsuru .char-info { color: #c2410c; text-shadow: 2px 2px 0 #fde047; }
        .badge-group.tsuru { box-shadow: 2px 2px 0 #ea580c; }
        .badge-group.tsuru .char-sub { background: #ea580c; }
        .badge-group.tsuru .emotion-tag { color: #c2410c; }

        .bubble.tsuru {
            border-radius: 22px 26px 26px 26px;
            box-shadow: 4px 4px 0 #fdba74;
        }
        .bubble.tsuru::after { filter: none; }

        /* 鹤的变体装饰色修改 */
        .tsuru .deco-var-1 .bubble-deco::after { color: rgba(234, 88, 12, 0.10); }
        .tsuru .deco-var-2 .bubble-deco { background-image: radial-gradient(rgba(234, 88, 12, 0.18) 1.2px, transparent 1.2px); }
        .tsuru .deco-var-3 .bubble-deco::before { color: rgba(234, 88, 12, 0.35); }
        .tsuru .deco-var-3 .bubble-deco::after { background: repeating-linear-gradient(90deg, rgba(234, 88, 12, 0.3) 0, rgba(234, 88, 12, 0.3) 6px, transparent 6px, transparent 12px); }


        .avatar-section.tsuru::after { opacity: 0.25; }
        .avatar-section.tsuru .avatar-ring-outer { border-color: rgba(234, 88, 12, 0.55); }
        .avatar-section.tsuru .avatar-ring-middle { border-top-color: rgba(234, 88, 12, 0.7); border-bottom-color: rgba(234, 88, 12, 0.7); }
        .avatar-section.tsuru .avatar-ring-inner { background: #fde047; }

        .avatar-section.tsuru .avatar {
            border-color: #2b2b3a;
            box-shadow: 3px 3px 0 #ea580c;
        }
        .avatar-section.tsuru:hover .avatar {
            box-shadow: 5px 5px 0 #ea580c;
        }

        /* ================= 角色专属：妹妹澪（凛系方格） ================= */
        .name-plate.mio .char-info { color: #0369a1; text-shadow: 2px 2px 0 #bae6fd; }
        .bubble.mio {
            border-radius: 6px;
            border-left-width: 8px;
            border-left-color: #0284c7;
            box-shadow: 4px 4px 0 #bae6fd;
        }
        .avatar-section.mio .avatar { border-radius: 18px; }
        /* 澪的蓝色系已继承全局默认值 */


        /* ================= 统一正文大框：全文只用一个框 ================= */
        .unified-body {
            background: #fff;
            border: 2.5px solid #2b2b3a;
            border-left: 8px solid #0284c7;
            border-radius: 6px 20px 20px 20px;
            box-shadow: 4px 4px 0 rgba(43, 43, 58, 0.3);
            padding: 42px 28px 28px;
            position: relative;
            overflow: hidden;
            animation: pop-in 0.6s cubic-bezier(0.2, 0.9, 0.2, 1.1) forwards;
            opacity: 0;
        }
        .unified-body::after {
            content: '[ STORY LOG ]';
            position: absolute;
            top: 10px; right: 14px;
            font-size: 10px;
            font-weight: 900;
            color: #fff;
            background: #2b2b3a;
            border-radius: 10px;
            padding: 2px 10px;
            letter-spacing: 2px;
        }
        .unified-body > * + * { margin-top: 14px; }
        .u-nar {
            line-height: 2.1;
            font-size: 16.5px;
            text-align: justify;
            color: #2b2b3a;
            letter-spacing: 1px;
            text-indent: 2em;
            margin: 0;
        }
        .unified-body > .u-nar.first { text-indent: 0; }
        .unified-body > .u-nar.first::first-letter {
            font-size: 1.5em;
            font-weight: 900;
            color: #fff;
            background: #0284c7;
            border: 2px solid #2b2b3a;
            border-radius: 8px;
            margin-right: 6px;
            padding: 0 8px;
            float: left;
            line-height: 1.4;
            margin-top: 2px;
            box-shadow: 2px 2px 0 #2b2b3a;
        }
        .u-line {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            border-top: 2px dashed rgba(43, 43, 58, 0.18);
            padding-top: 14px;
        }
        .unified-body > :first-child { border-top: none; padding-top: 0; }
        .u-rail {
            flex: none;
            width: 93px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .u-rail .avatar-section { width: 78px; height: 78px; }
        .u-rail .avatar { width: 78px; height: 78px; border-radius: 16px; }
        .u-rail .avatar-ring-outer { width: 64px; height: 64px; }
        .u-rail .avatar-ring-middle { width: 58px; height: 58px; }
        .u-rail .avatar-ring-inner { width: 55px; height: 55px; }
        .u-emo {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            background: #2b2b3a;
            border: 2px solid #2b2b3a;
            border-radius: 10px;
            padding: 1px 8px;
            box-shadow: 2px 2px 0 rgba(43, 43, 58, 0.3);
            white-space: nowrap;
            max-width: 62px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .u-emo.emo-mio { background: #0284c7; border-color: #0284c7; }
        .u-emo.emo-tsuru { background: #ea580c; border-color: #ea580c; }
        .u-content { flex: 1; min-width: 0; }
        .u-content .uni-tag { margin-bottom: 8px; }
        .u-content .u-emo{margin-left:8px;max-width:none;vertical-align:1px;}
        .u-text {
            font-size: 17px;
            line-height: 2;
            color: #2b2b3a;
        }
        .u-line.npc { display: block; }
        .u-line.npc .uni-tag { margin-bottom: 8px; }
        @media screen and (max-width: 480px) {
            .unified-body { padding: 38px 16px 20px; }
            .u-rail { width: 78px; }
            .u-rail .avatar-section { width: 66px; height: 66px; }
            .u-rail .avatar { width: 66px; height: 66px; border-radius: 18px; }
            .u-rail .avatar-ring-outer,
            .u-rail .avatar-ring-middle,
            .u-rail .avatar-ring-inner { display: none; }
            .u-text { font-size: 15.5px; }
        }

        var canvasCache = {};
        function processImageSmoothly(originalUrl, targetImgElement) {
            if (canvasCache[originalUrl]) {
                targetImgElement.src = canvasCache[originalUrl];
                targetImgElement.classList.remove('loading-img');
                return;
            }

            var img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = function() {
                try {
                    var canvas = document.createElement("canvas");
                    var targetSize = 180;
                    canvas.width = targetSize;
                    canvas.height = targetSize;
                    var ctx = canvas.getContext("2d");

                    var sWidth = img.width;
                    var sHeight = img.height;
                    var side = Math.min(sWidth, sHeight) * 0.70;
                    var fx = sWidth * 0.5;
                    var fy = sHeight * 0.41;
                    var sx = Math.max(0, Math.min(sWidth - side, fx - side / 2));
                    var sy = Math.max(0, Math.min(sHeight - side, fy - side / 2));

                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = "high";
                    ctx.drawImage(img, sx, sy, side, side, 0, 0, targetSize, targetSize);

                    var highQualityDataUrl = canvas.toDataURL("image/webp", 1.0);
                    canvasCache[originalUrl] = highQualityDataUrl;
                    targetImgElement.src = highQualityDataUrl;
                    targetImgElement.classList.remove('loading-img');
                } catch(e) {
                    console.error("重采样失败", e);
                    targetImgElement.src = originalUrl;
                    targetImgElement.classList.remove('loading-img');
                }
            };
            img.onerror = function() {
                targetImgElement.classList.remove('loading-img');
            };
            img.src = originalUrl;
        }

        function getDecoVar(text) {
            var hash = 0;
            for (var i = 0; i < text.length; i++) {
                hash = ((hash << 5) - hash) + text.charCodeAt(i);
                hash = hash & hash;
            }
            /* 返回 1, 2, 或 3 */
            return Math.abs(hash) % 3 + 1;
        }

                            if (/夜|晚|凌晨|星空/.test(nightHay) || /(^|\D)(2[0-3]|0\d|0?[0-5])[:时]/.test(nightHay)) {
                                if (tCntFn(scenePick.name, '看星星')) best = { act: '看星星', score: 1, hits: 0 };
                            }
                        }
                        if (best) pick = { scene: scenePick.name, act: best.act, fb: scenePick.fallback };
                    }
                }
                if (pick) {
                    var tAct = pick.act;
                    var total = tCntFn(pick.scene, tAct);
                    if (!total) { tAct = pick.fb; total = tCntFn(pick.scene, tAct); }
                    if (total) {
                        var tsc = ((pick.scene === '商店') && (ch === '鹤')) ? '大熊商店' : ((pick.scene === '离岸提') ? '离岸堤' : pick.scene);
                        f = (tAct === pick.scene) ? (ch + '_' + tsc + '_' + (1 + Math.floor(Math.random() * total)) + '.png') : (ch + '_' + tsc + '_' + tAct + '_' + (1 + Math.floor(Math.random() * total)) + '.png');
                        url = ZW_TU_BASE + encodeURIComponent(f);
                    }
                }
                if (!url) {
                    /* 情绪插图兜底：角色_室内外_情绪（cha-ru 图床，每组10张） */
                    var emoN = zwNormEmo(focus.emo, focus.span, ch);
                    var chaEmo = ZW_CHA_EMO[emoN] || '平淡';
                    var indoor = /室|房|屋|宅|家|厅|厨|浴|汤|店|馆|玄关|廊|厕|仓|所/.test(loc);
                    var place = indoor ? '房间' : '室外';
                    var idx2 = 1 + Math.floor(Math.random() * 10);
                    f = ch + '_' + place + '_' + chaEmo + '_' + idx2 + '.png';
                    url = ZW_CHA_BASE + encodeURIComponent(f);
                }
            }
return '<div class="zw-illu"><img class="zw-illu-img" loading="lazy" src="' + url + '" alt="" decoding="async" onerror="try{this.closest(\'.zw-illu\').style.display=\'none\'}catch(e){}"><div class="zw-illu-cap">' + (function(){ var _s=f.replace(/\.png$/, '').split('_').slice(1,-1).join(' · '); return _s ? (lw.who + ' · ' + _s) : lw.who; })() + '</div></div>';
        }

                function renderPage(text, fullText, mid) {
            text = text.replace(/<(think|thinking)>[\s\S]*?<\/\1>/gi, '');

            var paragraphs = text.split(/\n\s*\n|\n/);
            var blocks = [];
            var avatarsToProcess = [];
            var lineCount = 0;
            var firstBlock = true; var prevDlg = false;

            var dialogueRegex = /^\[(.*?)\|(.*?)\]\s*(.*)$/;

            paragraphs.forEach(function(p) {
                var trimmed = p.trim();
                if (!trimmed) return;
                if (trimmed.startsWith('<think>') || trimmed.startsWith('</think>')) return;

                var match = trimmed.match(dialogueRegex);
                if (match) {
                    var charName = match[1].trim();
                    var emotion = match[2].trim();
                    var content = match[3].trim();

                    var isTsuru = charName.indexOf('鹤') !== -1;
                    var isMio = charName.indexOf('澪') !== -1;
                    var avCls = isTsuru ? 'tsuru' : (isMio ? 'mio' : '');
                    var tagClass = isTsuru ? 'uni-tsuru' : (isMio ? 'uni-mio' : 'uni-npc');
                    var chKey = isTsuru ? '鹤' : (isMio ? '澪' : '');
                    var normEmo = zwNormEmo(emotion, content, chKey);

                    /* 说话与旁边动作/旁白分开，各自成块 */
                    var segs = zwSplitSpeech(content);
                    var bodyHtml = '';
                    segs.forEach(function(sg) {
                        bodyHtml += (sg.t === 'say') ? '<div class="u-say">' + sg.s + '</div>' : '<div class="u-act">' + sg.s + '</div>';
                    });

                                                            var isMind = /心声|心音|独白/.test(charName + emotion);
                    if (isMind) {
                        /* 心声：小标签＋居中正文，不进气泡 */
                        var mindName = charName.replace(/[·•].*$/, '');
                        var mindLine = '<div class="u-mind">' + mindName + ' · 心声 ···</div>';
                        mindLine += '<p class="u-nar">' + zwQHighlight(content) + '</p>';
                        blocks.push(mindLine);
                        prevDlg = false;
                    } else if (avCls) {
                        /* 澪/鹤：头像＋彩色名，竖线分隔说话，整块套角标 */
                        var avId = 'zw-av-' + lineCount;
                        var line = '<div class="u-dlg ' + avCls + '">';
                        line += '<div class="u-dtop"><div class="avatar-section sm ' + avCls + '"><img id="' + avId + '" class="avatar loading-img" decoding="async" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="' + charName + '" onerror="try{this.closest(\'.avatar-section\').style.display=\'none\'}catch(e){}">';
                        line += '</div><div class="u-dbody"><div class="u-dname">' + charName + '<span class="u-demo">' + normEmo + '</span></div>';
                        segs.forEach(function(sg) {
                            line += (sg.t === 'say') ? '<div class="u-dsay">' + sg.s + '</div>' : '<div class="u-dact">' + sg.s + '</div>';
                        });
                        line += '</div></div>';
                        line += '';
                        line += '</div>';
                        blocks.push(line);
                        avatarsToProcess.push({ id: avId, url: getRawUrl(charName, normEmo) });
                        prevDlg = true;
                    } else {
                        /* 你/NPC：素文本，无气泡无头像 */
                        var plainLine = '<div class="u-line plain">';
                        plainLine += '<span class="u-who">' + charName + '</span><div class="u-pt">' + content + '</div>';
                        plainLine += '</div>';
                        blocks.push(plainLine);
                        prevDlg = false;
                    }
                    lineCount++;


                    firstBlock = false;
                } else {
                    blocks.push('<p class="u-nar' + (firstBlock ? ' first' : '') + '">' + zwQHighlight(trimmed) + '</p>');
                    firstBlock = false; prevDlg = false;
                }
            });

            /* 自动配图插进正文中间；取不到图时只显示纯文本大框 */
            try {
                var illu = zwPick(text, fullText || '', (typeof mid === 'number') ? mid : 0);
                if (illu && blocks.length > 0) {
                    var at = Math.ceil(blocks.length / 2);
                    blocks.splice(at, 0, illu);
                }
            } catch (e) { console.error('配图失败', e); }

            /* 全文只用一个大框，不再按段落拆成多个气泡 */
            var html = '<div class="unified-body">' + blocks.join('') + '</div>';
            document.querySelector('.content-wrapper').innerHTML = html;

            setTimeout(function() {
                avatarsToProcess.forEach(function(item) {
                    var imgEl = document.getElementById(item.id);
                    if (imgEl) {
                        processImageSmoothly(item.url, imgEl);
                    }
                });
            }, 50);
        }

function init() {
            try {
                var messageText = getMessageData();
/* 满血API纯文字降级：API/模型名含“满血”时只留纯文字（fail-open：异常则正常渲染） */
function uwIsFullBlood(msgObj){
  try{
    var budget={n:0};
    function scan(v,depth){
      if(v==null||depth>4||budget.n>300)return false;
      if(typeof v==='string'){budget.n++;return v.indexOf('满血')!==-1;}
      if(typeof v!=='object')return false;
      if(Object.prototype.toString.call(v)==='[object Array]'){for(var i=0;i<v.length&&i<12;i++){try{if(scan(v[i],depth+1))return true;}catch(e){}}return false;}
      var skip={message:1,raw:1,mes:1,chat:1,messages:1,characters:1,character:1,lorebook:1,lorebooks:1,worldbook:1,prompt:1,prompts:1,data:1,html:1,innerHTML:1};
      for(var k in v){
        if(!Object.prototype.hasOwnProperty.call(v,k))continue;
        if(skip[k])continue;
        var val=null;
        try{val=v[k];}catch(e){continue;}
        try{if(scan(val,depth+1))return true;}catch(e){}
      }
      return false;
    }
    try{if(msgObj&&scan(msgObj,0))return true;}catch(e){}
    var ctx=null;
    try{if(window.SillyTavern&&window.SillyTavern.getContext)ctx=window.SillyTavern.getContext();}catch(e){ctx=null;}
    if(!ctx){try{if(window.parent&&window.parent.SillyTavern&&window.parent.SillyTavern.getContext)ctx=window.parent.SillyTavern.getContext();}catch(e){ctx=null;}}
    try{if(ctx&&scan(ctx,0))return true;}catch(e){}
  }catch(e){}
  return false;
}
function uwCurMsg(){
  try{if(typeof getChatMessages==='function'&&typeof getCurrentMessageId==='function'){var m=getChatMessages(getCurrentMessageId());if(m&&m.length)return m[0];}}catch(e){}
  return null;
}
                try{if(uwIsFullBlood(uwCurMsg())){var _w0=document.querySelector('.content-wrapper');if(_w0){_w0.textContent=extractContent(messageText);}return;}}catch(e){}
                if (!messageText) {
                    document.querySelector('.content-wrapper').innerHTML = '<div class="loading">❌ SYSTEM ERROR: DATA NOT FOUND</div>';
                    return;
                }
                var text = extractContent(messageText);
                var mid = 0;
                try { mid = getCurrentMessageId(); } catch (e) {}
                renderPage(text, messageText, mid);
            } catch (error) {
                console.error("错误:", error);
                document.querySelector('.content-wrapper').innerHTML = '<div class="loading">❌ RENDER ERROR：' + error.message + '</div>';
            }
        }

        $(function() { init(); });
    </script>
