            function getMessageData() { if (typeof getChatMessages === 'undefined') return null; var cm = getChatMessages(getCurrentMessageId()); return (!cm || cm.length === 0) ? null : cm[0].message; }

            function parseData(content) {
                var result = { location: "未知领域", time: "停滞的时间", type: "SFW", characters: [] };
                var lines = content.trim().replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
                var parsingChars = false;
                for (var i = 0; i < lines.length; i++) {
                    var text = lines[i].trim();
                    if (!text) continue;
                    text = text.replace(/&lt;/g, '<').replace(/&gt;/g, '>');
                    if (text.indexOf('地点：') === 0 || text.indexOf('地点:') === 0) result.location = text.substring(3).trim();
                    else if (text.indexOf('时间：') === 0 || text.indexOf('时间:') === 0) result.time = text.substring(3).trim();
                    else if (text.indexOf('场景类型：') === 0 || text.indexOf('场景类型:') === 0) result.type = text.substring(5).trim();
                    else if (text.indexOf('在场角色：') === 0 || text.indexOf('在场角色:') === 0) parsingChars = true;
                    else if (parsingChars && (text.indexOf('-') === 0 || text.indexOf('- ') === 0)) {
                        var parts = text.replace(/^-\s*/, '').trim().split('|');
                        if (parts.length > 0 && parts[0].trim() !== '' && allowedChars.indexOf(parts[0].trim()) !== -1) {
                            result.characters.push({ name: parts[0].trim(), outfit: parts[1] ? parts[1].trim() : "未知" });
                        }
                    }
                }
                return result;
            }

            function getProperImage(charName, outfit, isNsfw) { var info = charConfig[charName]; if (!info) return ""; var dKey = isNsfw ? "NSFW_DEFAULT" : "SFW_DEFAULT"; if (outfit && info.imgUrls[outfit] && info.imgUrls[outfit] !== "") return info.imgUrls[outfit]; if (info.imgUrls[dKey] && info.imgUrls[dKey] !== "") return info.imgUrls[dKey]; return info.imgUrls["SFW_DEFAULT"] || ""; }
            function getThemeClass(charName) { return charConfig[charName] ? charConfig[charName].themeClass : "theme-default"; }

            function renderPage(data, targetRenderEl) {
                if (!targetRenderEl) return;
                var isNsfw = (data.type || '').toUpperCase() === 'NSFW'; var ratingClass = isNsfw ? 'rating nsfw' : 'rating sfw';
                var uniqueWeddings = {}; for(var j=0; j<data.characters.length; j++) { if (data.characters[j].outfit === "婚纱") uniqueWeddings[data.characters[j].name] = true; }
                var isTrioWedding = (Object.keys(uniqueWeddings).length >= 3);
                var wrapperClass = isNsfw ? ' is-nsfw' : ''; var portraitHtml = '', symbolHtml = '';

                var charsHtml = '';

                    for (var i = 0; i < data.characters.length; i++) {
                        var char = data.characters[i]; charsHtml += '<div class="char-pill ' + getThemeClass(char.name) + '" data-charname="' + char.name + '" data-outfit="' + char.outfit + '"><div class="char-avatar"></div><span class="char-name">' + char.name + '</span><span class="char-outfit">' + char.outfit + '</span></div>';
                    }
                } else charsHtml = '<span class="chars-label">当前无人</span>';

                var timeFormatted = (data.time || '').trim().replace(/\s+/g, '<span class="t-sep"></span>');

                targetRenderEl.innerHTML = html;
                bindHoverEvents(isNsfw, isTrioWedding, targetRenderEl); setTimeout(function(){ bindExpandLogic(targetRenderEl); }, 100);

            /* 【终极智能轮询版核心逻辑】 */
            function init() {
                var container = document.querySelector('.st-scene-wrapper:not([data-claimed])');

                    if (retryCount > 25) {
                        container.innerHTML = '<div style="text-align: center; padding: 20px; color: #ff7597; font-size: 12px;">时空碎片获取超时...</div>';
                        return;

                    var msgText = getMessageData();
                    if (msgText) {
                        var cleanText = msgText.replace(/&lt;/g, '<').replace(/&gt;/g, '>');
                        var regex = /<SceneInfo>([\s\S]*?)<\/SceneInfo>/ig;
                        var matches = [];
                        var match;
                        while ((match = regex.exec(cleanText)) !== null) {
                            matches.push(match[1]);
                        }

                        if (matches.length > 0) {
                            /* 清空容器，为每个 match 创建子容器并渲染 */
                            container.innerHTML = '';
                            for (var mi = 0; mi < matches.length; mi++) {
                                var d = parseData(matches[mi]);
                                var subWrapper = document.createElement('div');
                                subWrapper.style.marginBottom = mi < matches.length - 1 ? '8px' : '0';
                                container.appendChild(subWrapper);
                                renderPage(d, subWrapper);
                            }
                            return;
                        }
                    }

                    setTimeout(function() { tryFetchData(retryCount + 1); }, 600);
                }

                tryFetchData(0);
            }

            setTimeout(init, 0);
        })();
