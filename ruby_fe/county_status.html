<!doctype html>
<html lang="zh-CN">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

      --c-yellow: hsl(42, 72%, 38%);

    :root[data-sb-theme="dark"] .sb-frame {

    .sb-body { padding: var(--gap-md); display: flex; flex-direction: column; gap: var(--gap-md); }

    .sb-evt { padding: 6px var(--gap-md); background: var(--c-evt-bg); border-left: 3px solid var(--c-evt-label); border-radius: 0 4px 4px 0; font-family: var(--font-body); color: var(--c-text); font-weight: 500; display: flex; align-items: flex-start; transition: background 0.3s; }
    .sb-evt-label { font-family: var(--font-label); font-size: calc(13px * var(--sb-text-scale)); font-weight: 700; color: var(--c-evt-label); letter-spacing: 0.5px; margin-right: 6px; flex-shrink: 0; padding-top: 1px; }

    .sb-card { background: var(--c-card-default); border: 1px solid var(--c-border); border-radius: 8px; padding: var(--gap-md); animation: fadeIn 0.3s ease; transition: background 0.3s, border-color 0.3s; }

    /* ========== 布局样式 ========== */

    .sb-grade { font-family: var(--font-body); font-size: calc(12px * var(--sb-text-scale)); padding: 1px 7px; border-radius: 4px; border: 1px solid; font-weight: 500; }

    .sb-victim .sb-grade { color: var(--c-navy-light); background: hsla(225,24%,48%,.06); border-color: hsla(225,20%,52%,.15); }
    .sb-bully .sb-grade { color: var(--c-blood); background: hsla(355,32%,48%,.05); border-color: hsla(355,32%,48%,.2); }

    .sb-tear-dot { margin-left: auto; color: var(--c-tear); font-size: calc(13px * var(--sb-text-scale)); animation: tp 2s infinite; }
    .sb-prey { margin-left: auto; font-family: var(--font-body); font-size: calc(11px * var(--sb-text-scale)); color: var(--c-fatal); background: hsla(355,32%,48%,.05); border: 1px solid hsla(355,32%,48%,.2); border-radius: 4px; padding: 1px 7px; font-weight: 500; }

    .sb-card-top { display: flex; gap: var(--gap-md); align-items: flex-start; }
    .sb-card-left { flex: 0 0 160px; /* 固定图片列宽度 */ }
    .sb-card-right { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .sb-card-bottom { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }

    .sb-portrait-box { width: 100%; border-radius: 6px; overflow: hidden; border: 1px solid var(--c-border); background: var(--c-surface-alt); display: flex; justify-content: center; }
    .sb-portrait { width: 100%; object-fit: cover; display: block; cursor: zoom-in; transition: transform 0.2s ease; }
    .sb-portrait:hover { transform: scale(1.02); }

    #sb-lightbox {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); z-index: 999999; justify-content: center; align-items: center;
      cursor: zoom-out; backdrop-filter: blur(2px);

    #sb-lightbox-img {
      max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);

    .sb-mod { border-radius: 6px; padding: 9px; border: 1px solid var(--c-mod-border); background: var(--c-mod-bg); box-shadow: 0 1px 0 var(--c-shadow-light), 0 2px 6px var(--c-shadow-dark); transition: background 0.3s, border-color 0.3s; }
    .sb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
    .sb-grid-tight { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }

    @media (max-width: 480px) {
      .sb-container { padding: 4px; }
      .sb-grid, .sb-grid-tight { grid-template-columns: 1fr; }

    .sb-cell { display: flex; flex-direction: column; gap: 1px; min-width: 0; }

    .sb-label-blood { color: var(--c-blood); }
    .sb-label-secret { color: var(--c-secret); }

    .sb-inj-toggle { cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center; }

    .sb-inj-icon.is-collapsed { transform: rotate(-90deg); }

    /* ========== 修改处：颜色与内心话统一 ========== */
    .sb-val-inner { font-family: var(--font-inner); font-size: calc(16px * var(--sb-text-scale)); font-weight: bold; color: var(--c-inner); font-style: italic; letter-spacing: 0.5px; }
    .sb-iso-desc { font-family: var(--font-isolation); font-size: calc(15px * var(--sb-text-scale)); font-weight: bold; color: var(--c-inner); word-break: break-word; white-space: pre-wrap; flex: 1; min-width: 100px; letter-spacing: 0.5px; }

    .sb-val-secret { color: var(--c-secret-val); font-weight: 600; }

    .sb-inj { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
    .sb-inj-item { display: flex; flex-direction: column; gap: 2px; padding: 6px 10px; border-left: 3px solid var(--c-fatal); background: hsla(355, 20%, 55%, 0.1); border-radius: 0 4px 4px 0; }
    .sb-inj-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .sb-inj-part { font-family: var(--font-label); font-size: calc(13px * var(--sb-text-scale)); font-weight: 600; color: var(--c-blood); }
    .sb-inj-perp { font-family: var(--font-body); font-size: calc(12px * var(--sb-text-scale)); font-weight: 500; color: var(--c-text-muted); background: hsla(0,0%,0%,0.08); padding: 1px 6px; border-radius: 3px; }
    .sb-inj-detail { font-family: var(--font-body); font-size: calc(13px * var(--sb-text-scale)); font-weight: 500; color: var(--c-text); line-height: 1.4; word-break: break-word; white-space: pre-wrap; }

    .sb-pg-fill { height: 100%; transition: width 0.3s; border-radius: 3px; }

    .sb-pg-fill-danger { background: var(--c-blood); }
    .sb-pg-fill-fatal { background: var(--c-fatal); }
    .sb-pg-fill-muted { background: var(--c-text-dim); }
    .sb-pg-val { font-family: var(--font-body); font-size: calc(14px * var(--sb-text-scale)); font-weight: 500; flex-shrink: 0; min-width: 22px; text-align: right; color: var(--c-text); }

    .sb-row { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
    .sb-iso { padding: 1px 6px; border: 1px solid; font-size: calc(13px * var(--sb-text-scale)); font-weight: 700; letter-spacing: 1px; flex-shrink: 0; font-family: var(--font-isolation); border-radius: 4px; }

    .sb-tbl-val { font-family: var(--font-body); font-size: calc(14px * var(--sb-text-scale)); font-weight: 500; color: var(--c-text-muted); word-break: break-word; white-space: pre-wrap; }
  </style>
  <script type="module">
    // ==========================================
    // 【立绘图床配置区】
    // ==========================================
    const IMAGE_POOL = {
        '贺清寒': 'https://files.catbox.moe/hm2rw8.png',
        '陈麦': 'https://files.catbox.moe/fhovvc.png',
        '孙梦婷': 'https://files.catbox.moe/89j0zr.png',
        '林佳琪': 'https://files.catbox.moe/y00qgy.png',
        '林夏': 'https://files.catbox.moe/f2zt1t.png',
        '叶轻': 'https://files.catbox.moe/lqj7k6.png',
        '许知言': 'https://files.catbox.moe/su7miq.png',
        '彭小狸': 'https://files.catbox.moe/ghhhkd.png',
        '陆燃': 'https://files.catbox.moe/fxe9en.png'
    };

    if (typeof window.mvuSbConfig === 'undefined') {
        window.mvuSbConfig = {
            scale: parseFloat(localStorage.getItem('mvu_sb_scale')) || 1,
            theme: localStorage.getItem('mvu_sb_theme') || 'light',
            isExpanded: localStorage.getItem('mvu_sb_expanded') !== 'false',
            selectedChar: null,
            injExpanded: true // 默认展开伤痕记录
        };

        window.mvuSbApplyTheme = function() {
            document.documentElement.style.setProperty('--sb-text-scale', window.mvuSbConfig.scale);
            if (window.mvuSbConfig.theme === 'dark') {
                document.documentElement.setAttribute('data-sb-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-sb-theme');
            }
        };

        window.mvuSbApplyTheme();

        $(document).on('click', '.sb-btn-zoom-in', function(e) {
            e.stopPropagation();
            window.mvuSbConfig.scale = Math.min(2.0, window.mvuSbConfig.scale + 0.15);
            localStorage.setItem('mvu_sb_scale', window.mvuSbConfig.scale);
            window.mvuSbApplyTheme();
        });

        $(document).on('click', '.sb-btn-zoom-out', function(e) {
            e.stopPropagation();
            window.mvuSbConfig.scale = Math.max(0.6, window.mvuSbConfig.scale - 0.15);
            localStorage.setItem('mvu_sb_scale', window.mvuSbConfig.scale);
            window.mvuSbApplyTheme();
        });

        $(document).on('click', '.sb-btn-theme', function(e) {
            e.stopPropagation();
            window.mvuSbConfig.theme = window.mvuSbConfig.theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('mvu_sb_theme', window.mvuSbConfig.theme);
            window.mvuSbApplyTheme();
        });

        $(document).on('click', '.sb-bar', function(e) {
            if($(e.target).closest('.sb-controls').length) return;
            window.mvuSbConfig.isExpanded = !window.mvuSbConfig.isExpanded;
            localStorage.setItem('mvu_sb_expanded', window.mvuSbConfig.isExpanded);
            window.mvuSbRenderAll();
        });

        $(document).on('click', '.sb-avatar', function(e) {
            e.stopPropagation();
            window.mvuSbConfig.selectedChar = $(this).attr('data-name');
            window.mvuSbRenderAll();
        });

        $(document).on('click', '.sb-inj-toggle', function(e) {
            e.stopPropagation();
            window.mvuSbConfig.injExpanded = !window.mvuSbConfig.injExpanded;
            const $icon = $(this).find('.sb-inj-icon');
            const $list = $(this).next('.sb-inj');
            if (window.mvuSbConfig.injExpanded) {
                $icon.removeClass('is-collapsed');
                $list.slideDown(200);
            } else {
                $icon.addClass('is-collapsed');
                $list.slideUp(200);
            }
        });

        $(document).on('click', '.sb-portrait', function(e) {
            e.stopPropagation();
            const imgSrc = $(this).attr('src');
            $('#sb-lightbox-img').attr('src', imgSrc);
            $('#sb-lightbox').css('display', 'flex').hide().fadeIn(200);
        });

        $(document).on('click', '#sb-lightbox', function(e) {
            e.stopPropagation();
            $(this).fadeOut(200);
        });
    } else {
        window.mvuSbApplyTheme();
    }

    function getPortraitHtml(name) {
        const imgUrl = IMAGE_POOL[name];
        if (imgUrl) {
            return `<div class="sb-card-left"><div class="sb-portrait-box"><img class="sb-portrait" src="${imgUrl}" alt="${name}的立绘" title="点击放大查看原图"></div></div>`;
        }
        return '';
    }

    function renderVictimCard(name, data) {
      let injModHtml = '';
      if (data.伤痕 && typeof data.伤痕 === 'object' && Object.keys(data.伤痕).length > 0) {
          let items = '';
          for (const [part, detail] of Object.entries(data.伤痕)) {
              items += `<div class="sb-inj-item"><div class="sb-inj-head"><div class="sb-inj-part">${part}</div><div class="sb-inj-perp">${detail.施暴者 || '未知'}</div></div><div class="sb-inj-detail">${detail.成因 || ''}</div></div>`;
          }

          const iconClass = window.mvuSbConfig.injExpanded ? '' : 'is-collapsed';
          const listStyle = window.mvuSbConfig.injExpanded ? '' : 'display: none;';

          injModHtml = `
          <div class="sb-mod" style="margin-top: 8px;">
            <div class="sb-label sb-label-blood sb-inj-toggle" style="margin-bottom: 4px;">
              <span>伤痕记录</span>
              <span class="sb-inj-icon ${iconClass}">▼</span>
            </div>
            <div class="sb-inj" style="${listStyle}">${items}</div>
          </div>`;
      }

      const headHtml = `
        <div class="sb-head">
          <div class="sb-name">${name}</div>
          <div class="sb-grade">${data.年级 || '未知'}</div>
          <div class="sb-tear-dot">💧</div>
        </div>
      `;

      const topContentHtml = `
        <div class="sb-card-right">
          <div class="sb-mod">
            <div class="sb-grid">
              <div class="sb-cell"><div class="sb-label sb-label-navy">当前情绪</div><div class="sb-val sb-val-tear">${data.当前情绪 || '未知'}</div></div>
              <div class="sb-cell"><div class="sb-label sb-label-navy">当前地点</div><div class="sb-val sb-val-muted">${data.当前地点 || '未知'}</div></div>
              <div class="sb-cell-full"><div class="sb-label sb-label-navy">当前动作</div><div class="sb-val sb-val-muted">${data.当前动作 || '未知'}</div></div>
              <div class="sb-cell-full"><div class="sb-label sb-label-navy">性格</div><div class="sb-val sb-val-muted">${data.性格 || '未知'}</div></div>
              ${data.身体条件 && data.身体条件 !== '正常' ? `<div class="sb-cell-full"><div class="sb-label sb-label-navy">身体条件</div><div class="sb-val sb-val-warn">${data.身体条件}</div></div>` : ''}
              <div class="sb-cell-full"><div class="sb-label sb-label-navy">内心话</div><div class="sb-val sb-val-inner">${data.内心话 || '...'}</div></div>
            </div>
          </div>
        </div>
      `;

      const bottomContentHtml = `
        <div class="sb-card-bottom">
          <div class="sb-mod">
            <div class="sb-grid-tight">
              <div class="sb-pg"><div class="sb-pg-label">好感</div><div class="sb-pg-track"><div class="sb-pg-fill sb-pg-fill-warm" style="width: ${data.对User的好感 || 0}%"></div></div><div class="sb-pg-val">${data.对User的好感 || 0}</div></div>
              <div class="sb-pg"><div class="sb-pg-label">恐惧</div><div class="sb-pg-track"><div class="sb-pg-fill sb-pg-fill-danger" style="width: ${data.对User的恐惧 || 0}%"></div></div><div class="sb-pg-val">${data.对User的恐惧 || 0}</div></div>
            </div>
          </div>

          <div class="sb-mod">
            <div class="sb-grid">
              <div class="sb-cell-full"><div class="sb-label sb-label-purp">班级孤立度</div><div class="sb-row"><div class="sb-iso" data-stage="${data.班级孤立度?.阶段 || '一阶'}">${data.班级孤立度?.阶段 || '未知'}</div><div class="sb-iso-desc">${data.班级孤立度?.描述 || '暂无'}</div></div></div>
              <div class="sb-cell"><div class="sb-label sb-label-purp">名声</div><div class="sb-val sb-val-muted">${data.名声 || '未知'}</div></div>
              <div class="sb-cell-full"><div class="sb-label sb-label-secret">秘密</div><div class="sb-val sb-val-secret">${data.秘密 || '未知'}</div></div>
              <div class="sb-cell-full"><div class="sb-label sb-label-purp">自我评价</div><div class="sb-val sb-val-muted">${data.自我评价 || '未知'}</div></div>
            </div>
          </div>

          <div class="sb-mod">
            <table class="sb-tbl">
              <tr><td class="sb-tbl-label">服装</td><td class="sb-tbl-val">${data.服装 || '未知'}</td></tr>
              <tr><td class="sb-tbl-label">外貌</td><td class="sb-tbl-val">${data.外貌 || '未知'}</td></tr>
              ${data.性器官描写 && data.性器官描写 !== '待初始化' ? `<tr><td class="sb-tbl-label">私密</td><td class="sb-tbl-val">${data.性器官描写}</td></tr>` : ''}
            </table>
          </div>
        </div>
      `;

      return `
      <div class="sb-card sb-victim">
        ${headHtml}
        <div class="sb-card-top">
          ${getPortraitHtml(name)}
          ${topContentHtml}
        </div>
        ${injModHtml}
        ${bottomContentHtml}
      </div>`;
    }

    function renderBullyCard(name, data) {
      const headHtml = `
        <div class="sb-head">
          <div class="sb-name">${name}</div>
          <div class="sb-grade">${data.年级 || '未知'}</div>
          ${data.当前猎物 ? `<div class="sb-prey">🎯 猎物: ${data.当前猎物}</div>` : ''}
        </div>
      `;

      const topContentHtml = `
        <div class="sb-card-right">
          <div class="sb-mod">
            <div class="sb-grid">
              <div class="sb-cell"><div class="sb-label sb-label-blood">当前情绪</div><div class="sb-val sb-val-muted">${data.当前情绪 || '未知'}</div></div>
              <div class="sb-cell"><div class="sb-label sb-label-blood">当前地点</div><div class="sb-val sb-val-muted">${data.当前地点 || '未知'}</div></div>
              <div class="sb-cell-full"><div class="sb-label sb-label-blood">当前动作</div><div class="sb-val sb-val-muted">${data.当前动作 || '未知'}</div></div>
              <div class="sb-cell-full"><div class="sb-label sb-label-blood">性格</div><div class="sb-val sb-val-muted">${data.性格 || '未知'}</div></div>
              <div class="sb-cell-full"><div class="sb-label sb-label-blood">内心话</div><div class="sb-val sb-val-inner">${data.内心话 || '...'}</div></div>
            </div>
          </div>
        </div>
      `;

      const bottomContentHtml = `
        <div class="sb-card-bottom">
          <div class="sb-mod">
            <div class="sb-grid">
              <div class="sb-cell-full"><div class="sb-label sb-label-purp">🕰 历史欺凌事件</div><div class="sb-val sb-val-hist">${data.历史欺凌事件 || '无'}</div></div>
              <div class="sb-cell-full" style="margin-top: 6px;"><div class="sb-label sb-label-secret">秘密</div><div class="sb-val sb-val-secret">${data.秘密 || '未知'}</div></div>
            </div>
          </div>

          <div class="sb-mod">
            <table class="sb-tbl">
              <tr><td class="sb-tbl-label">服装</td><td class="sb-tbl-val">${data.服装 || '未知'}</td></tr>
              <tr><td class="sb-tbl-label">外貌</td><td class="sb-tbl-val">${data.外貌 || '未知'}</td></tr>
              ${data.性器官描写 && data.性器官描写 !== '待初始化' ? `<tr><td class="sb-tbl-label">私密</td><td class="sb-tbl-val">${data.性器官描写}</td></tr>` : ''}
            </table>
          </div>
        </div>
      `;

      return `
      <div class="sb-card sb-bully">
        ${headHtml}
        <div class="sb-card-top">
          ${getPortraitHtml(name)}
          ${topContentHtml}
        </div>
        ${bottomContentHtml}
      </div>`;
    }

    window.mvuSbRenderAll = function() {
      const all_variables = getAllVariables();
      const stat_data = _.get(all_variables, 'stat_data', {});

      const sys = stat_data.系统 || {};
      const user = stat_data.User || {};
      const victims = stat_data.被欺凌者 || {};
      const bullies = stat_data.欺凌者 || {};

      const allChars = [];
      Object.entries(victims).forEach(([name, data]) => { allChars.push({ name, type: 'victim', data }); });
      Object.entries(bullies).forEach(([name, data]) => { allChars.push({ name, type: 'bully', data }); });

      if (allChars.length > 0 && (!window.mvuSbConfig.selectedChar || !allChars.find(c => c.name === window.mvuSbConfig.selectedChar))) {
          window.mvuSbConfig.selectedChar = allChars[0].name;
      }

      $('.sb-frame').each(function() {
          const frame = $(this);

          frame.find('.sb-time').text(sys.时间 || '未知时间');
          frame.find('.sb-loc').text(sys.地点 || '未知地点');

          const vLvl = sys.校园暴力严重程度?.等级 || 'D';
          frame.find('.sb-badge').text(vLvl).attr('data-level', vLvl);
          frame.find('.sb-desc').text(sys.校园暴力严重程度?.描述 || '和平');

          const uStat = user.状态 || '保护中';
          frame.find('.sb-ustat').text(uStat).attr('data-status', uStat);

          const bar = frame.find('.sb-bar');
          const bodyContainer = frame.find('.sb-body');

          if (window.mvuSbConfig.isExpanded) {
              let avatarHtml = '';
              if (allChars.length > 0) {
                  avatarHtml = `<div class="sb-avatar-bar">`;
                  allChars.forEach(c => {
                      const isActive = c.name === window.mvuSbConfig.selectedChar ? 'is-active' : '';
                      const cls = c.type === 'victim' ? 'sb-avatar-victim' : 'sb-avatar-bully';
                      avatarHtml += `<div class="sb-avatar ${cls} ${isActive}" data-name="${c.name}">${c.name}</div>`;
                  });
                  avatarHtml += `</div>`;
              }

              let cardHtml = '';
              const selectedChar = allChars.find(c => c.name === window.mvuSbConfig.selectedChar);
              if (selectedChar) {
                  cardHtml = selectedChar.type === 'victim' ? renderVictimCard(selectedChar.name, selectedChar.data) : renderBullyCard(selectedChar.name, selectedChar.data);
              }

              bodyContainer.html(`
                  <div class="sb-evt">
                      <div class="sb-evt-label">当前事件</div>
                      <div class="sb-evt-content">${sys.事件 || '无'}</div>
                  </div>
                  ${avatarHtml}
                  ${cardHtml}
              `).show();
              bar.addClass('is-expanded');
          } else {
              bodyContainer.hide();
              bar.removeClass('is-expanded');
          }
      });
    };

    async function init() {
      await waitGlobalInitialized('Mvu');
      window.mvuSbRenderAll();

      if (!window.mvuSbUpdateBound) {
          window.mvuSbUpdateBound = true;
          eventOn(Mvu.events.VARIABLE_UPDATE_ENDED, () => {
              window.mvuSbRenderAll();
          });
      }
    }

    $(errorCatched(init));
  </script>
</head>
