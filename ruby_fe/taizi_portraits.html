<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>完整角色立绘图鉴</title>
    <style>
        :root {
            --st-ink: #1b1110; --st-wine: #632b2a; --st-wine2: #8d4740;
            --st-gold: #c7a56a; --st-gold2: #ead29a; --st-paper: #f5ecdc;
            --st-paper2: #e9dbc6; --st-jade: #54756a; --st-text: #352923; --st-muted: #8b7768;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: "STZhongsong", "Songti SC", "Noto Serif SC", serif;
            background: linear-gradient(135deg, #1a0f0f 0%, #0d0707 100%);
            color: var(--st-paper);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* View Management */
        .view {
            display: none;
            flex-direction: column;
            width: 100%;
            flex: 1;
            animation: fadeIn 0.4s ease forwards;
        }

        .view.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Selection View Styles --- */
        .selection-header {
            text-align: center;
            padding: 40px 20px 20px;
            position: relative;
        }

        .selection-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 6px;
            margin-bottom: 8px;
            color: var(--st-gold2);
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .selection-header p {
            color: #d9c8ae;
            font-size: 14px;
            letter-spacing: 2px;
        }

        .carousel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
            overflow: hidden;
        }

        .nav-btn {
            background: linear-gradient(135deg, rgba(59,27,25,0.8), rgba(119,52,46,0.8));
            border: 1px solid rgba(199,165,106,0.8);
            color: #f5e3b8;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
            box-shadow: 0 8px 22px rgba(0,0,0,.35);
        }

        .nav-btn:active {
            transform: scale(0.9);
            background: var(--st-wine);
        }

        .prev-btn { margin-right: 10px; }
        .next-btn { margin-left: 10px; }

        .card-wrapper {
            position: relative;
            width: 100%;
            max-width: 320px;
            aspect-ratio: 9 / 14;
            cursor: pointer;
            perspective: 1000px;
        }

        .main-card {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            overflow: hidden;
            background: linear-gradient(135deg, #211313, #120b0b);
            border: 1px solid var(--st-gold);
            box-shadow: 0 0 0 3px rgba(199,165,106,.12), 0 24px 70px rgba(0,0,0,.42);
            position: relative;
            transition: transform 0.3s ease;
        }

        .main-card:before {
            content: "";
            position: absolute;
            inset: 8px;
            border: 1px solid rgba(234,210,154,.2);
            pointer-events: none;
            z-index: 5;
            border-radius: 8px;
        }

        .main-card:active {
            transform: scale(0.97);
        }

        .main-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: saturate(.92) contrast(1.04);
        }

        .card-info {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 60px 20px 25px;
            background: linear-gradient(to top, rgba(17,9,8,0.95) 0%, transparent 100%);
            text-align: center;
            z-index: 6;
        }

        .card-name {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--st-gold2);
            margin-bottom: 4px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .card-hint {
            font-size: 13px;
            color: #d9c8ae;
            letter-spacing: 2px;
            font-style: italic;
        }

        .pagination {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 20px;
            max-width: 90%;
            margin: 0 auto;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(199,165,106,.3);
            border: 1px solid rgba(199,165,106,.5);
            transition: all 0.3s;
            cursor: pointer;
        }

        .dot.active {
            background: var(--st-gold2);
            border-color: var(--st-gold2);
            transform: scale(1.2);
            box-shadow: 0 0 8px rgba(234,210,154,.6);
        }

        /* --- Detail View Styles --- */
        .detail-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(90deg,#24110f,#6d3029,#24110f);
            border-bottom: 1px solid var(--st-gold);
            display: flex;
            align-items: center;
            padding: 16px 20px;
            gap: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--st-gold2);
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 8px 0;
            font-family: inherit;
            letter-spacing: 1px;
        }

        .detail-title {
            font-size: 18px;
            font-weight: 700;
            flex: 1;
            color: var(--st-gold2);
            letter-spacing: 2px;
        }

        .gallery-container {
            padding: 20px;
            overflow-y: auto;
            background: radial-gradient(circle at 100% 0,rgba(199,165,106,.1),transparent 33%), #120b0b;
            flex: 1;
        }

        .section-title {
            margin: 30px 0 16px;
            font-size: 20px;
            font-weight: 700;
            padding-left: 12px;
            border-left: 4px solid var(--st-wine2);
            color: var(--st-gold2);
            letter-spacing: 2px;
        }

        .section-title:first-child {
            margin-top: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media (min-width: 600px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
            .card-wrapper { max-width: 400px; }
        }

        @media (min-width: 900px) {
            .grid { grid-template-columns: repeat(4, 1fr); }
            .card-wrapper { max-width: 450px; }
        }

        .grid-item {
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(173,132,82,.45);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, border-color 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .grid-item:hover {
            transform: translateY(-3px);
            border-color: var(--st-gold);
        }

        .grid-thumb {
            width: 100%;
            aspect-ratio: 3 / 4;
            background: #110908;
            position: relative;
        }

        .grid-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .grid-info {
            padding: 12px;
            text-align: center;
            background: linear-gradient(180deg, rgba(36,17,15,0.8), rgba(17,9,8,0.9));
            border-top: 1px solid rgba(173,132,82,.3);
        }

        .grid-tag {
            font-size: 13px;
            color: var(--st-gold2);
            font-weight: 500;
            letter-spacing: 1px;
        }

        .swipe-area {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <!-- Selection View -->
    <div id="selection-view" class="view active">
        <div class="selection-header">
            <h1>❖ 人物档案图鉴 ❖</h1>
            <p>左右滑动切换，点击卷轴查看详情</p>
        </div>

        <div class="carousel">

            <div class="swipe-area" id="swipe-area">

                        <div class="card-info">
                            <div class="card-name" id="main-name">加载中...</div>
                            <div class="card-hint">✦ 点击展开专属画卷 ✦</div>
                        </div>
                    </div>
                </div>
            </div>

            <button class="nav-btn next-btn" onclick="nextChar()">&#10095;</button>
        </div>

        <div class="pagination" id="pagination"></div>
    </div>

    <!-- Detail View -->
    <div id="detail-view" class="view">
        <div class="detail-nav">
            <button class="back-btn" onclick="closeDetail()">

                收起画卷
            </button>
            <div class="detail-title" id="detail-title">角色全立绘</div>
        </div>

        <div class="gallery-container" id="gallery-container"></div>
    </div>

        let currentIndex = 0;

        const mainAvatar = document.getElementById('main-avatar');
        const mainName = document.getElementById('main-name');
        const pagination = document.getElementById('pagination');
        const selectionView = document.getElementById('selection-view');
        const detailView = document.getElementById('detail-view');
        const galleryContainer = document.getElementById('gallery-container');
        const detailTitle = document.getElementById('detail-title');

        function init() {
            charactersData.forEach((_, index) => {
                const dot = document.createElement('div');
                dot.className = 'dot';

                dot.onclick = () => {
                    currentIndex = index;
                    updateCarousel();
                };

                pagination.appendChild(dot);
            });

            updateCarousel();
            setupTouchSwipe();
        }

        function updateCarousel() {
            const char = charactersData[currentIndex];

            if (char.mainImage) {
                mainAvatar.src = char.mainImage;
            }

            mainName.textContent = char.name;

            Array.from(pagination.children).forEach((dot, index) => {
                dot.className = index === currentIndex ? 'dot active' : 'dot';
            });
        }

        function prevChar() {
            currentIndex =
                (currentIndex - 1 + charactersData.length) %
                charactersData.length;

            updateCarousel();
        }

        function nextChar() {
            currentIndex =
                (currentIndex + 1) %
                charactersData.length;

            updateCarousel();
        }

        function setupTouchSwipe() {
            const el = document.getElementById('swipe-area');

            let touchStartX = 0;
            let touchEndX = 0;

            el.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            });

            el.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;

                const threshold = 40;

                if (touchEndX < touchStartX - threshold) {
                    nextChar();
                }

                if (touchEndX > touchStartX + threshold) {
                    prevChar();
                }
            });
        }

        function openDetail() {
            const char = charactersData[currentIndex];

            detailTitle.textContent =
                `❖ ${char.name} · 专属画卷 ❖`;

            buildGallery(char);

            selectionView.classList.remove('active');
            detailView.classList.add('active');

            window.scrollTo(0, 0);
        }

        function closeDetail() {
            detailView.classList.remove('active');
            selectionView.classList.add('active');
        }

        function buildGallery(char) {
            galleryContainer.innerHTML = '';

            const renderSection = (title, urls) => {
                if (!urls || urls.length === 0) return;

                const section = document.createElement('div');

                section.innerHTML =
                    `<div class="section-title">${title}</div>`;

                const grid = document.createElement('div');
                grid.className = 'grid';

                urls.forEach((url, idx) => {
                    const div = document.createElement('div');

                    div.className = 'grid-item';

                    div.innerHTML = `
                        <div class="grid-thumb">
                            <img
                                src="${url}"
                                loading="lazy"
                                onclick="window.open('${url}', '_blank')"
                                style="cursor:pointer;"
                            >
                        </div>
                        <div class="grid-info">
                            <div class="grid-tag">
                                画卷 · ${idx + 1}
                            </div>
                        </div>
                    `;

                    grid.appendChild(div);
                });

                section.appendChild(grid);
                galleryContainer.appendChild(section);
            };

            renderSection('人物立绘', char.gallery.lihui);
            renderSection('日常情境', char.gallery.daily);
            renderSection('私密档案 (NSFW)', char.gallery.nsfw);
        }

        init();
    </script>
</body>
</html>
