              versionText.textContent = "🔄 翻转全部立绘";
              cards.forEach(function(card, index) {
                setTimeout(function() { card.classList.remove("is-flipped"); }, index * 80);
              });
            }
          };

          document.addEventListener("click", function(ev) {
            var img = ev.target && ev.target.closest ? ev.target.closest("img[data-clicks]") : null;
            if (!img) return;
            var xpId2 = img.getAttribute("data-xp");
            if (!xpId2 || !MODULE_PORTRAITS[xpId2]) return;
            var list = img.getAttribute("data-clicks").split("|");
            if (!list.length) return;
            var idx = (parseInt(img.getAttribute("data-idx") || "0", 10) + 1) % list.length;
            img.setAttribute("data-idx", String(idx));
            var slot = list[idx].split(":");
            var nx = MODULE_PORTRAITS[xpId2](slot[0], slot[1], parsed.sceneType);
            if (nx && nx.url) img.src = nx.url;
          });
        })();
      </script>
    </div>
  </body>
</html>
